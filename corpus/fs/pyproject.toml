[build-system]
requires = [ "setuptools >=38.3.0",]
build-backend = "setuptools.build_meta"

[project]
version = "2.4.16"
name = "fs"
description = "Python's filesystem abstraction layer"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: System :: Filesystems", "Typing :: Typed",]
dependencies = [ "appdirs~=1.4.3", "setuptools", "six ~=1.10", "enum34 ~=1.1.6      ;  python_version < '3.4'", "typing ~=3.6        ;  python_version < '3.6'", "backports.os ~=0.1  ;  python_version < '3.0'",]

[[project.authors]]
name = "Will McGugan"
email = "will@willmcgugan.com"

[[project.maintainers]]
name = "Martin Larralde"
email = "martin.larralde@embl.de"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/PyFilesystem/pyfilesystem2"
"Bug Reports" = "https://github.com/PyFilesystem/pyfilesystem2/issues"
Documentation = "https://pyfilesystem2.readthedocs.io/en/latest/"
Wiki = "https://www.pyfilesystem.org/"

[project.optional-dependencies]
scandir = [ "scandir~=1.5        ;  python_version < '3.5'",]

[tool.setuptools]
zip-safe = false
platforms = [ "any",]
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
fs = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
