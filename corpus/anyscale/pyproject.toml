[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anyscale"
version = "0.26.102"
description = "Command Line Interface for Anyscale"
readme = "README.md"
license = {text = "AS License"}
authors = [
    {name = "Anyscale Inc."},
]
requires-python = ">=3.9,<3.14"
dependencies = [
    "boto3>=1.26.76",
    "botocore>=1.19.52",
    "aiohttp>=3.7.4.post0",
    "certifi>=2024.8.30",
    "Click>=7.0",
    "colorama",
    "google-auth",
    "jsonpatch",
    "jsonschema",
    "kubernetes",
    "oauth2client",
    "packaging",
    "pathspec>=0.8.1",
    "python-dateutil",
    "requests",
    "rich",
    "six>=1.10",
    "tabulate",
    "urllib3>=1.26.17",
    "wrapt",
    "pyyaml",
    "smart_open",
    "tqdm",
    "tzlocal",
    "humanize",
    "typing_extensions",
    "termcolor>=1.1.0",
    "colorama>=0.3.9",
    "websockets; python_version > \"3.8\"",
    "websockets==13.1.0; python_version <= \"3.8\"",
]

[project.optional-dependencies]
gcp = [
    "google-api-python-client",
    "google-cloud-secret-manager",
    "google-cloud-compute",
    "google-cloud-resource-manager",
    "google-cloud-filestore",
    "google-cloud-storage",
    "google-cloud-redis",
    "google-cloud-certificate-manager",
]
azure = [
    "azure-identity",
    "azure-mgmt-resource>=25.0.0",
    "azure-mgmt-resource-deployments",
    "azure-storage-blob",
]
all = [
    "google-api-python-client",
    "google-cloud-secret-manager",
    "google-cloud-compute",
    "google-cloud-resource-manager",
    "google-cloud-filestore",
    "google-cloud-storage",
    "google-cloud-redis",
    "google-cloud-certificate-manager",
    "azure-identity",
    "azure-mgmt-resource>=25.0.0",
    "azure-mgmt-resource-deployments",
    "azure-storage-blob",
    "ray>=2.0.0",
]
backend = [
    "google-api-python-client",
    "google-cloud-secret-manager",
    "google-cloud-compute",
    "google-cloud-resource-manager",
    "google-cloud-filestore",
    "google-cloud-storage",
    "google-cloud-redis",
    "google-cloud-certificate-manager",
    "terminado",
    "tornado",
]

[project.scripts]
anyscale = "anyscale.scripts:main"

[tool.setuptools]
packages = [
    "anyscale",
    "anyscale.webterminal",
    "anyscale.user",
    "anyscale.schedule",
    "anyscale.api_utils",
    "anyscale.commands",
    "anyscale.background",
    "anyscale.connect_utils",
    "anyscale.formatters",
    "anyscale.job",
    "anyscale.image",
    "anyscale.controllers",
    "anyscale.aggregated_instance_usage",
    "anyscale.organization_invitation",
    "anyscale.skills",
    "anyscale.utils",
    "anyscale.cloud",
    "anyscale.service_account",
    "anyscale.shared_anyscale_utils",
    "anyscale.user_group",
    "anyscale.resource_quota",
    "anyscale.workspace",
    "anyscale.service",
    "anyscale.policy",
    "anyscale.project",
    "anyscale.anyscale_pydantic",
    "anyscale.job_queue",
    "anyscale.compute_config",
    "anyscale.api_utils.exceptions",
    "anyscale.commands.anyscale_api",
    "anyscale.skills._private",
    "anyscale.utils.imports",
    "anyscale.shared_anyscale_utils.tests",
    "anyscale.shared_anyscale_utils.utils",
]
license-files = ["LICENSE", "NOTICE"]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "anyscale/webterminal/bash-preexec.sh",
    "anyscale/_private/docgen/api.md",
    "anyscale/_private/docgen/models.md",
    "requirements.in",
    "*.yaml",
    "*.json",
    "../anyscale/client/.gitignore",
    "../anyscale/client/.openapi-generator-ignore",
