[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-freezegun"
version = "1.1.10"
description = "Typing stubs for freezegun"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for freezegun\n\nThis is a PEP 561 type stub package for the `freezegun` package.\nIt can be used by type-checking tools like mypy, PyCharm, pytype etc. to check code\nthat uses `freezegun`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/master/stubs/freezegun. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `freezegun` package includes type annotations or type stubs\nsince version 1.2.1. Please uninstall the `types-freezegun`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/master/README.md for more details.\nThis package was generated from typeshed commit `81fd55a885e678559471710f249c7e27d02ec212`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/freezegun.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "freezegun-stubs",]
include-package-data = false

[tool.setuptools.package-data]
freezegun-stubs = [ "__init__.pyi", "api.pyi", "METADATA.toml",]
