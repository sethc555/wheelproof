[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "alibabacloud_credentials"
version = "1.0.9"
description = "The alibabacloud credentials module of alibabaCloud Python SDK."
keywords = [ "alibabacloud", "sdk", "tea",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development",]
requires-python = ">=3.7"
dependencies = [ "alibabacloud-tea>=0.4.0", "alibabacloud_credentials_api>=1.0.0, <2.0.0", "APScheduler>=3.10.0, <4.0.0", "aiofiles>=22.1.0, <25.0.0",]

[[project.authors]]
name = "Alibaba Cloud"
email = "alibaba-cloud-sdk-dev-team@list.alibaba-inc.com"

[project.license]
text = "Apache License 2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/aliyun/credentials-python"

[tool.setuptools]
platforms = [ "any",]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
