[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "piexif"
version = "1.1.3"
description = "To simplify exif manipulations with python. Writing, reading, and more..."
keywords = [ "exif", "jpeg",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Operating System :: OS Independent", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: IronPython", "Programming Language :: Python :: Implementation :: PyPy", "License :: OSI Approved :: MIT License", "Topic :: Multimedia", "Topic :: Printing",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
[[project.authors]]
name = "hMatoba"
email = "hiroaki.mtb@outlook.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/hMatoba/Piexif"

[tool.setuptools]
packages = [ "piexif",]
include-package-data = false
