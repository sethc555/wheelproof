[build-system]
requires = [ "setuptools>=61.2", "pytest-runner",]
build-backend = "setuptools.build_meta"

[project]
name = "ffmpeg-python"
version = "0.2.0"
description = "Python bindings for FFmpeg - with complex filtering support"
keywords = [ "-vf", "a/v", "audio", "dsp", "FFmpeg", "ffmpeg", "ffprobe", "filtering", "filter_complex", "movie", "render", "signals", "sound", "streaming", "streams", "vf", "video", "wrapper", "aac", "ac3", "avi", "bmp", "flac", "gif", "mov", "mp3", "mp4", "png", "raw", "rawvideo", "wav", ".aac", ".ac3", ".avi", ".bmp", ".flac", ".gif", ".mov", ".mp3", ".mp4", ".png", ".raw", ".rawvideo", ".wav",]
classifiers = [ "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6",]
dependencies = [ "future",]
[[project.authors]]
name = "Karl Kroening"
email = "karlk@kralnet.us"

[project.readme]
text = "ffmpeg-python: Python bindings for FFmpeg\n=========================================\n\n:Github: https://github.com/kkroening/ffmpeg-python\n:API Reference: https://kkroening.github.io/ffmpeg-python/"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/kkroening/ffmpeg-python"
Download = "https://github.com/kkroening/ffmpeg-python/archive/v0.2.0.zip"

[project.optional-dependencies]
dev = [ "future==0.17.1", "numpy==1.16.4", "pytest-mock==1.10.4", "pytest==4.6.1", "Sphinx==2.1.0", "tox==3.12.1",]
testing = [ "pytest", "pytest-mock",]

[tool.setuptools]
packages = [ "ffmpeg",]
include-package-data = false
