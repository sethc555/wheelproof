[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-videointelligence"
version = "2.19.0"
description = "Google Cloud Videointelligence API client library"
requires-python = ">=3.9"
dependencies = ["google-api-core[grpc] >= 2.11.0, <3.0.0", "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0", "grpcio >= 1.33.2, < 2.0.0", "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'", "proto-plus >= 1.22.3, <2.0.0", "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'", "protobuf >= 4.25.8, < 8.0.0"]
classifiers = ["Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: OS Independent", "Topic :: Internet"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[[project.authors]]
name = "Google LLC"
email = "googleapis-packages@google.com"

[project.license]
text = "Apache 2.0"

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-videointelligence"

[tool.setuptools]
platforms = ["Posix; MacOS X; Windows"]
packages = ["google", "google.cloud", "google.cloud.videointelligence", "google.cloud.videointelligence_v1p1beta1", "google.cloud.videointelligence_v1beta2", "google.cloud.videointelligence_v1p2beta1", "google.cloud.videointelligence_v1", "google.cloud.videointelligence_v1p3beta1", "google.cloud.videointelligence_v1p1beta1.services", "google.cloud.videointelligence_v1p1beta1.types", "google.cloud.videointelligence_v1p1beta1.services.video_intelligence_service", "google.cloud.videointelligence_v1p1beta1.services.video_intelligence_service.transports", "google.cloud.videointelligence_v1beta2.services", "google.cloud.videointelligence_v1beta2.types", "google.cloud.videointelligence_v1beta2.services.video_intelligence_service", "google.cloud.videointelligence_v1beta2.services.video_intelligence_service.transports", "google.cloud.videointelligence_v1p2beta1.services", "google.cloud.videointelligence_v1p2beta1.types", "google.cloud.videointelligence_v1p2beta1.services.video_intelligence_service", "google.cloud.videointelligence_v1p2beta1.services.video_intelligence_service.transports", "google.cloud.videointelligence_v1.services", "google.cloud.videointelligence_v1.types", "google.cloud.videointelligence_v1.services.video_intelligence_service", "google.cloud.videointelligence_v1.services.video_intelligence_service.transports", "google.cloud.videointelligence_v1p3beta1.services", "google.cloud.videointelligence_v1p3beta1.types", "google.cloud.videointelligence_v1p3beta1.services.streaming_video_intelligence_service", "google.cloud.videointelligence_v1p3beta1.services.video_intelligence_service", "google.cloud.videointelligence_v1p3beta1.services.streaming_video_intelligence_service.transports", "google.cloud.videointelligence_v1p3beta1.services.video_intelligence_service.transports"]
include-package-data = true
