[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "markdowntable"
version = "6.0.0"
description = "Easy way to make markdown code for tables"
requires-python = ">=3.7"

[[project.authors]]
name = "PythonCoderAS"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/PokestarFan/Python-Markdown-Table"

[tool.setuptools]
packages = [ "markdowntable",]
include-package-data = false
