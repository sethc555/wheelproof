[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-chardet"
version = "5.0.4.6"
description = "Typing stubs for chardet"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for chardet\n\nThis is a PEP 561 type stub package for the `chardet` package. It\ncan be used by type-checking tools like\n[mypy](https://github.com/python/mypy/),\n[pyright](https://github.com/microsoft/pyright),\n[pytype](https://github.com/google/pytype/),\nPyCharm, etc. to check code that uses\n`chardet`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/main/stubs/chardet. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `chardet` package includes type annotations or type stubs\nsince version 5.1.0. Please uninstall the `types-chardet`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/main/README.md for more details.\nThis package was generated from typeshed commit `d1bfd08b4bc843227d097decfd99d70272a1f804`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/chardet.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "chardet-stubs",]
include-package-data = false

[tool.setuptools.package-data]
chardet-stubs = [ "__init__.pyi", "enums.pyi", "langbulgarianmodel.pyi", "langcyrillicmodel.pyi", "langgreekmodel.pyi", "langhebrewmodel.pyi", "langhungarianmodel.pyi", "langthaimodel.pyi", "langturkishmodel.pyi", "universaldetector.pyi", "version.pyi", "METADATA.toml",]
