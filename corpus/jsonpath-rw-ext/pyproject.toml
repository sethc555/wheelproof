[build-system]
requires = [ "setuptools>=61.2", "pbr",]
build-backend = "setuptools.build_meta"

[project]
name = "jsonpath-rw-ext"
description = "Extensions for JSONPath RW"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4",]
readme = "README.rst"
dynamic = [ "version",]
[[project.authors]]
name = "Mehdi Abaakouk"
email = "sileht@sileht.net"

[project.urls]
Homepage = "https://github.com/sileht/python-jsonpath-rw-ext"

[tool.setuptools]
include-package-data = false
