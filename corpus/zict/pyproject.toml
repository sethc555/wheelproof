[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "zict"
version = "3.0.0"
description = "Mutable mapping tools"
keywords = [ "mutable mapping", "dict", "dask",]
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",]
requires-python = ">=3.8"
dependencies = []
[[project.maintainers]]
name = "Matthew Rocklin"
email = "mrocklin@coiled.io"

[project.license]
text = "BSD"

[project.readme]
text = "Mutable Mapping tools. See `documentation`_.\n\n.. _documentation: http://zict.readthedocs.io/en/latest/"
content-type = "text/x-rst"

[project.urls]
Homepage = "http://zict.readthedocs.io/en/latest/"

[tool.setuptools]
packages = [ "zict",]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
zict = [ "py.typed",]
