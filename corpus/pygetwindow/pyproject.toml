[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "PyGetWindow"
version = "0.0.9"
description = "A simple, cross-platform module for obtaining GUI information on application's windows."
keywords = [ "gui", "window", "geometry", "resize", "minimize", "maximize", "close", "title",]
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Win32 (MS Windows)", "Environment :: X11 Applications", "Environment :: MacOS X", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7",]
dependencies = [ "pyrect",]
[[project.authors]]
name = "Al Sweigart"
email = "al@inventwithpython.com"

[project.license]
text = "BSD"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/asweigart/pygetwindow"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false
