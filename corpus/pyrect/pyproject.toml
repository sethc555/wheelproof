[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "PyRect"
version = "0.2.0"
description = "PyRect is a simple module with a Rect class for Pygame-like rectangular areas."
keywords = [ "pygame", "rect", "rectangular", "rectangle", "area",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Win32 (MS Windows)", "Environment :: MacOS X", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.5", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.1", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",]
dependencies = []
[[project.authors]]
name = "Al Sweigart"
email = "al@inventwithpython.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/asweigart/pyrect"

[tool.setuptools]
packages = [ "pyrect",]
include-package-data = false
