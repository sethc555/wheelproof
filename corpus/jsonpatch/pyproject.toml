[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonpatch"
version = "1.33"
description = " Apply JSON-Patches (RFC 6902) "
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*, !=3.6.*"
dependencies = ["jsonpointer>=1.9"]
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries", "Topic :: Utilities"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[[project.authors]]
name = "Stefan Kögl"
email = "stefan@skoegl.net"

[project.license]
text = "Modified BSD License"

[project.urls]
Homepage = "https://github.com/stefankoegl/python-json-patch"
Website = "https://github.com/stefankoegl/python-json-patch"
Repository = "https://github.com/stefankoegl/python-json-patch.git"
Documentation = "https://python-json-patch.readthedocs.org/"
PyPI = "https://pypi.org/pypi/jsonpatch"
Tests = "https://travis-ci.org/stefankoegl/python-json-patch"
"Test Coverage" = "https://coveralls.io/r/stefankoegl/python-json-patch"

[tool.setuptools]
py-modules = ["jsonpatch"]
script-files = ["bin/jsondiff", "bin/jsonpatch"]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["requirements.txt"]

[tool.distutils.bdist_wheel]
universal = true
