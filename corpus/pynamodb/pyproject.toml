[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pynamodb"
version = "6.1.0"
description = "A Pythonic Interface to DynamoDB"
keywords = [ "python", "dynamodb", "amazon",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Programming Language :: Python", "Operating System :: OS Independent", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "License :: OSI Approved :: MIT License",]
requires-python = ">=3.7"
dependencies = [ "botocore>=1.12.54", "typing-extensions>=4; python_version<\"3.11\"",]

[[project.authors]]
name = "Jharrod LaFon"
email = "jlafon@eyesopen.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "http://jlafon.io/pynamodb.html"
Source = "https://github.com/pynamodb/PynamoDB"

[project.optional-dependencies]
signals = [ "blinker>=1.3,<2.0",]

[tool.setuptools]
zip-safe = false
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
pynamodb = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "examples", "tests", "typing_tests", "tests.integration",]
namespaces = false
