[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
version = "1.1.3"
description = "A lightweight console printing and formatting toolkit"
name = "wasabi"
requires-python = ">=3.6"
dependencies = [ "colorama >= 0.4.6; sys_platform == \"win32\" and python_version >= \"3.7\"", "typing_extensions>=3.7.4.1,<5.0.0; python_version < \"3.8\"",]

[[project.authors]]
name = "Explosion"
email = "contact@explosion.ai"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/explosion/wasabi"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
