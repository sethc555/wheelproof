[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "future"
version = "1.0.0"
description = "Clean single-source support for Python 3 and 2"
license = {text = "MIT"}
authors = [
    {name = "Ed Schofield", email = "ed@pythoncharmers.com"},
]
requires-python = ">=2.6, !=3.0.*, !=3.1.*, !=3.2.*"
keywords = ["future past python3 migration futurize backport six 2to3 modernize pasteurize 3to2"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://python-future.org"
Source = "https://github.com/PythonCharmers/python-future"

[project.scripts]
futurize = "libfuturize.main:main"
pasteurize = "libpasteurize.main:main"

[project.readme]
content-type = "text/x-rst"
text = "\nfuture: Easy, safe support for Python 2/3 compatibility\n=======================================================\n\n``future`` is the missing compatibility layer between Python 2 and Python\n3. It allows you to use a single, clean Python 3.x-compatible codebase to\nsupport both Python 2 and Python 3 with minimal overhead.\n\nIt is designed to be used as follows::\n\n    from __future__ import (absolute_import, division,\n                            print_function, unicode_literals)\n    from builtins import (\n             bytes, dict, int, list, object, range, str,\n             ascii, chr, hex, input, next, oct, open,\n             pow, round, super,\n             filter, map, zip)\n\nfollowed by predominantly standard, idiomatic Python 3 code that then runs\nsimilarly on Python 2.6/2.7 and Python 3.3+.\n\nThe imports have no effect on Python 3. On Python 2, they shadow the\ncorresponding builtins, which normally have different semantics on Python 3\nversus 2, to provide their Python 3 semantics.\n\n\nStandard library reorganization\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n``future`` supports the standard library reorganization (PEP 3108) through the\nfollowing Py3 interfaces:\n\n    >>> # Top-level packages with Py3 names provided on Py2:\n    >>> import html.parser\n    >>> import queue\n    >>> import tkinter.dialog\n    >>> import xmlrpc.client\n    >>> # etc.\n\n    >>> # Aliases provided for extensions to existing Py2 module names:\n    >>> from future.standard_library import install_aliases\n    >>> install_aliases()\n\n    >>> from collections import Counter, OrderedDict   # backported to Py2.6\n    >>> from collections import UserDict, UserList, UserString\n    >>> import urllib.request\n    >>> from itertools import filterfalse, zip_longest\n    >>> from subprocess import getoutput, getstatusoutput\n\n\nAutomatic conversion\n--------------------\n\nAn included script called `futurize\n<https://python-future.org/automatic_conversion.html>`_ aids in converting\ncode (from either Python 2 or Python 3) to code compatible with both\nplatforms. It is similar to ``python-modernize`` but goes further in\nproviding Python 3 compatibility through the use of the backported types\nand builtin functions in ``future``.\n\n\nDocumentation\n-------------\n\nSee: https://python-future.org\n\n\nCredits\n-------\n\n:Author:  Ed Schofield, Jordan M. Adler, et al\n:Sponsor: Python Charmers: https://pythoncharmers.com\n:Others:  See docs/credits.rst or https://python-future.org/credits.html\n\n\nLicensing\n---------\nCopyright 2013-2024 Python Charmers, Australia.\nThe software is distributed under an MIT licence. See LICENSE.txt.\n\n"

[tool.setuptools]
include-package-data = true
packages = [
    "future",
    "future.builtins",
    "future.types",
    "future.standard_library",
    "future.backports",
    "future.backports.email",
    "future.backports.email.mime",
    "future.backports.html",
    "future.backports.http",
    "future.backports.test",
    "future.backports.urllib",
    "future.backports.xmlrpc",
    "future.moves",
    "future.moves.dbm",
    "future.moves.html",
    "future.moves.http",
    "future.moves.test",
    "future.moves.tkinter",
    "future.moves.urllib",
    "future.moves.xmlrpc",
    "future.tests",
    "future.utils",
    "past",
    "past.builtins",
    "past.types",
    "past.utils",
    "past.translation",
    "libfuturize",
    "libfuturize.fixes",
    "libpasteurize",
    "libpasteurize.fixes",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = [
    "README.rst",
    "LICENSE.txt",
    "futurize.py",
    "pasteurize.py",
    "check_rst.sh",
    "TESTING.txt",
]
tests = ["*.py"]
