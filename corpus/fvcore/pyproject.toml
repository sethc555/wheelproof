[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "fvcore"
version = "0.1.5.post20221221"
description = "Collection of common code shared among different research projects in FAIR computer vision team"
requires-python = ">=3.6"
dependencies = [ "numpy", "yacs>=0.1.6", "pyyaml>=5.1", "tqdm", "termcolor>=1.1", "Pillow", "tabulate", "iopath>=0.1.7", "dataclasses; python_version<'3.7'",]

[[project.authors]]
name = "FAIR"

[project.license]
text = "Apache 2.0"

[project.urls]
Homepage = "https://github.com/facebookresearch/fvcore"

[project.optional-dependencies]
all = [ "shapely",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
