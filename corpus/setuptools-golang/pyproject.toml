[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "setuptools_golang"
version = "2.9.0"
description = "A setuptools extension for building cpython extensions written in golang."
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=3.8"
dependencies = [ "setuptools",]

[[project.authors]]
name = "Anthony Sottile"
email = "asottile@umich.edu"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/asottile/setuptools-golang"

[project.scripts]
setuptools-golang-build-manylinux-wheels = "setuptools_golang:build_manylinux_wheels"

[tool.setuptools]
py-modules = [ "setuptools_golang",]
license-files = [ "LICENSE",]
include-package-data = false

[project.entry-points."distutils.setup_keywords"]
build_golang = "setuptools_golang:set_build_ext"
