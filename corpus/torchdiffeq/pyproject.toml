[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "torchdiffeq"
version = "0.2.5"
description = "ODE solvers and adjoint sensitivity analysis in PyTorch."
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",]
requires-python = "~=3.6"
dependencies = [ "torch>=1.5.0", "scipy>=1.4.0",]

[[project.authors]]
name = "Ricky Tian Qi Chen"
email = "rtqichen@cs.toronto.edu"

[project.urls]
Homepage = "https://github.com/rtqichen/torchdiffeq"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
