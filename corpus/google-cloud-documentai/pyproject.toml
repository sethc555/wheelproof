[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-documentai"
version = "3.15.0"
description = "Google Cloud Documentai API client library"
readme = "README.rst"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.17.1, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.59.0, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-documentai"

[tool.setuptools]
platforms = ["Posix; MacOS X; Windows"]
include-package-data = true
packages = [
    "google",
    "google.cloud",
    "google.cloud.documentai_v1",
    "google.cloud.documentai",
    "google.cloud.documentai_v1beta3",
    "google.cloud.documentai_v1.services",
    "google.cloud.documentai_v1.types",
    "google.cloud.documentai_v1.services.document_processor_service",
    "google.cloud.documentai_v1.services.document_processor_service.transports",
    "google.cloud.documentai_v1beta3.services",
    "google.cloud.documentai_v1beta3.types",
    "google.cloud.documentai_v1beta3.services.document_service",
    "google.cloud.documentai_v1beta3.services.document_processor_service",
    "google.cloud.documentai_v1beta3.services.document_service.transports",
    "google.cloud.documentai_v1beta3.services.document_processor_service.transports",
]
