[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "msrestazure"
version = "0.6.4.post1"
description = "AutoRest swagger generator Python client runtime. Azure-specific module."
readme = "README.rst"
classifiers = [ "Development Status :: 7 - Inactive", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "License :: OSI Approved :: MIT License", "Topic :: Software Development",]
dependencies = [ "msrest>=0.6.0,<2.0.0", "adal>=0.6.0,<2.0.0", "six",]

[[project.authors]]
name = "Microsoft Corporation"
email = "azpysdkhelp@microsoft.com"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "https://github.com/Azure/msrestazure-for-python"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
