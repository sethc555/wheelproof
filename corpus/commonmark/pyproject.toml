[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "commonmark"
version = "0.9.2"
description = "Python parser for the CommonMark Markdown spec"
keywords = [ "markup", "markdown", "commonmark",]
classifiers = [ "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Development Status :: 5 - Production/Stable", "Environment :: Other Environment", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Topic :: Documentation", "Topic :: Internet :: WWW/HTTP :: Dynamic Content", "Topic :: Software Development :: Documentation", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Markup", "Topic :: Utilities",]
dependencies = [ "future>=0.14.0;python_version<\"3\"",]
[[project.authors]]
name = "Bibek Kafle <bkafle662@gmail.com>"
email = "rolandshoemaker@gmail.com"

[[project.authors]]
name = "Roland Shoemaker <rolandshoemaker@gmail.com>"

[project.license]
text = "BSD-3-Clause"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/rtfd/commonmark.py"

[project.optional-dependencies]
test = [ "flake8==3.9.2", "hypothesis==4.24.4",]
testing = [ "flake8==3.9.2", "hypothesis==4.24.4",]

[project.scripts]
cmark = "commonmark.cmark:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
