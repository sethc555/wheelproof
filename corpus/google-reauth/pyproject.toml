[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "google-reauth"
version = "0.1.1"
description = "Google Reauth Library"
keywords = [ "google", "auth", "oauth", "client", "reauth",]
readme = "README.rst"
classifiers = [ "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Operating System :: POSIX", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS :: MacOS X", "Operating System :: OS Independent", "Topic :: Internet :: WWW/HTTP",]
dependencies = [ "pyu2f",]

[[project.authors]]
name = "Google"
email = "googleapis-publisher@google.com"

[project.license]
text = "Apache 2.0"

[project.urls]
Homepage = "https://github.com/Google/google-reauth-python"

[project.optional-dependencies]
oauth2client = [ "oauth2client>=2.0.0",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
