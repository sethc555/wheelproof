[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-custom_exit_code"
version = "0.3.0"
description = "Exit pytest test session with custom exit code in different scenarios"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Framework :: Pytest", "Intended Audience :: Developers", "Topic :: Software Development :: Testing", "Programming Language :: Python", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: Implementation :: CPython", "Operating System :: OS Independent", "License :: OSI Approved :: MIT License",]
requires-python = ">2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"
dependencies = [ "pytest>=4.0.2",]

[[project.authors]]
name = "Yash Todi"
email = "yashtodi94@gmail.com"

[[project.maintainers]]
name = "Yash Todi"
email = "yashtodi94@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/yashtodi94/pytest-custom_exit_code"

[tool.setuptools]
py-modules = [ "pytest_custom_exit_code",]
include-package-data = false

[project.entry-points.pytest11]
custom_exit_code = "pytest_custom_exit_code"
