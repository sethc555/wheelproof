[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "rouge"
version = "1.0.1"
description = "Full Python ROUGE Score Implementation (not a wrapper)"
keywords = [ "NL", "CL", "natural language processing", "computational linguistics", "summarization",]
classifiers = [ "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Text Processing :: Linguistic",]
dependencies = [ "six",]
[[project.authors]]
name = "pltrdy"
email = "pltrdy@gmail.com"

[project.license]
text = "LICENCE.txt"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "http://github.com/pltrdy/rouge"
Download = "https://github.com/pltrdy/rouge/archive/1.0.1.tar.gz"

[project.scripts]
rouge = "bin.rouge_cmd:main"

[project.optional-dependencies]
testing = [ "nose",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
