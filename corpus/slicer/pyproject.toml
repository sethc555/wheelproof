[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "slicer"
version = "0.0.8"
description = "A small package for big slicing."
classifiers = [ "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",]
requires-python = ">=3.6"

[[project.authors]]
name = "InterpretML"
email = "interpret@microsoft.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/interpretml/slicer"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
