[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "azure-monitor-query"
version = "2.0.0"
description = "Microsoft Corporation Azure Monitor Query Client Library for Python"
keywords = [ "azure", "azure", "sdk",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Programming Language :: Python", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "License :: OSI Approved :: MIT License",]
requires-python = ">=3.9"
dependencies = [ "isodate>=0.6.1", "azure-core>=1.30.0", "typing-extensions>=4.6.0",]

[[project.authors]]
name = "Microsoft Corporation"
email = "azpysdkhelp@microsoft.com"

[project.license]
text = "MIT License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Azure/azure-sdk-for-python/tree/main/sdk"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
"azure.monitor.query" = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "tests", "azure", "azure.monitor",]
namespaces = false
