[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-resource-manager"
version = "1.17.0"
description = "Google Cloud Resource Manager API client library"
readme = "README.rst"
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
    "grpc-google-iam-v1 >= 0.14.0, <1.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-resource-manager"

[tool.setuptools]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
packages = [
    "google",
    "google.cloud",
    "google.cloud.resourcemanager",
    "google.cloud.resourcemanager_v3",
    "google.cloud.resourcemanager_v3.services",
    "google.cloud.resourcemanager_v3.services.folders",
    "google.cloud.resourcemanager_v3.services.folders.transports",
    "google.cloud.resourcemanager_v3.services.organizations",
    "google.cloud.resourcemanager_v3.services.organizations.transports",
    "google.cloud.resourcemanager_v3.services.projects",
    "google.cloud.resourcemanager_v3.services.projects.transports",
    "google.cloud.resourcemanager_v3.services.tag_bindings",
    "google.cloud.resourcemanager_v3.services.tag_bindings.transports",
    "google.cloud.resourcemanager_v3.services.tag_holds",
    "google.cloud.resourcemanager_v3.services.tag_holds.transports",
    "google.cloud.resourcemanager_v3.services.tag_keys",
    "google.cloud.resourcemanager_v3.services.tag_keys.transports",
    "google.cloud.resourcemanager_v3.services.tag_values",
    "google.cloud.resourcemanager_v3.services.tag_values.transports",
    "google.cloud.resourcemanager_v3.types",
]
