[build-system]
requires = [ "setuptools>=61.2", "setuptools_scm[toml] >= 3.4.1",]
build-backend = "setuptools.build_meta"

[project]
name = "keyrings.google-artifactregistry-auth"
version = "1.1.2"
description = "Keyring backend for Google Auth tokens"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only",]
requires-python = ">=3.6"
dependencies = [ "keyring", "google-auth", "requests", "pluggy",]

[[project.authors]]
name = "Megan Kuo"
email = "megankuo@google.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/artifact-registry-python-tools"

[project.optional-dependencies]
tox = [ "tox",]
testing = [ "pytest >= 3.5, !=3.7.3", "pytest-checkdocs >= 1.2.3", "pytest-flake8", "pytest-black >= 0.3.7; python_implementation != \"PyPy\"", "pytest-cov", "pytest-mypy; python_implementation != \"PyPy\"",]

[tool.setuptools]
include-package-data = true
license-files = [ "LICENSE",]

[project.entry-points."keyring.backends"]
"Google Auth" = "keyrings.gauth"

[project.entry-points.tox]
tox_bootstrap = "google_artifactregistry_auth.tox_bootstrap"

[tool.setuptools.packages.find]
namespaces = true
