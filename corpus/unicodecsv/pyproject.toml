[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "unicodecsv"
version = "0.14.1"
description = "Python2's stdlib csv module is nice, but it doesn't support unicode. This module is a drop-in replacement which *does*."
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Natural Language :: English", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: Implementation :: PyPy", "Programming Language :: Python :: Implementation :: CPython",]
[[project.authors]]
name = "Jeremy Dunck"
email = "jdunck@gmail.com"

[project.license]
text = "BSD License"

[project.urls]
Homepage = "https://github.com/jdunck/python-unicodecsv"

[project.optional-dependencies]
testing = [ "unittest2>=0.5.1",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
