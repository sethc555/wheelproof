[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pypd"
version = "1.1.0"
description = "A python client for PagerDuty API"
classifiers = [ "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Topic :: Software Development", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: Libraries :: Python Modules",]
readme = "README.md"
dependencies = [ "requests", "six",]
[[project.authors]]
name = "JD Cumpson"
email = "jdc@pagerduty.com"

[[project.maintainers]]
name = "JD Cumpson"
email = "abrooks@pagerduty.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/PagerDuty/pagerduty-api-python-client"
Download = "https://github.com/PagerDuty/pagerduty-api-python-client/archive/master.tar.gz"

[project.optional-dependencies]
testing = []

[tool.setuptools]
script-files = []
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
