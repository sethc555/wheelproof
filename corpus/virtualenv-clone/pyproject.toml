[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "virtualenv-clone"
version = "0.5.7"
description = "script to clone virtualenvs."
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"

[[project.authors]]
name = "Edward George"
email = "edwardgeorge@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/edwardgeorge/virtualenv-clone"

[project.scripts]
virtualenv-clone = "clonevirtualenv:main"

[project.optional-dependencies]
testing = [ "virtualenv", "tox", "pytest",]

[tool.setuptools]
py-modules = [ "clonevirtualenv",]
include-package-data = false
