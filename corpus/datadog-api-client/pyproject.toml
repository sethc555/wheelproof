[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datadog-api-client"
version = "2.55.0"
description = "Collection of all Datadog Public endpoints"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
authors = [
    {name = "Datadog, Inc.", email = "packages@datadoghq.com"},
]
keywords = [
    "openapi",
    "api",
    "client",
    "openapi-generator",
    "datadog",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.8"
dependencies = [
    "urllib3>=1.15",
    "certifi",
    "python-dateutil",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DataDog/datadog-api-client-python"
"Bug Tracker" = "https://github.com/DataDog/datadog-api-client-python/issues"
Documentation = "https://docs.datadoghq.com/api/"
"Source Code" = "https://github.com/DataDog/datadog-api-client-python"

[project.optional-dependencies]
apm = [
    "ddtrace>=1.15.0",
]
async = [
    "aiosonic>=0.24.0",
]
zstandard = [
    "zstandard",
]
tests = [
    "aiosonic>=0.24.0",
    "glom",
    "jinja2",
    "pytest<8.0.0",
    "pytest-bdd==6.0.1",
    "pytest-asyncio",
    "pytest-randomly",
    "pytest-recording",
    "python-dateutil",
    "mypy",
    "types-python-dateutil",
    "urllib3<2.3.0",
    "zstandard",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = [
    "datadog_api_client",
    "datadog_api_client.v1",
    "datadog_api_client.v1.api",
    "datadog_api_client.v1.apis",
    "datadog_api_client.v1.model",
    "datadog_api_client.v1.models",
    "datadog_api_client.v2",
    "datadog_api_client.v2.api",
    "datadog_api_client.v2.apis",
    "datadog_api_client.v2.model",
    "datadog_api_client.v2.models",
]

[tool.setuptools.package-data]
datadog_api_client = ["py.typed"]
