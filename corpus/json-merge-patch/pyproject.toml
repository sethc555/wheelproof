[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "json-merge-patch"
version = "0.3.0"
description = "JSON Merge Patch library (https://tools.ietf.org/html/rfc7386)"
requires-python = ">=3.9"

[[project.authors]]
name = "Open Data Services"
email = "code@opendataservices.coop"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/open-contracting/json-merge-patch"

[tool.setuptools]
packages = [ "json_merge_patch",]
include-package-data = true
script-files = [ "json-merge-patch",]
