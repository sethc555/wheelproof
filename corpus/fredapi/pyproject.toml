[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "fredapi"
version = "0.5.2"
description = "Python API for Federal Reserve Economic Data (FRED) from St. Louis Fed"
readme = "DESCRIPTION.rst"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: OS Independent", "Intended Audience :: Science/Research", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Internet :: WWW/HTTP", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = [ "pandas",]
[[project.authors]]
name = "Mortada Mehyar"

[project.urls]
Homepage = "https://github.com/mortada/fredapi"

[tool.setuptools]
packages = [ "fredapi",]
platforms = [ "Any",]
include-package-data = false
