[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-dataplex"
version = "2.20.0"
description = "Google Cloud Dataplex API client library"
readme = "README.rst"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.10"
dependencies = [
    "google-api-core[grpc] >= 2.17.1, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.59.0, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
    "grpc-google-iam-v1 >= 0.14.0, <1.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-dataplex"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud.dataplex_v1",
    "google.cloud.dataplex",
    "google.cloud.dataplex_v1.services",
    "google.cloud.dataplex_v1.types",
    "google.cloud.dataplex_v1.services.catalog_service",
    "google.cloud.dataplex_v1.services.data_product_service",
    "google.cloud.dataplex_v1.services.content_service",
    "google.cloud.dataplex_v1.services.cmek_service",
    "google.cloud.dataplex_v1.services.data_scan_service",
    "google.cloud.dataplex_v1.services.dataplex_service",
    "google.cloud.dataplex_v1.services.data_taxonomy_service",
    "google.cloud.dataplex_v1.services.business_glossary_service",
    "google.cloud.dataplex_v1.services.metadata_service",
    "google.cloud.dataplex_v1.services.catalog_service.transports",
    "google.cloud.dataplex_v1.services.data_product_service.transports",
    "google.cloud.dataplex_v1.services.content_service.transports",
    "google.cloud.dataplex_v1.services.cmek_service.transports",
    "google.cloud.dataplex_v1.services.data_scan_service.transports",
    "google.cloud.dataplex_v1.services.dataplex_service.transports",
    "google.cloud.dataplex_v1.services.data_taxonomy_service.transports",
    "google.cloud.dataplex_v1.services.business_glossary_service.transports",
    "google.cloud.dataplex_v1.services.metadata_service.transports",
]
platforms = [
    "Posix; MacOS X; Windows",
]
include-package-data = true
