[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "aws_kinesis_agg"
version = "1.2.3"
description = "Python module to assist in taking advantage of the Kinesis message aggregation format for both aggregation and deaggregation."
keywords = [ "aws", "kinesis", "aggregation", "deaggregation", "kpl",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.6", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Utilities",]
dependencies = [ "protobuf",]
[[project.authors]]
name = "Ian Meyers"
email = "meyersi@amazon.com"

[project.license]
text = "Apache-2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "http://github.com/awslabs/kinesis-aggregation"

[tool.setuptools]
packages = [ "aws_kinesis_agg",]
include-package-data = false
