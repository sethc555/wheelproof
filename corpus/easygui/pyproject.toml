[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "easygui"
version = "0.98.3"
description = "EasyGUI is a module for very simple, very easy GUI programming in Python.  EasyGUI is different from other GUI generators in that EasyGUI is NOT event-driven.  Instead, all GUI interactions are invoked by simple function calls."
readme = "README.md"
license = {text = "BSD"}
authors = [
    {name = "easygui developers and Stephen Ferg", email = "robert.lugg@gmail.com"},
]
keywords = [
    "gui linux windows graphical user interface",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
"Homepage" = "https://github.com/robertlugg/easygui"

[tool.setuptools]
packages = [
    "easygui",
    "easygui.boxes",
]
include-package-data = false

[tool.setuptools.package-data]
"easygui" = [
    "python_and_check_logo.*",
    "zzzzz.gif",
]

[tool.distutils.bdist_wheel]
universal = true
