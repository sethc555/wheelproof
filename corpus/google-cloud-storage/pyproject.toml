[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-storage"
version = "3.11.0"
description = "Google Cloud Storage API client library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.10"
dependencies = [
    "google-auth >= 2.26.1, < 3.0.0",
    "google-api-core >= 2.27.0, < 3.0.0",
    "google-cloud-core >= 2.4.2, < 3.0.0",
    "google-resumable-media >= 2.7.2, < 3.0.0",
    "requests >= 2.22.0, < 3.0.0",
    "google-crc32c >= 1.6.0, < 2.0.0",
]

[project.optional-dependencies]
grpc = [
    "google-api-core[grpc] >= 2.27.0, < 3.0.0",
    "grpcio >= 1.59.0, < 2.0.0; python_version < '3.14'",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "grpcio-status >= 1.59.0, < 2.0.0; python_version < '3.14'",
    "grpcio-status >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0; python_version < '3.13'",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
    "grpc-google-iam-v1 >= 0.14.0, <1.0.0",
]
protobuf = [
    "protobuf >= 3.20.2, < 7.0.0",
]
tracing = [
    "opentelemetry-api >= 1.1.0, < 2.0.0",
]
testing = [
    "google-cloud-testutils",
    "numpy",
    "psutil",
    "py-cpuinfo",
    "pytest-benchmark",
    "PyYAML",
    "mock",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-rerunfailures",
    "pytest-xdist",
    "google-cloud-testutils",
    "google-cloud-iam",
    "google-cloud-pubsub",
    "google-cloud-kms",
    "brotli",
    "coverage",
    "pyopenssl",
    "opentelemetry-sdk",
    "flake8",
    "black",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud._storage",
    "google.cloud.storage",
    "google.cloud._storage_v2",
    "google.cloud.storage._media",
    "google.cloud.storage._experimental",
    "google.cloud.storage.asyncio",
    "google.cloud.storage._media.requests",
    "google.cloud.storage._experimental.asyncio",
    "google.cloud.storage._experimental.asyncio.retry",
    "google.cloud.storage.asyncio.retry",
    "google.cloud._storage_v2.services",
    "google.cloud._storage_v2.types",
    "google.cloud._storage_v2.services.storage",
    "google.cloud._storage_v2.services.storage.transports",
]
include-package-data = true
