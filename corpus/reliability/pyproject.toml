[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability"
version = "0.9.0"
description = "Reliability Engineering toolkit for Python"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "LGPLv3"}
authors = [
    {name = "Matthew Reid"},
    {email = "alpha.reliability@gmail.com"},
]
requires-python = ">=3.10"
keywords = [
    "reliability",
    "engineering",
    "RAM",
    "weibull",
    "lognormal",
    "exponential",
    "beta",
    "gamma",
    "normal",
    "loglogistic",
    "gumbel",
    "extreme",
    "value",
    "kaplan meier",
    "kaplan-meier",
    "survival",
    "analysis",
    "censored",
    "data",
    "lifelines",
    "probability",
    "distribution",
    "distributions",
    "fit",
    "fitting",
    "curve",
    "quality",
    "ALT",
    "accelerated",
    "life",
    "testing",
    "MCF",
    "mean",
    "cumulative",
    "CIF",
    "DS",
    "ZI",
    "defective",
    "subpopulation",
    "zero",
    "inflated",
    "DSZI",
    "likelihood",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dependencies = [
    "autograd>=1.7.0",
    "scipy>=1.15.0",
    "numpy>=2.2.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "autograd-gamma>=0.5.0",
    "mplcursors>=0.6",
]

[project.urls]
Homepage = "https://reliability.readthedocs.io/en/latest/"
Documentation = "https://reliability.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/MatthewReid854/reliability"
Donate = "https://reliability.readthedocs.io/en/latest/How%20to%20donate%20to%20the%20project.html"

[tool.setuptools]
packages = ["reliability"]
include-package-data = false
