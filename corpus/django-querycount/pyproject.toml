[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-querycount"
version = "0.8.3"
description = "Middleware that Prints the number of DB queries to the runserver console."
keywords = [ "django", "querycount", "database", "performance",]
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Framework :: Django", "Topic :: Utilities",]
dependencies = []
[[project.authors]]
name = "Brad Montgomery"
email = "brad@bradmontgomery.net"

[project.license]
text = "MIT"

[project.readme]
text = "this project gives you a middleware thatprints DB query counts in Django's runserver console output."
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/bradmontgomery/django-querycount/tarball/0.8.3"

[tool.setuptools]
packages = [ "querycount",]
include-package-data = false
