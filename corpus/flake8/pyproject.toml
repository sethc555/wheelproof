[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "flake8"
description = "the modular source code checker: pep8 pyflakes and co"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Framework :: Flake8", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Software Development :: Quality Assurance",]
requires-python = ">=3.9"
dependencies = [ "mccabe>=0.7.0,<0.8.0", "pycodestyle>=2.14.0,<2.15.0", "pyflakes>=3.4.0,<3.5.0",]
dynamic = [ "version",]

[[project.authors]]
name = "Tarek Ziade"
email = "tarek@ziade.org"

[[project.maintainers]]
name = "Ian Stapleton Cordasco"
email = "graffatcolmingov@gmail.com"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/pycqa/flake8"

[project.scripts]
flake8 = "flake8.main.cli:main"

[tool.setuptools]
license-files = [ "LICENSE",]
include-package-data = false

[project.entry-points."flake8.extension"]
F = "flake8.plugins.pyflakes:FlakesChecker"
E = "flake8.plugins.pycodestyle:pycodestyle_logical"
W = "flake8.plugins.pycodestyle:pycodestyle_physical"

[project.entry-points."flake8.report"]
default = "flake8.formatting.default:Default"
pylint = "flake8.formatting.default:Pylint"
quiet-filename = "flake8.formatting.default:FilenameOnly"
quiet-nothing = "flake8.formatting.default:Nothing"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "flake8.__version__"
