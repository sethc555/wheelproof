[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas-gbq"
version = "0.35.0"
description = "Google BigQuery connector for pandas"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "BSD-3-Clause"}
authors = [
    {name = "pandas-gbq authors", email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "setuptools",
    "db-dtypes >=1.1.1,<2.0.0",
    "numpy >=1.26.4",
    "pandas >=1.5.3",
    "pyarrow >= 12.0.0",
    "pyarrow >= 22.0.0; python_version >= '3.14'",
    "pydata-google-auth >=1.5.0",
    "psutil >=5.9.8",
    "google-api-core >= 2.15.0, <3.0.0",
    "google-auth >=2.14.1",
    "google-auth-oauthlib >=0.7.0",
    "google-cloud-bigquery >=3.20.0,<4.0.0",
    "packaging >=22.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/pandas-gbq"

[project.optional-dependencies]
bqstorage = [
    "google-cloud-bigquery-storage >=2.16.2, <3.0.0",
]
tqdm = ["tqdm>=4.23.0"]
geopandas = ["geopandas>=0.14.4", "Shapely>=1.8.5"]

[tool.setuptools]
packages = [
    "pandas_gbq",
    "pandas_gbq.core",
    "pandas_gbq.load",
    "pandas_gbq.schema",
]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
