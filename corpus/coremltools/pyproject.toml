[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coremltools"
version = "9.0"
description = "Community Tools for Core ML"
readme = {text = "coremltools\n===========\n\n`Core ML <http://developer.apple.com/documentation/coreml>`_\nis an Apple framework that allows developers to easily integrate\nmachine learning (ML) models into apps. Core ML is available on iOS, iPadOS,\nwatchOS, macOS, and tvOS. Core ML introduces a public file format (.mlmodel)\nfor a broad set of ML methods including deep neural networks (convolutional\nand recurrent), tree ensembles (boosted trees, random forest, decision trees),\nand generalized linear models. Core ML models can be directly integrated into\napps within Xcode.\n\n:code:`coremltools` is a python package for creating, examining, and testing models in\nthe .mlmodel format. In particular, it can be used to:\n\n- Convert trained models from popular machine learning tools into Core ML format\n  (.mlmodel).\n- Write models to Core ML format with a simple API.\n- Making predictions using the Core ML framework (on select platforms) to\n  verify conversion.\n\nMore Information\n----------------\n\n- `coremltools user guide and examples <https://coremltools.readme.io/>`_\n- `Core ML framework documentation <http://developer.apple.com/documentation/coreml>`_\n- `Machine learning at Apple <https://developer.apple.com/machine-learning>`_\n\nLicense\n-------\nCopyright (c) 2020, Apple Inc. All rights reserved.\n\nUse of this source code is governed by the\n`3-Clause BSD License <https://opensource.org/licenses/BSD-3-Clause>`_\nthat can be found in the LICENSE.txt file.\n", content-type = "text/x-rst"}
license = {text = "BSD"}
authors = [
  {name = "Apple Inc.", email = "coremltools@apple.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]
dependencies = [
  "numpy >= 1.14.5",
  "protobuf >= 3.1.0",
  "sympy",
  "tqdm",
  "packaging",
  "attrs>=21.3.0",
  "cattrs",
  "pyaml",
]

[project.urls]
Homepage = "https://github.com/apple/coremltools"

