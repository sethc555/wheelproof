[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "grpcio-gcp"
version = "0.2.2"
description = "gRPC extensions for Google Cloud Platform"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "License :: OSI Approved :: Apache Software License",]
dependencies = [ "grpcio>=1.12.0",]

[[project.authors]]
name = "The gRPC-GCP Authors"
email = "grpc-io@googlegroups.com"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://grpc.io"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
