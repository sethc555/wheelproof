[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud"
version = "0.34.0"
description = "API Client library for Google Cloud"
readme = "setup-README.rst"
classifiers = [ "Development Status :: 7 - Inactive", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Internet",]
dependencies = []

[[project.authors]]
name = "Google Cloud Platform"
email = "googleapis-publisher@google.com"

[project.license]
text = "Apache 2.0"

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/google-cloud-python"

[tool.setuptools]
zip-safe = false
include-package-data = true
script-files = []
platforms = [ "Posix",]
