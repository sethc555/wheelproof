[build-system]
requires = [ "setuptools>=61.2", "setuptools_scm",]
build-backend = "setuptools.build_meta"

[project]
name = "pynetbox"
description = "NetBox API client library"
keywords = [ "netbox",]
classifiers = [ "Intended Audience :: Developers", "Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
dependencies = [ "requests>=2.20.0,<3.0", "packaging",]
dynamic = [ "version",]

[[project.authors]]
name = "Zach Moody"
email = "ahanson@netboxlabs.com"

[[project.authors]]
name = "Arthur Hanson"

[project.license]
text = "Apache2"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/netbox-community/pynetbox"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "tests", "tests.*",]
namespaces = false
