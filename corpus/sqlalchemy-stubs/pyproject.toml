[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-stubs"
version = "0.4"
description = "SQLAlchemy stubs and mypy plugin"
classifiers = [ "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3",]
dependencies = [ "mypy>=0.790", "typing-extensions>=3.7.4",]

[[project.authors]]
name = "Ivan Levkivskyi"
email = "levkivskyi@gmail.com"

[project.license]
text = "MIT License"

[project.readme]
text = "# Experimental SQLAlchemy type stubs and mypy plugin\n\nThis package contains type stubs and mypy plugin to provide more precise\nstatic types and type inference for SQLAlchemy framework. SQLAlchemy uses\ndynamic Python features that are hard to understand by static type checkers,\nthis is why the plugin is needed in addition to type stubs.\n\nCurrently, some basic use cases like inferring model field types are supported.\nThe final goal is to be able to get precise types for most common patterns.\n\n\n```\npip install sqlalchemy-stubs\n```\n\nImportant: you need to enable the plugin in your mypy config file:\n```\n[mypy]\nplugins = sqlmypy\n```"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/dropbox/sqlalchemy-stubs"

[tool.setuptools]
py-modules = [ "sqlmypy", "sqltyping",]
packages = [ "sqlalchemy-stubs",]
include-package-data = false

[tool.setuptools.package-data]
