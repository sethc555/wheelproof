[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-permissionedforms"
version = "0.1"
description = "Django extension for creating forms that vary according to user permissions"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3 :: Only", "Framework :: Django",]
requires-python = ">=3.7"
dependencies = [ "Django",]

[[project.authors]]
name = "Matthew Westcott"
email = "matthew.westcott@torchbox.com"

[project.license]
text = "BSD"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/wagtail/django-permissionedforms"

[project.optional-dependencies]
testing = [ "django-modelcluster",]

[tool.setuptools]
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
