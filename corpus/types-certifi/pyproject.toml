[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-certifi"
version = "2021.10.8.3"
description = "Typing stubs for certifi"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for certifi\n\nThis is a PEP 561 type stub package for the `certifi` package.\nIt can be used by type-checking tools like mypy, PyCharm, pytype etc. to check code\nthat uses `certifi`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/master/stubs/certifi. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `certifi` package includes type annotations or type stubs\nsince version 2022.5.18.1. Please uninstall the `types-certifi`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/master/README.md for more details.\nThis package was generated from typeshed commit `95128e61ec82c2ca8ec32d6c03bd9dad9ab68e65`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/certifi.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "certifi-stubs",]
include-package-data = false

[tool.setuptools.package-data]
certifi-stubs = [ "__init__.pyi", "METADATA.toml",]
