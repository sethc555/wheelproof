[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "httpie"
version = "3.2.4"
description = "HTTPie: modern, user-friendly command-line HTTP client for the API era."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "BSD"}
authors = [
    {name = "Jakub Roztocil", email = "jakub@roztocil.co"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
requires-python = ">=3.7"
dependencies = [
    "pip",
    "charset_normalizer>=2.0.0",
    "defusedxml>=0.6.0",
    "requests[socks] >=2.22.0",
    "Pygments>=2.5.2",
    "requests-toolbelt>=0.9.1",
    "multidict>=4.7.0",
    "setuptools",
    "importlib-metadata>=1.4.0; python_version<\"3.8\"",
    "rich>=9.10.0",
    "colorama>=0.2.4; sys_platform==\"win32\"",
]

[project.urls]
Homepage = "https://httpie.io/"
GitHub = "https://github.com/httpie/cli"
Twitter = "https://twitter.com/httpie"
Discord = "https://httpie.io/discord"
Documentation = "https://httpie.io/docs"
"Online Demo" = "https://httpie.io/run"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpbin>=0.0.6",
    "responses",
    "pytest-mock",
    "werkzeug<2.1.0",
    "flake8",
    "flake8-comprehensions",
    "flake8-deprecated",
    "flake8-mutable",
    "flake8-tuple",
    "pyopenssl",
    "pytest-cov",
    "pyyaml",
    "twine",
    "wheel",
    "Jinja2",
]
test = [
    "pytest",
    "pytest-httpbin>=0.0.6",
    "responses",
    "pytest-mock",
    "werkzeug<2.1.0",
]

[project.scripts]
http = "httpie.__main__:main"
https = "httpie.__main__:main"
httpie = "httpie.manager.__main__:main"

[tool.setuptools]
include-package-data = false
packages = [
    "httpie",
    "httpie.plugins",
    "httpie.cli",
    "httpie.output",
    "httpie.internal",
    "httpie.legacy",
    "httpie.manager",
    "httpie.cli.nested_json",
    "httpie.output.formatters",
    "httpie.output.lexers",
    "httpie.output.ui",
    "httpie.manager.tasks",
]

[tool.setuptools.data-files]
"share/man/man1" = [
    "extras/man/http.1",
    "extras/man/https.1",
    "extras/man/httpie.1",
]
