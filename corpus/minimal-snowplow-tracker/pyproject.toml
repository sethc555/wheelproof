[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-snowplow-tracker"
version = "0.0.2"
description = "A minimal snowplow event tracker for Python. Add analytics to your Python and Django apps, webapps and games"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Operating System :: OS Independent",]
dependencies = [ "requests>=2.2.1,<3.0", "six>=1.9.0,<2.0",]

[[project.authors]]
name = "Anuj More"

[[project.authors]]
name = "Alexander Dean"

[[project.authors]]
name = "Fred Blundun"

[[project.authors]]
name = "Drew Banin"

[[project.authors]]
name = "Jacob Beck"

[[project.authors]]
name = "Connor McArthur"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://www.fishtownanalytics.com"

[tool.setuptools]
packages = [ "snowplow_tracker", "snowplow_tracker.test",]
include-package-data = false
