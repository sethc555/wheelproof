[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-iam"
version = "2.23.0"
description = "Google Cloud Iam API client library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpc-google-iam-v1 >=0.12.4, <1.0.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-iam"

[tool.setuptools]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
packages = [
    "google",
    "google.cloud",
    "google.cloud.iam_admin",
    "google.cloud.iam_admin_v1",
    "google.cloud.iam_credentials_v1",
    "google.cloud.iam_credentials",
    "google.cloud.iam_v3beta",
    "google.cloud.iam_v2",
    "google.cloud.iam",
    "google.cloud.iam_v2beta",
    "google.cloud.iam_v3",
    "google.cloud.iam_admin_v1.services",
    "google.cloud.iam_admin_v1.types",
    "google.cloud.iam_admin_v1.services.iam",
    "google.cloud.iam_admin_v1.services.iam.transports",
    "google.cloud.iam_credentials_v1.services",
    "google.cloud.iam_credentials_v1.types",
    "google.cloud.iam_credentials_v1.services.iam_credentials",
    "google.cloud.iam_credentials_v1.services.iam_credentials.transports",
    "google.cloud.iam_v3beta.services",
    "google.cloud.iam_v3beta.types",
    "google.cloud.iam_v3beta.services.principal_access_boundary_policies",
    "google.cloud.iam_v3beta.services.access_policies",
    "google.cloud.iam_v3beta.services.policy_bindings",
    "google.cloud.iam_v3beta.services.principal_access_boundary_policies.transports",
    "google.cloud.iam_v3beta.services.access_policies.transports",
    "google.cloud.iam_v3beta.services.policy_bindings.transports",
    "google.cloud.iam_v2.services",
    "google.cloud.iam_v2.types",
    "google.cloud.iam_v2.services.policies",
    "google.cloud.iam_v2.services.policies.transports",
    "google.cloud.iam_v2beta.services",
    "google.cloud.iam_v2beta.types",
    "google.cloud.iam_v2beta.services.policies",
    "google.cloud.iam_v2beta.services.policies.transports",
    "google.cloud.iam_v3.services",
    "google.cloud.iam_v3.types",
    "google.cloud.iam_v3.services.principal_access_boundary_policies",
    "google.cloud.iam_v3.services.policy_bindings",
    "google.cloud.iam_v3.services.principal_access_boundary_policies.transports",
    "google.cloud.iam_v3.services.policy_bindings.transports",
]
