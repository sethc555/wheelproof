[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-spanner"
version = "3.67.0"
description = "Google Cloud Spanner API client library"
readme = "README.rst"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.17.1, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "google-cloud-core >= 2.0.0, < 3.0.0",
    "grpcio >= 1.49.1, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "grpc-google-iam-v1 >= 0.12.4, <1.0.0",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
    "grpc-interceptor >= 0.15.4",
    "sqlparse >= 0.4.4",
    "opentelemetry-api >= 1.22.0",
    "opentelemetry-sdk >= 1.22.0",
    "opentelemetry-semantic-conventions >= 0.43b0",
    "opentelemetry-resourcedetector-gcp >= 1.8.0a0",
    "google-cloud-monitoring >= 2.16.0",
    "mmh3 >= 4.1.0",
]

[project.optional-dependencies]
libcst = ["libcst >= 0.2.5"]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-spanner"

[tool.setuptools]
platforms = ["Posix; MacOS X; Windows"]
include-package-data = true
packages = [
    "google",
    "google.cloud",
    "google.cloud.spanner",
    "google.cloud.spanner_dbapi",
    "google.cloud.spanner_admin_database_v1",
    "google.cloud.spanner_admin_database",
    "google.cloud.spanner_v1",
    "google.cloud.spanner_admin_instance",
    "google.cloud.spanner_admin_instance_v1",
    "google.cloud.aio",
    "google.cloud.spanner_admin_database_v1.services",
    "google.cloud.spanner_admin_database_v1.types",
    "google.cloud.spanner_admin_database_v1.services.database_admin",
    "google.cloud.spanner_admin_database_v1.services.database_admin.transports",
    "google.cloud.spanner_v1._async",
    "google.cloud.spanner_v1.testing",
    "google.cloud.spanner_v1.metrics",
    "google.cloud.spanner_v1.services",
    "google.cloud.spanner_v1.types",
    "google.cloud.spanner_v1._async.testing",
    "google.cloud.spanner_v1.services.spanner",
    "google.cloud.spanner_v1.services.spanner.transports",
    "google.cloud.spanner_admin_instance_v1.services",
    "google.cloud.spanner_admin_instance_v1.types",
    "google.cloud.spanner_admin_instance_v1.services.instance_admin",
    "google.cloud.spanner_admin_instance_v1.services.instance_admin.transports",
    "google.cloud.aio._cross_sync",
]
