[build-system]
requires = [ "setuptools>=61.2", "isort", "pycodestyle",]
build-backend = "setuptools.build_meta"

[project]
name = "avro-python3"
description = "Avro is a serialization and RPC framework."
readme = "README.md"
keywords = [ "avro", "serialization", "rpc",]
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Development Status :: 7 - Inactive",]
requires-python = ">=3.5"
dependencies = []
dynamic = [ "version",]
[[project.authors]]
name = "Apache Avro"
email = "dev@avro.apache.org"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://avro.apache.org/"

[project.optional-dependencies]
snappy = [ "python-snappy",]
zstandard = [ "zstandard",]

[tool.setuptools]
include-package-data = true
packages = [ "avro",]
zip-safe = true
script-files = [ "scripts/avro",]

[tool.setuptools.package-dir]
avro = "avro"

[tool.setuptools.package-data]
avro = [ "HandshakeRequest.avsc", "HandshakeResponse.avsc", "VERSION.txt", "LICENSE", "NOTICE",]

[tool.setuptools.dynamic.version]
file = [ "avro/VERSION.txt",]
