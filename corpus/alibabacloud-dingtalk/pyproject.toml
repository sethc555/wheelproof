[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "alibabacloud_dingtalk"
version = "2.2.48"
description = "Alibaba Cloud Dingtalk SDK Library for Python"
keywords = [ "alibabacloud", "dingtalk",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Topic :: Software Development",]
requires-python = ">=3.6"
dependencies = [ "alibabacloud_tea_openapi>=0.3.16, <1.0.0", "alibabacloud_tea_util>=0.3.14, <1.0.0", "alibabacloud_openapi_util>=0.2.4, <1.0.0", "alibabacloud_endpoint_util>=0.0.4, <1.0.0", "alibabacloud_gateway_spi>=0.0.2, <1.0.0", "alibabacloud_gateway_dingtalk>=1.0.2, <2.0.0",]

[[project.authors]]
name = "Alibaba Cloud SDK"
email = "sdk-team@alibabacloud.com"

[project.license]
text = "Apache License 2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/aliyun/alibabacloud-sdk"

[tool.setuptools]
include-package-data = true
platforms = [ "any",]
license-files = [ "LICENSE",]

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
