[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-python-slugify"
version = "8.0.2.20240310"
description = "Typing stubs for python-slugify"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
requires-python = ">=3.8"
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for python-slugify\n\nThis is a [PEP 561](https://peps.python.org/pep-0561/)\ntype stub package for the [`python-slugify`](https://github.com/un33k/python-slugify) package.\nIt can be used by type-checking tools like\n[mypy](https://github.com/python/mypy/),\n[pyright](https://github.com/microsoft/pyright),\n[pytype](https://github.com/google/pytype/),\nPyCharm, etc. to check code that uses\n`python-slugify`.\n\nThis version of `types-python-slugify` aims to provide accurate annotations\nfor `python-slugify==8.0.2`.\nThe source for this package can be found at\nhttps://github.com/python/typeshed/tree/main/stubs/python-slugify. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `python-slugify` package includes type annotations or type stubs\nsince version 8.0.2. Please uninstall the `types-python-slugify`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/main/README.md for more details.\nThis package was generated from typeshed commit `f94bbfbcc4c3b2b289425ea793beda0822e702f8` and was tested\nwith mypy 1.9.0, pyright 1.1.350, and\npytype 2024.2.27."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/python-slugify.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "slugify-stubs",]
include-package-data = false

[tool.setuptools.package-data]
slugify-stubs = [ "__init__.pyi", "__version__.pyi", "slugify.pyi", "special.pyi", "METADATA.toml",]
