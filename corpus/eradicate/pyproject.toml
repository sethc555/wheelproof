[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "eradicate"
version = "3.0.1"
description = "Removes commented-out code."
keywords = [ "clean", "format", "commented-out", "code",]
readme = "README.rst"
classifiers = [ "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Quality Assurance",]

[[project.authors]]
name = "Steven Myint"

[[project.maintainers]]
name = "Nikita Sobolev <mail@sobolevn.me>"

[project.license]
text = "Expat License"

[project.urls]
Homepage = "https://github.com/pycqa/eradicate"

[project.scripts]
eradicate = "eradicate:main"

[tool.setuptools]
py-modules = [ "eradicate",]
include-package-data = false
