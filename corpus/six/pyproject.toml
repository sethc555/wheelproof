[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "six"
version = "1.17.0"
description = "Python 2 and 3 compatibility utilities"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Topic :: Software Development :: Libraries", "Topic :: Utilities",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*"

[[project.authors]]
name = "Benjamin Peterson"
email = "benjamin@python.org"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/benjaminp/six"

[project.optional-dependencies]
testing = [ "pytest",]

[tool.setuptools]
py-modules = [ "six",]
license-files = [ "LICENSE",]
include-package-data = false
