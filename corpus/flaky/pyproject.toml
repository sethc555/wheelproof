[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "flaky"
version = "3.8.1"
description = "Plugin for pytest that automatically reruns flaky tests."
keywords = [ "pytest", "plugin", "flaky", "tests", "rerun", "retry",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Topic :: Software Development :: Testing", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Operating System :: OS Independent", "Operating System :: POSIX", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS :: MacOS X",]
requires-python = ">=3.5"
[[project.authors]]
name = "Box"
email = "oss@box.com"

[project.license]
text = "Apache Software License, Version 2.0, http://www.apache.org/licenses/LICENSE-2.0"

[project.urls]
Homepage = "https://github.com/box/flaky"

[project.optional-dependencies]
testing = [ "tox",]

[tool.setuptools]
zip-safe = false
include-package-data = false

[project.entry-points.pytest11]
flaky = "flaky.flaky_pytest_plugin"

[tool.setuptools.packages.find]
exclude = [ "test*",]
namespaces = false
