[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-nested-routers"
version = "0.95.0"
description = "Nested resources for the Django Rest Framework"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache"}
authors = [
    {name = "Alan Justino et al.", email = "alan.justino@yahoo.com.br"},
]
requires-python = ">=3.8"
dependencies = [
    "djangorestframework>=3.15.0",
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/alanjds/drf-nested-routers"

[tool.setuptools]
packages = ["rest_framework_nested", "rest_framework_nested.runtests"]
include-package-data = false

[tool.setuptools.package-data]
rest_framework_nested = ["py.typed"]

[tool.distutils.bdist_wheel]
universal = true
