[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "forbiddenfruit"
version = "0.1.4"
description = "Patch python built-in objects"
classifiers = [ "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "License :: OSI Approved :: MIT License",]

[[project.authors]]
name = "Lincoln de Sousa"
email = "lincoln@clarete.li"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/clarete/forbiddenfruit"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "*tests*",]
namespaces = false
