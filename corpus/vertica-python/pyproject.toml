[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "vertica-python"
version = "1.4.0"
description = "Official native Python client for the Vertica database."
keywords = [ "database", "vertica",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Database", "Topic :: Database :: Database Engines/Servers", "Topic :: Database :: Front-Ends", "Topic :: Software Development :: Libraries :: Python Modules", "Operating System :: OS Independent",]
requires-python = ">=3.7"
dependencies = [ "python-dateutil>=1.5", "six>=1.10.0",]

[[project.authors]]
name = "Justin Berka"
email = "justin.berka@gmail.com"

[[project.authors]]
name = "Alex Kim"
email = "alex.kim@uber.com"

[[project.authors]]
name = "Siting Ren"
email = "sitingren@hotmail.com"

[project.license]
text = "Apache License 2.0"

[project.readme]
text = "vertica-python is the official Vertica database client for the Python programming language. Please check the [project homepage](https://github.com/vertica/vertica-python) for the details."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/vertica/vertica-python"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
