[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Salesforce-FuelSDK-Sans"
version = "1.3.1"
description = "Salesforce Marketing Cloud Fuel SDK for Python"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries", "Programming Language :: Python :: 3.7",]
requires-python = ">=3"
dependencies = [ "PyJWT>=2.4.0", "requests>=2.28.0", "suds-community>=1.1.1",]

[[project.authors]]
name = "Seahawks8"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/seahawks8/FuelSDK-Python"

[tool.setuptools]
py-modules = [ "ET_Client",]
packages = [ "FuelSDK",]
include-package-data = false
