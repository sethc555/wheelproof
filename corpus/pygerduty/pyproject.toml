[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pygerduty"
version = "0.38.3"
description = "Python Client Library for PagerDuty's REST API"
classifiers = [ "Programming Language :: Python", "Topic :: Software Development", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = [ "six",]

[[project.authors]]
name = "Mike Cugini"
email = "cugini@dropbox.com"

[[project.maintainers]]
name = "Mike Cugini"
email = "cugini@dropbox.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/dropbox/pygerduty"
Download = "https://github.com/dropbox/pygerduty/archive/master.tar.gz"

[project.optional-dependencies]
testing = [ "httpretty<1", "pytest>=3.0,<5.0", "pyparsing<3", "zipp<2",]

[tool.setuptools]
packages = [ "pygerduty",]
script-files = [ "bin/grab_oncall.py",]
include-package-data = false
