[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Flask-Login"
description = "User authentication and session management for Flask."
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Framework :: Flask", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Topic :: Internet :: WWW/HTTP :: Dynamic Content", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">= 3.7"
dependencies = [ "Flask>=1.0.4", "Werkzeug>=1.0.1",]
dynamic = [ "version",]

[[project.authors]]
name = "Matthew Frazier"
email = "leafstormrush@gmail.com"

[[project.maintainers]]
name = "Max Countryman"

[project.urls]
Homepage = "https://github.com/maxcountryman/flask-login"
Documentation = "https://flask-login.readthedocs.io/"
Changes = "https://github.com/maxcountryman/flask-login/blob/main/CHANGES.md"
"Source Code" = "https://github.com/maxcountryman/flask-login"
"Issue Tracker" = "https://github.com/maxcountryman/flask-login/issues"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "flask_login.__about__.__version__"
