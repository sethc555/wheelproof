[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "methodtools"
version = "0.4.7"
description = "Expand standard functools to methods"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "BSD 2-Clause License"}
authors = [
    {name = "Jeong YunWon"},
    {email = "methodtools@youknowone.org"},
]
keywords = ["ring", "functools", "lru_cache", "method"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "wirerope>=0.4.7",
]

[project.optional-dependencies]
test = [
    "functools32>=3.2.3-2;python_version<\"3\"",
    "pytest>=4.6.7",
    "pytest-cov>=2.6.1",
]
doc = [
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/youknowone/methodtools"

[tool.setuptools]
include-package-data = false
py-modules = ["methodtools"]
