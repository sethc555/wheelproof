[build-system]
requires = [ "setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "anybadge"
version = "0.0.0"
description = "Simple, flexible badge generator for project badges."
classifiers = [ "License :: OSI Approved :: MIT License",]
requires-python = ">=3.7"
dependencies = [ "packaging",]

[[project.authors]]
name = "Jon Grace-Cox"
email = "30441316+jongracecox@users.noreply.github.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/jongracecox/anybadge"

[project.scripts]
anybadge = "anybadge.cli:main"
anybadge-server = "anybadge.server.cli:main"

[project.optional-dependencies]
testing = []

[tool.setuptools]
py-modules = [ "anybadge_server",]
packages = [ "anybadge", "anybadge.templates", "anybadge.server",]
include-package-data = false

[tool.setuptools.package-data]
anybadge = [ "templates/*.svg",]
