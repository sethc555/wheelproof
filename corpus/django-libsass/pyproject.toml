[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-libsass"
version = "0.9"
description = "A django-compressor filter to compile SASS files using libsass"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Framework :: Django", "Framework :: Django :: 1.8", "Framework :: Django :: 1.9", "Framework :: Django :: 1.10", "Framework :: Django :: 1.11", "Framework :: Django :: 2.0", "Framework :: Django :: 2.1", "Framework :: Django :: 2.2", "Framework :: Django :: 3.0", "Framework :: Django :: 3.1", "Framework :: Django :: 3.2",]
dependencies = [ "django-compressor>=1.3", "libsass>=0.7.0,<1", "django-appconf==1.0.3 ; python_version<'3'",]

[[project.authors]]
name = "Matt Westcott"
email = "matthew.westcott@torchbox.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/torchbox/django-libsass"

[tool.setuptools]
py-modules = [ "django_libsass",]
license-files = [ "LICENSE",]
include-package-data = false
