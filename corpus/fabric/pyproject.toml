[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "fabric"
version = "3.2.3"
description = "High level SSH command execution"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "License :: OSI Approved :: BSD License", "Operating System :: POSIX", "Operating System :: Unix", "Operating System :: MacOS :: MacOS X", "Operating System :: Microsoft :: Windows", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Topic :: Software Development", "Topic :: Software Development :: Build Tools", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Clustering", "Topic :: System :: Software Distribution", "Topic :: System :: Systems Administration",]
dependencies = [ "invoke >= 2.0, <3.0", "paramiko>=2.4", "decorator>=5", "deprecated>=1.2",]

[[project.authors]]
name = "Jeff Forcier"
email = "jeff@bitprophet.org"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://fabfile.org"
Docs = "https://docs.fabfile.org"
Source = "https://github.com/fabric/fabric"
Issues = "https://github.com/fabric/fabric/issues"
Changelog = "https://www.fabfile.org/changelog.html"
CI = "https://app.circleci.com/pipelines/github/fabric/fabric"
Twitter = "https://twitter.com/pyfabric"

[project.optional-dependencies]
testing = []
pytest = [ "pytest>=7",]

[project.scripts]
fab = "fabric.main:program.run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = [ "fabric", "fabric.*",]
namespaces = false
