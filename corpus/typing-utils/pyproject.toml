[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "typing_utils"
version = "0.1.0"
description = "utils to inspect Python type annotations"
classifiers = [ "Operating System :: OS Independent", "Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: Implementation :: CPython",]
requires-python = ">=3.6.1"

[[project.authors]]
name = "bojiang"
email = "bojiang_@outlook.com"

[project.license]
text = "Apache License 2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/bojiang/typing_utils"

[project.optional-dependencies]
test = [ "pytest",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
