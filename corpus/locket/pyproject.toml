[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "locket"
version = "1.0.0"
description = "File-based locks for Python on Linux and Windows"
keywords = [ "lock", "filelock", "lockfile", "process",]
readme = "README.rst"
classifiers = [ "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Operating System :: Unix", "Operating System :: Microsoft :: Windows",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"

[[project.authors]]
name = "Michael Williamson"
email = "mike@zwobble.org"

[project.license]
text = "BSD-2-Clause"

[project.urls]
Homepage = "http://github.com/mwilliamson/locket.py"

[tool.setuptools]
packages = [ "locket",]
include-package-data = false
