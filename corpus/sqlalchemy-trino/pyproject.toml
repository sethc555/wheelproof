[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-trino"
version = "0.5.0"
description = "Trino dialect for SQLAlchemy"
keywords = [ "sqlalchemy", "trino",]
classifiers = [ "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Database", "Topic :: Database :: Front-Ends",]
requires-python = ">=3.7"
dependencies = [ "trino[sqlalchemy]>=0.310",]

[[project.authors]]
name = "Dũng Đặng Minh"
email = "dungdm93@live.com"

[project.license]
text = "Apache 2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/dungdm93/sqlalchemy-trino"

[tool.setuptools]
platforms = [ "any",]
include-package-data = false
