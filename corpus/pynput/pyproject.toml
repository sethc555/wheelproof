[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynput"
version = "1.8.2"
description = "Monitor and control user input devices"
readme = {text = "\n\n", content-type = "text/plain"}
license = {text = "LGPLv3"}
authors = [
    {name = "Moses Palm\u00e9r"},
    {email = "moses.palmer@gmail.com"},
]
keywords = ["control mouse", "mouse input", "control keyboard", "keyboard input"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows NT/2000",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "six",
    'pyobjc-framework-ApplicationServices >=8.0; sys_platform == "darwin"',
    'pyobjc-framework-Quartz >=8.0; sys_platform == "darwin"',
    'evdev >= 1.3; "linux" in sys_platform',
    'python-xlib >= 0.17; "linux" in sys_platform',
    'enum34; python_version == "2.7"',
]

[project.urls]
Homepage = "https://github.com/moses-palmer/pynput"

[tool.setuptools]
include-package-data = false
zip-safe = true
package-dir = {"" = "lib"}
packages = [
    "pynput",
    "pynput._util",
    "pynput.keyboard",
    "pynput.mouse",
]

[tool.distutils.bdist_wheel]
universal = true
