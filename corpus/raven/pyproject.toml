[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "6.10.0"
description = "Raven is a client for Sentry (https://getsentry.com)"
readme = {text = "\nRaven\n=====\n\nRaven is a Python client for `Sentry <http://getsentry.com/>`_. It provides\nfull out-of-the-box support for many of the popular frameworks, including\n`Django <djangoproject.com>`_, `Flask <http://flask.pocoo.org/>`_, and `Pylons\n<http://www.pylonsproject.org/>`_. Raven also includes drop-in support for any\n`WSGI <https://wsgi.readthedocs.io/>`_-compatible web application.\n", content-type = "text/x-rst"}
license = {text = "BSD"}
authors = [
    {name = "Sentry", email = "hello@getsentry.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python",
    "Topic :: Software Development",
]
dependencies = [
    "contextlib2; python_version < \"3.2\"",
]

[project.urls]
Homepage = "https://github.com/getsentry/raven-python"

[project.optional-dependencies]
flask = [
    "Flask>=0.8",
    "blinker>=1.1",
]
tests = [
    "bottle",
    "celery>=2.5",
    "coverage<4",
    "exam>=0.5.2",
    "flake8==3.5.0",
    "logbook",
    "mock",
    "nose",
    "pytz",
    "pytest>=3.2.0,<3.3.0",
    "pytest-timeout==1.2.1",
    "pytest-xdist==1.18.2",
    "pytest-pythonpath==0.7.2",
    "pytest-cov==2.5.1",
    "pytest-flake8==1.0.0",
    "requests",
    "tornado>=4.1,<5.0",
    "tox",
    "webob",
    "webtest",
    "wheel",
    "anyjson",
    "ZConfig",
    "Flask>=0.8",
    "blinker>=1.1",
    "Flask-Login>=0.2.0",
    "blinker>=1.1",
    "sanic>=0.7.0",
    "aiohttp",
]

[project.scripts]
raven = "raven.scripts.runner:main"

[project.entry-points."paste.filter_app_factory"]
raven = "raven.contrib.paste:sentry_filter_factory"

[tool.setuptools]
packages = [
    "raven",
    "raven.conf",
    "raven.handlers",
    "raven.contrib",
    "raven.utils",
    "raven.transport",
    "raven.scripts",
    "raven.contrib.tornado",
    "raven.contrib.zerorpc",
    "raven.contrib.zconfig",
    "raven.contrib.django",
    "raven.contrib.webpy",
    "raven.contrib.zope",
    "raven.contrib.awslambda",
    "raven.contrib.pylons",
    "raven.contrib.bottle",
    "raven.contrib.celery",
    "raven.contrib.django.templatetags",
    "raven.contrib.django.middleware",
    "raven.contrib.django.management",
    "raven.contrib.django.raven_compat",
    "raven.contrib.django.celery",
    "raven.contrib.django.management.commands",
    "raven.contrib.django.raven_compat.templatetags",
    "raven.contrib.django.raven_compat.middleware",
    "raven.contrib.django.raven_compat.management",
    "raven.contrib.django.raven_compat.management.commands",
    "raven.utils.serializer",
]
include-package-data = true

[tool.distutils.bdist_wheel]
universal = true
