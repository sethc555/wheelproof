[build-system]
requires = [ "setuptools>=61.2", "setuptools_scm",]
build-backend = "setuptools.build_meta"

[project]
name = "azure-functions-durable"
description = "Durable Functions For Python"
keywords = [ "azure", "functions", "azurefunctions", "python", "serverless", "workflows", "durablefunctions",]
classifiers = [ "License :: OSI Approved :: MIT License", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX", "Operating System :: MacOS :: MacOS X", "Environment :: Web Environment", "Development Status :: 5 - Production/Stable",]
requires-python = ">=3.9,<4"
dependencies = [ "azure-functions>=1.12.0", "aiohttp>=3.13.3", "requests==2.*", "python-dateutil>=2.8.0", "furl>=2.1.0", "opentelemetry-api>=1.32.1", "opentelemetry-sdk>=1.32.1",]
dynamic = [ "version",]
[[project.authors]]
name = "Azure Functions team at Microsoft Corp."
email = "azurefunctions@microsoft.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Azure/azure-functions-durable-python"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "tests", "samples", "scripts", "azure",]
namespaces = false
