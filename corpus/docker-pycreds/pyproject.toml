[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "docker-pycreds"
version = "0.4.0"
description = "Python bindings for the docker credentials store API"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Other Environment", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Utilities", "License :: OSI Approved :: Apache Software License",]
dependencies = [ "six >= 1.4.0",]

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://github.com/shin-/dockerpy-creds"

[project.optional-dependencies]
testing = [ "pytest==3.0.2", "flake8==2.4.1", "pytest-cov==2.3.1",]

[tool.setuptools]
packages = [ "dockerpycreds",]
zip-safe = false
include-package-data = false
