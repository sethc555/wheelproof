[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Flask-RESTful"
version = "0.3.10"
description = "Simple framework for creating REST APIs"
classifiers = [ "Framework :: Flask", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "License :: OSI Approved :: BSD License",]
dependencies = [ "aniso8601>=0.82", "Flask>=0.8", "six>=1.3.0", "pytz",]
[[project.authors]]
name = "Twilio API Team"
email = "help@twilio.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://www.github.com/flask-restful/flask-restful/"
Source = "https://github.com/flask-restful/flask-restful"

[project.optional-dependencies]
docs = [ "sphinx",]
testing = [ "Flask-RESTful", "mock>=0.8", "blinker",]

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = [ "any",]

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
