[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "PyMeeus"
version = "0.5.12"
description = "Python implementation of Jean Meeus astronomical routines"
keywords = [ "Meeus", "astronomy", "module", "library",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "Intended Audience :: Education", "Intended Audience :: Science/Research", "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)", "Operating System :: OS Independent", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.6", "Topic :: Scientific/Engineering :: Astronomy",]

[[project.authors]]
name = "Dagoberto Salazar"
email = "dagoberto.salazar@gmail.com"

[project.license]
text = "LGPLv3"

[project.urls]
Homepage = "https://github.com/architest/pymeeus"
Download = "https://github.com/architest/pymeeus"

[tool.setuptools]
py-modules = [ "base",]
packages = [ "pymeeus",]
include-package-data = false
