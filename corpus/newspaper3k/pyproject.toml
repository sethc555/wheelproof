[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper3k"
version = "0.2.8"
description = "Simplified python article discovery & extraction."
readme = "README.rst"
classifiers = [ "Programming Language :: Python :: 3", "Natural Language :: English", "Intended Audience :: Developers",]
dependencies = [ "beautifulsoup4>=4.4.1", "Pillow>=3.3.0", "PyYAML>=3.11", "cssselect>=0.9.2", "lxml>=3.6.0", "nltk>=3.2.1", "requests>=2.10.0", "feedparser>=5.2.1", "tldextract>=2.0.1", "feedfinder2>=0.0.4", "jieba3k>=0.35.1", "python-dateutil>=2.5.3", "tinysegmenter==0.3",]

[[project.authors]]
name = "Lucas Ou-Yang"
email = "lucasyangpersonal@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/codelucas/newspaper/"

[tool.setuptools]
packages = [ "newspaper",]
zip-safe = false
include-package-data = true
