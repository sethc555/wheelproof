[build-system]
requires = [ "setuptools>=61.2", "six", "flake8",]
build-backend = "setuptools.build_meta"

[project]
name = "clickclick"
version = "20.10.2"
description = "Click utility functions"
keywords = [ "click", "console", "terminal", "cli",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "License :: OSI Approved :: Apache Software License", "Operating System :: POSIX :: Linux", "Programming Language :: Python", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: Implementation :: CPython",]
dependencies = [ "click>=4.0", "PyYAML>=3.11",]
[[project.authors]]
name = "Henning Jacobs"
email = "henning.jacobs@jacobs1.de"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://codeberg.org/hjacobs/python-clickclick"

[project.scripts]

[project.optional-dependencies]
testing = [ "pytest-cov", "pytest",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
clickclick = [ "*.json",]

[tool.setuptools.packages.find]
exclude = [ "tests", "tests.*",]
namespaces = false
