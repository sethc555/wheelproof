[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Keras_Preprocessing"
version = "1.1.2"
description = "Easy data preprocessing and data augmentation for deep learning models"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: Education", "Intended Audience :: Science/Research", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = [ "numpy>=1.9.1", "six>=1.9.0",]
[[project.authors]]
name = "Keras Team"

[project.license]
text = "MIT"

[project.readme]
text = "Keras Preprocessing is the data preprocessing\nand data augmentation module of the Keras deep learning library.\nIt provides utilities for working with image data, text data,\nand sequence data.\n\nRead the documentation at: https://keras.io/\n\nKeras Preprocessing may be imported directly\nfrom an up-to-date installation of Keras:\n\n```\nfrom keras import preprocessing\n```\n\nKeras Preprocessing is compatible with Python 2.7-3.6\nand is distributed under the MIT license."
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/keras-team/keras-preprocessing"
Download = "https://github.com/keras-team/keras-preprocessing/tarball/1.1.2"

[project.optional-dependencies]
tests = [ "pandas", "Pillow", "tensorflow", "keras", "pytest", "pytest-xdist", "pytest-cov",]
pep8 = [ "flake8",]
image = [ "scipy>=0.14", "Pillow>=5.2.0",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
