[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collate-sqllineage"
version = "2.1.3"
description = "Collate SQL Lineage for Analysis Tool powered by Python and sqlfluff based on sqllineage."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Collate Committers"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.9"
dependencies = [
    "sqlparse==0.5.4",
    "networkx>=2.4",
    "collate-sqlfluff==3.5.3",
    "sqlglot==29.0.1",
]

[project.optional-dependencies]
"ci" = [
    "bandit",
    "black",
    "flake8",
    "flake8-blind-except",
    "flake8-builtins",
    "flake8-import-order",
    "flake8-logging-format",
    "mypy",
    "pytest",
    "pytest-cov",
    "tox",
    "twine",
    "wheel",
    "setuptools<81",
]
"docs" = [
    "Sphinx>=3.2.0",
    "sphinx_rtd_theme>=0.5.0",
]

[project.scripts]
"sqllineage" = "collate_sqllineage.cli:main"

[tool.setuptools]
packages = [
    "collate_sqllineage",
    "collate_sqllineage.core",
    "collate_sqllineage.core.parser",
    "collate_sqllineage.core.parser.sqlfluff",
    "collate_sqllineage.core.parser.sqlfluff.extractors",
    "collate_sqllineage.core.parser.sqlfluff.handlers",
    "collate_sqllineage.core.parser.sqlglot",
    "collate_sqllineage.core.parser.sqlglot.dialects",
    "collate_sqllineage.core.parser.sqlglot.extractors",
    "collate_sqllineage.core.parser.sqlparse",
    "collate_sqllineage.core.parser.sqlparse.handlers",
    "collate_sqllineage.utils",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["build/*", "build/**/**/*", "data/**/*"]
