[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-managedkafka"
version = "0.4.0"
description = "Google Cloud Managedkafka API client library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.9"
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-managedkafka"

[tool.setuptools]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
packages = [
    "google",
    "google.cloud",
    "google.cloud.managedkafka",
    "google.cloud.managedkafka_v1",
    "google.cloud.managedkafka_v1.services",
    "google.cloud.managedkafka_v1.services.managed_kafka",
    "google.cloud.managedkafka_v1.services.managed_kafka.transports",
    "google.cloud.managedkafka_v1.services.managed_kafka_connect",
    "google.cloud.managedkafka_v1.services.managed_kafka_connect.transports",
    "google.cloud.managedkafka_v1.types",
]
