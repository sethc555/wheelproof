[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uuid"
version = "1.30"
description = "UUID object and generation functions"
authors = [
    {name = "Ka-Ping Yee", email = "ping@zesty.ca"},
]

[project.urls]
Homepage = "http://zesty.ca/python/"

[tool.setuptools]
include-package-data = false
py-modules = ["uuid"]
