[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "mdx_truly_sane_lists"
version = "1.3"
description = "Extension for Python-Markdown that makes lists truly sane. Custom indents for nested lists and fix for messy linebreaks."
keywords = [ "markdown extension", "markup", "lists", "markdown",]
classifiers = [ "Topic :: Text Processing :: Markup", "Topic :: Text Processing :: Markup :: Markdown", "Topic :: Utilities", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "License :: OSI Approved :: MIT License",]
dependencies = [ "Markdown>=2.6",]
[[project.authors]]
name = "radude"
email = "admin@rentry.co"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/radude/mdx_truly_sane_lists"

[tool.setuptools]
packages = [ "mdx_truly_sane_lists",]
include-package-data = false
