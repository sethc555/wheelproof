[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "rouge_score"
version = "0.1.2"
description = "Pure python implementation of ROUGE-1.5.5."
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent",]
requires-python = ">=3.7"
dependencies = [ "absl-py", "nltk", "numpy", "six>=1.14.0",]

[[project.authors]]
name = "Google LLC"
email = "rouge-opensource@google.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/google-research/google-research/tree/master/rouge"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
