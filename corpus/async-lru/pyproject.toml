[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "async-lru"
description = "Simple LRU cache for asyncio"
classifiers = [ "License :: OSI Approved :: MIT License", "Intended Audience :: Developers", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Development Status :: 5 - Production/Stable", "Framework :: AsyncIO",]
keywords = [ "asyncio", "lru", "lru_cache",]
requires-python = ">=3.10"
dependencies = [ "typing_extensions>=4.0.0; python_version<\"3.11\"",]
dynamic = [ "version",]

[[project.maintainers]]
name = "aiohttp team <team@aiohttp.org>"
email = "team@aiohttp.org"

[project.urls]
Homepage = "https://github.com/aio-libs/async-lru"
"Chat: Matrix" = "https://matrix.to/#/#aio-libs:matrix.org"
"Chat: Matrix Space" = "https://matrix.to/#/#aio-libs-space:matrix.org"
"CI: GitHub Actions" = "https://github.com/aio-libs/async-lru/actions"
"GitHub: repo" = "https://github.com/aio-libs/async-lru"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.license]
text = "MIT License"

[tool.setuptools]
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
"*" = [ "py.typed",]

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "async_lru.__version__"
