[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "lkml"
version = "1.3.7"
description = "A speedy LookML parser implemented in pure Python."
keywords = [ "lookml", "looker", "parser",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.7", "Topic :: Software Development",]
[[project.authors]]
name = "Josh Temple"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/joshtemple/lkml"
Download = "https://github.com/joshtemple/lkml/tarball/1.3.7"

[project.scripts]
lkml = "lkml.__init__:cli"

[project.optional-dependencies]
testing = [ "black", "flake8", "isort", "mypy", "pytest", "pytest-cov",]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
lkml = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "docs", "tests*", "scripts",]
namespaces = false

[tool.black]
line-length = 88
target_version = ['py37']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | venv
  )/
)
'''

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
