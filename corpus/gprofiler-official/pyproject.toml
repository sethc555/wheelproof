[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "gprofiler-official"
version = "1.0.0"
description = "Functional enrichment analysis and more via the g:Profiler toolkit"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "License :: OSI Approved :: BSD License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics",]
dependencies = [ "requests",]

[[project.authors]]
name = "Uku Raudvere"
email = "biit.support@ut.ee"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://biit.cs.ut.ee/gprofiler/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
