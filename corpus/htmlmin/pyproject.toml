[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "htmlmin"
version = "0.1.12"
description = "An HTML Minifier"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.2", "Topic :: Text Processing :: Markup :: HTML",]
dependencies = []
[[project.authors]]
name = "Dave Mankoff"
email = "mankyd@gmail.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://htmlmin.readthedocs.io/en/latest/"
Download = "https://github.com/mankyd/htmlmin"

[project.scripts]
htmlmin = "htmlmin.command:main"

[project.optional-dependencies]
testing = []

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
