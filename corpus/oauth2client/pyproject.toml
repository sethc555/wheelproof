[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "oauth2client"
version = "4.1.3"
description = "OAuth 2.0 client library"
keywords = [ "google", "oauth", "2.0", "http", "client",]
classifiers = [ "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Development Status :: 7 - Inactive", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Operating System :: POSIX", "Topic :: Internet :: WWW/HTTP",]
dependencies = [ "httplib2>=0.9.1", "pyasn1>=0.1.7", "pyasn1-modules>=0.0.5", "rsa>=3.1.4", "six>=1.6.1",]
[[project.authors]]
name = "Google Inc."
email = "jonwayne+oauth2client@google.com"

[project.license]
text = "Apache 2.0"

[project.readme]
text = "oauth2client is a client library for OAuth 2.0.\n\nNote: oauth2client is now deprecated. No more features will be added to the\nlibraries and the core team is turning down support. We recommend you use\n`google-auth <https://google-auth.readthedocs.io>`__ and\n`oauthlib <http://oauthlib.readthedocs.io/>`__."
content-type = "text/plain"

[project.urls]
Homepage = "http://github.com/google/oauth2client/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
