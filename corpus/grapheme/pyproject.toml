[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "grapheme"
version = "0.6.0"
description = "Unicode grapheme helpers"
keywords = []
readme = "README.rst"
classifiers = [ "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8",]
dependencies = []

[[project.authors]]
name = "Alvin Lindstam"
email = "alvin.lindstam@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/alvinlindstam/grapheme"

[project.optional-dependencies]
test = [ "pytest", "sphinx", "sphinx-autobuild", "wheel", "twine",]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "ez_setup",]
namespaces = false
