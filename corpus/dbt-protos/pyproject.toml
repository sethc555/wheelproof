[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-protos"
version = "1.0.514"
description = "Public proto bindings for dbt"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
authors = [
    {name = "dbt Labs, Inc."},
    {email = "info@dbtlabs.com"},
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["protobuf>=3.17.1"]

[project.urls]
Homepage = "https://github.com/dbt-labs/proto-python-public"

[tool.setuptools]
packages = [
    "dbtlabs",
    "dbtlabs.proto",
    "dbtlabs.proto.public",
    "dbtlabs.proto.public.v1",
    "dbtlabs.proto.public.v1.common",
    "dbtlabs.proto.public.v1.events",
    "dbtlabs.proto.public.v1.events.fusion",
    "dbtlabs.proto.public.v1.events.fusion.artifact",
    "dbtlabs.proto.public.v1.events.fusion.asset",
    "dbtlabs.proto.public.v1.events.fusion.compat",
    "dbtlabs.proto.public.v1.events.fusion.deps",
    "dbtlabs.proto.public.v1.events.fusion.dev",
    "dbtlabs.proto.public.v1.events.fusion.generic",
    "dbtlabs.proto.public.v1.events.fusion.hook",
    "dbtlabs.proto.public.v1.events.fusion.invocation",
    "dbtlabs.proto.public.v1.events.fusion.log",
    "dbtlabs.proto.public.v1.events.fusion.node",
    "dbtlabs.proto.public.v1.events.fusion.onboarding",
    "dbtlabs.proto.public.v1.events.fusion.phase",
    "dbtlabs.proto.public.v1.events.fusion.process",
    "dbtlabs.proto.public.v1.events.fusion.query",
    "dbtlabs.proto.public.v1.events.fusion.update",
    "dbtlabs.proto.public.v1.fields",
    "dbtlabs.proto.public.v1.records",
    "test",
]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
