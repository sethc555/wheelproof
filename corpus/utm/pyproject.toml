[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "utm"
version = "0.8.1"
description = "Bidirectional UTM-WGS84 converter for python"
keywords = [ "utm", "wgs84", "coordinate", "converter",]
classifiers = [ "Programming Language :: Python", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Development Status :: 4 - Beta", "Environment :: Other Environment", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: GIS",]
requires-python = ">=3.8"

[[project.authors]]
name = "Tobias Bieniek"
email = "Tobias.Bieniek@gmx.de"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/Turbo87/utm"

[tool.setuptools]
packages = [ "utm",]
script-files = [ "scripts/utm-converter",]
include-package-data = false
