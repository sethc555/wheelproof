[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "catkin_pkg"
version = "1.1.0"
description = "catkin package library"
keywords = [ "catkin", "ROS",]
classifiers = [ "Programming Language :: Python", "License :: OSI Approved :: BSD License",]
requires-python = ">=3.6"
dependencies = [ "docutils", "packaging", "python-dateutil", "pyparsing", "setuptools",]
[[project.authors]]
name = "Dirk Thomas"
email = "dthomas@osrfoundation.org"

[[project.maintainers]]
name = "ROS Infrastructure Team"

[project.license]
text = "BSD"

[project.readme]
text = "Library for retrieving information about catkin packages."
content-type = "text/plain"

[project.urls]
Homepage = "http://wiki.ros.org/catkin_pkg"
"Source code" = "https://github.com/ros-infrastructure/catkin_pkg"
"Issue tracker" = "https://github.com/ros-infrastructure/catkin_pkg/issues"

[project.optional-dependencies]
test = [ "flake8", "flake8-blind-except", "flake8-builtins", "flake8-class-newline", "flake8-comprehensions", "flake8-deprecated", "flake8-docstrings", "flake8-import-order", "flake8-quotes", "pytest",]

[project.scripts]
catkin_create_pkg = "catkin_pkg.cli.create_pkg:main"
catkin_find_pkg = "catkin_pkg.cli.find_pkg:main"
catkin_generate_changelog = "catkin_pkg.cli.generate_changelog:main_catching_runtime_error"
catkin_package_version = "catkin_pkg.cli.package_version:main"
catkin_prepare_release = "catkin_pkg.cli.prepare_release:main"
catkin_tag_changelog = "catkin_pkg.cli.tag_changelog:main"
catkin_test_changelog = "catkin_pkg.cli.test_changelog:main"

[tool.setuptools]
packages = [ "catkin_pkg", "catkin_pkg.cli",]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
catkin_pkg = [ "templates/*.in",]
