[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-financial"
version = "1.0.0"
description = "Simple financial functions"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: Financial and Insurance Industry", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development", "Topic :: Office/Business :: Financial :: Accounting", "Topic :: Office/Business :: Financial :: Investment", "Topic :: Office/Business :: Financial :: Spreadsheet",]
requires-python = ">=3.5"
dependencies = [ "numpy>=1.15",]

[[project.authors]]
name = "Travis E. Oliphant et al."

[[project.maintainers]]
name = "Numpy Financial Developers"
email = "numpy-discussion@python.org"

[project.license]
text = "BSD 3-Clause"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://numpy.org/numpy-financial/"
Download = "https://pypi.org/project/numpy-financial/"
"Bug Tracker" = "https://github.com/numpy/numpy-financial/issues"
Documentation = "https://numpy.org/numpy-financial/"
"Source Code" = "https://github.com/numpy/numpy-financial"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "doc",]
namespaces = false
