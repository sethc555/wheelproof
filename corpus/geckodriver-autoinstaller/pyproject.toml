[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "geckodriver-autoinstaller"
version = "0.1.0"
description = "Automatically install geckodriver that supports the currently installed version of chrome."
keywords = [ "geckodriver", "chrome", "selenium", "splinter",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Topic :: Software Development :: Testing", "Topic :: System :: Installation/Setup", "Topic :: Software Development :: Libraries :: Python Modules", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8",]
requires-python = ">=3"
[[project.authors]]
name = "Yeongbin Jo"
email = "yeongbin.jo@pylab.co"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/yeongbin-jo/python-geckodriver-autoinstaller"

[project.scripts]
geckodriver-path = "geckodriver_autoinstaller.utils:print_geckodriver_path"

[tool.setuptools]
packages = [ "geckodriver_autoinstaller",]
include-package-data = false
