[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-exporter-gcp-logging"
description = "Google Cloud Logging exporter for OpenTelemetry"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
version = "1.12.0a0"
requires-python = ">=3.9"
dependencies = [ "google-cloud-logging ~= 3.0", "opentelemetry-sdk >= 1.39.0", "opentelemetry-api >= 1.39.0", "opentelemetry-resourcedetector-gcp >= 1.5.0dev0, == 1.*",]

[[project.authors]]
name = "Google"
email = "opentelemetry-pypi@google.com"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/opentelemetry-operations-python/tree/main/opentelemetry-exporter-gcp-logging"

[project.optional-dependencies]
test = []

[tool.setuptools]
platforms = [ "any",]
include-package-data = false

[project.entry-points.opentelemetry_logs_exporter]
gcp_logging = "opentelemetry.exporter.cloud_logging:CloudLoggingExporter"

[project.entry-points.opentelemetry_environment_variables]
gcp_logging = "opentelemetry.exporter.cloud_logging.environment_variables"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
opentelemetry = [ "py.typed",]

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = true
