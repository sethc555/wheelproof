[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pure-sasl"
version = "0.6.2"
description = "Pure Python client SASL implementation"
keywords = [ "sasl",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Software Development :: Libraries :: Python Modules",]
[[project.authors]]
name = "Tyler Hobbs"
email = "tylerlhobbs@gmail.com"

[[project.maintainers]]
name = "Alex Shafer"
email = "ashafer01@gmail.com"

[project.license]
text = "MIT"

[project.readme]
text = "This package provides a reasonably high-level SASL client written\nin pure Python.  New mechanisms may be integrated easily, but by default,\nsupport for PLAIN, ANONYMOUS, EXTERNAL, CRAM-MD5, DIGEST-MD5, and GSSAPI are\nprovided."
content-type = "text/plain"

[project.urls]
Homepage = "http://github.com/thobbs/pure-sasl"

[project.optional-dependencies]
gssapi = [ "kerberos>=1.3.0",]

[tool.setuptools]
packages = [ "puresasl",]
include-package-data = false
