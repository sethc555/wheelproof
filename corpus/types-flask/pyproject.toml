[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-Flask"
version = "1.1.6"
description = "Typing stubs for Flask"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Typing :: Typed",]
dependencies = [ "types-Jinja2", "types-Werkzeug", "types-click",]

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for Flask\n\nThis is a PEP 561 type stub package for the `Flask` package.\nIt can be used by type-checking tools like mypy, PyCharm, pytype etc. to check code\nthat uses `Flask`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/master/stubs/Flask. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `Flask` package includes type annotations or type stubs\nsince version 2.0. Please uninstall the `types-Flask`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/master/README.md for more details.\nThis package was generated from typeshed commit `a5bc1e037fa9fb541d81de92ad27fa8543c65be4`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"

[tool.setuptools]
packages = [ "flask-stubs",]
include-package-data = false

[tool.setuptools.package-data]
flask-stubs = [ "__init__.pyi", "app.pyi", "blueprints.pyi", "cli.pyi", "config.pyi", "ctx.pyi", "debughelpers.pyi", "globals.pyi", "helpers.pyi", "json/__init__.pyi", "json/tag.pyi", "logging.pyi", "sessions.pyi", "signals.pyi", "templating.pyi", "testing.pyi", "views.pyi", "wrappers.pyi", "METADATA.toml",]
