[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ansicolors"
version = "1.1.8"
description = "ANSI colors for Python"
keywords = [ "ASNI", "color", "style", "console",]
readme = "README.rst"
classifiers = [ "Environment :: Console", "Operating System :: OS Independent", "Intended Audience :: Developers", "License :: OSI Approved :: ISC License (ISCL)", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = []
[[project.authors]]
name = "Giorgos Verigakis"
email = "verigak@gmail.com"

[[project.maintainers]]
name = "Jonathan Eunice"
email = "jonathan.eunice@gmail.com"

[project.license]
text = "ISC"

[project.urls]
Homepage = "http://github.com/jonathaneunice/colors/"

[tool.setuptools]
packages = [ "colors",]
zip-safe = false
include-package-data = false
