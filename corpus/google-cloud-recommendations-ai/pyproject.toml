[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-recommendations-ai"
version = "0.13.0"
description = "Google Cloud Recommendations Ai API client library"
readme = "README.rst"
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.9"
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-recommendations-ai"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud.recommendationengine_v1beta1",
    "google.cloud.recommendationengine",
    "google.cloud.recommendationengine_v1beta1.services",
    "google.cloud.recommendationengine_v1beta1.types",
    "google.cloud.recommendationengine_v1beta1.services.prediction_service",
    "google.cloud.recommendationengine_v1beta1.services.catalog_service",
    "google.cloud.recommendationengine_v1beta1.services.user_event_service",
    "google.cloud.recommendationengine_v1beta1.services.prediction_api_key_registry",
    "google.cloud.recommendationengine_v1beta1.services.prediction_service.transports",
    "google.cloud.recommendationengine_v1beta1.services.catalog_service.transports",
    "google.cloud.recommendationengine_v1beta1.services.user_event_service.transports",
    "google.cloud.recommendationengine_v1beta1.services.prediction_api_key_registry.transports",
]
platforms = [
    "Posix; MacOS X; Windows",
]
include-package-data = true
