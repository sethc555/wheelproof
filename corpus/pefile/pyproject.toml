[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pefile"
version = "2024.8.26"
description = "Python PE parsing module"
keywords = [ "pe", "exe", "dll", "pefile", "pecoff",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=3.6.0"
dependencies = []
[[project.authors]]
name = "Ero Carrera"
email = "ero.carrera@gmail.com"

[project.license]
text = "MIT"

[project.readme]
text = "pefile, Portable Executable reader module\n\nAll the PE file basic structures are available with their default names as\nattributes of the instance returned.\n\nProcessed elements such as the import table are made available with lowercase\nnames, to differentiate them from the upper case basic structure names.\n\npefile has been tested against many edge cases such as corrupted and malformed\nPEs as well as malware, which often attempts to abuse the format way beyond its\nstandard use. To the best of my knowledge most of the abuse is handled\ngracefully.\n\nCopyright (c) 2005-2024 Ero Carrera <ero.carrera@gmail.com>"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/erocarrera/pefile"
Download = "https://github.com/erocarrera/pefile/releases/download/v2024.8.26/pefile-2024.8.26.tar.gz"

[tool.setuptools]
py-modules = [ "pefile", "peutils",]
packages = [ "ordlookup",]
include-package-data = false
