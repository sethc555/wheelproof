[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "MouseInfo"
version = "0.1.3"
description = "An application to display XY position and RGB color information for the pixel currently under the mouse. Works on Python 2 and 3."
keywords = []
classifiers = [ "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7",]
dependencies = [ "rubicon-objc;platform_system==\"Darwin\"", "python3-Xlib;platform_system==\"Linux\" and python_version>=\"3.0\"", "Xlib;platform_system==\"Linux\" and python_version<\"3.0\"", "pyperclip", "Pillow >= 5.2.0; python_version == \"3.7\"", "Pillow >= 4.0.0; python_version == \"3.6\"", "Pillow >= 3.2.0; python_version == \"3.5\"", "Pillow <= 5.4.1, >= 2.5.0; python_version == \"3.4\"", "Pillow <= 4.3.0, >= 2.0.0; python_version == \"3.3\"", "Pillow <= 3.4.2, >= 2.0.0; python_version == \"3.2\"", "Pillow >= 2.0.0; python_version == \"2.7\"",]
[[project.authors]]
name = "Al Sweigart"
email = "al@inventwithpython.com"

[project.license]
text = "GPLv3+"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/asweigart/mouseinfo"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false
