[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymarkdownlnt"
version = "0.9.37"
description = "A GitHub Flavored Markdown compliant Markdown linter."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [
    {name = "Jack De Winter", email = "jack.de.winter@outlook.com"},
]
maintainers = [
    {name = "Jack De Winter", email = "jack.de.winter@outlook.com"},
]
keywords = [
    "markdown",
    "linter",
    "markdown linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10.0"
dependencies = [
    "typing-extensions>=4.5.0",
    "application-properties>=0.9.2",
    "application-file-scanner>=0.6.4",
    "columnar>=1.4.0",
    "py-walk>=0.3.3",
]

[project.urls]
Homepage = "https://github.com/jackdewinter/pymarkdown"
Documentation = "https://pymarkdown.readthedocs.io/"
"Change Log" = "https://pymarkdown.readthedocs.io/en/latest/changelog/"

[project.scripts]
pymarkdown = "pymarkdown.__main__:main"
pymarkdownlnt = "pymarkdown.__main__:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt"]
packages = [
    "pymarkdown",
    "pymarkdown.block_quotes",
    "pymarkdown.coalesce",
    "pymarkdown.container_blocks",
    "pymarkdown.extension_manager",
    "pymarkdown.extensions",
    "pymarkdown.general",
    "pymarkdown.html",
    "pymarkdown.inline",
    "pymarkdown.leaf_blocks",
    "pymarkdown.links",
    "pymarkdown.list_blocks",
    "pymarkdown.plugin_manager",
    "pymarkdown.plugins",
    "pymarkdown.plugins.utils",
    "pymarkdown.resources",
    "pymarkdown.tokens",
    "pymarkdown.transform_gfm",
    "pymarkdown.transform_markdown",
]

[tool.setuptools.package-data]
"*" = ["*.typed"]
