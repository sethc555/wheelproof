[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iterproxy"
version = "0.3.1"
description = "Give any iterable object capability to use .one(), .one_or_none(), .many(k), .skip(k), .all() API."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "MIT"}
authors = [
    {name = "Sanhe Hu", email = "husanhe@gmail.com"},
]
maintainers = [
    {name = "Unknown"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx==4.3.0",
    "sphinx-inline-tabs==2021.8.17b10",
    "sphinx-jinja==1.1.1",
    "sphinx-copybutton==0.4.0",
    "rstobj==1.2.1",
    "docfly==1.0.2",
    "furo==2021.8.31",
]

[project.urls]
Homepage = "https://github.com/MacHu-GWU/iterproxy-0.3.1"
Download = "https://pypi.python.org/pypi/iterproxy/0.3.1#downloads"

[tool.setuptools]
include-package-data = true
platforms = ["Windows", "MacOS", "Unix"]
packages = ["iterproxy", "iterproxy.docs", "iterproxy.tests"]

[tool.setuptools.package-data]
"*" = ["*.*"]
