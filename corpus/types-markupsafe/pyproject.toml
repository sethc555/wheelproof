[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-MarkupSafe"
version = "1.1.10"
description = "Typing stubs for MarkupSafe"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Typing :: Typed",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for MarkupSafe\n\nThis is a PEP 561 type stub package for the `MarkupSafe` package.\nIt can be used by type-checking tools like mypy, PyCharm, pytype etc. to check code\nthat uses `MarkupSafe`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/master/stubs/MarkupSafe. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `MarkupSafe` package includes type annotations or type stubs\nsince version 2.0. Please uninstall the `types-MarkupSafe`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/master/README.md for more details.\nThis package was generated from typeshed commit `98af7d667fa668dec9dc640f0f2669c6e3453e86`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"

[tool.setuptools]
packages = [ "markupsafe-stubs",]
include-package-data = false

[tool.setuptools.package-data]
markupsafe-stubs = [ "__init__.pyi", "_compat.pyi", "_constants.pyi", "_native.pyi", "_speedups.pyi", "METADATA.toml",]
