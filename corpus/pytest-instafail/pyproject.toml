[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-instafail"
version = "0.5.0"
description = "pytest plugin to show failures instantly"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: POSIX", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS :: MacOS X", "Topic :: Software Development :: Testing", "Topic :: Software Development :: Libraries", "Topic :: Utilities", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=3.7"
dependencies = [ "pytest>=5",]

[[project.authors]]
name = "Janne Vanhala"
email = "janne.vanhala@gmail.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/pytest-dev/pytest-instafail"

[tool.setuptools]
py-modules = [ "pytest_instafail",]
zip-safe = false
include-package-data = true
platforms = [ "any",]

[project.entry-points.pytest11]
instafail = "pytest_instafail"
