[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-vectorsearch"
version = "0.11.0"
description = "Google Cloud Vectorsearch API client library"
readme = "README.rst"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
requires-python = ">=3.10"
dependencies = [
    "google-api-core[grpc] >= 2.17.1, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.59.0, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-vectorsearch"

[tool.setuptools]
platforms = ["Posix; MacOS X; Windows"]
include-package-data = true
packages = [
    "google",
    "google.cloud",
    "google.cloud.vectorsearch_v1beta",
    "google.cloud.vectorsearch",
    "google.cloud.vectorsearch_v1",
    "google.cloud.vectorsearch_v1beta.services",
    "google.cloud.vectorsearch_v1beta.types",
    "google.cloud.vectorsearch_v1beta.services.vector_search_service",
    "google.cloud.vectorsearch_v1beta.services.data_object_search_service",
    "google.cloud.vectorsearch_v1beta.services.data_object_service",
    "google.cloud.vectorsearch_v1beta.services.vector_search_service.transports",
    "google.cloud.vectorsearch_v1beta.services.data_object_search_service.transports",
    "google.cloud.vectorsearch_v1beta.services.data_object_service.transports",
    "google.cloud.vectorsearch_v1.services",
    "google.cloud.vectorsearch_v1.types",
    "google.cloud.vectorsearch_v1.services.vector_search_service",
    "google.cloud.vectorsearch_v1.services.data_object_search_service",
    "google.cloud.vectorsearch_v1.services.data_object_service",
    "google.cloud.vectorsearch_v1.services.vector_search_service.transports",
    "google.cloud.vectorsearch_v1.services.data_object_search_service.transports",
    "google.cloud.vectorsearch_v1.services.data_object_service.transports",
]
