[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "argparse"
version = "1.4.0"
description = "Python command-line parsing library"
keywords = [ "argparse", "command", "line", "parser", "parsing",]
readme = "README.txt"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: Python Software Foundation License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Programming Language :: Python :: 2.3", "Programming Language :: Python :: 2.4", "Programming Language :: Python :: 2.5", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.0", "Programming Language :: Python :: 3.1", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Topic :: Software Development",]

[[project.authors]]
name = "Thomas Waldmann"
email = "tw@waldmann-edv.de"

[project.license]
text = "Python Software Foundation License"

[project.urls]
Homepage = "https://github.com/ThomasWaldmann/argparse/"

[tool.setuptools]
py-modules = [ "argparse",]
platforms = [ "any",]
include-package-data = false
