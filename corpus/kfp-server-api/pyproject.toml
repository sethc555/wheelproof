[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "kfp-server-api"
version = "2.16.1"
description = "Kubeflow Pipelines API"
keywords = [ "OpenAPI", "OpenAPI-Generator", "Kubeflow Pipelines API",]
dependencies = [ "urllib3 >= 1.15", "six >= 1.10", "certifi", "python-dateutil",]
[[project.authors]]
name = "google"
email = "kubeflow-pipelines@google.com"

[project.license]
text = "Apache 2.0"

[project.readme]
text = "This file contains REST API specification for Kubeflow Pipelines. The file is autogenerated from the swagger definition.  # noqa: E501"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/kubeflow/pipelines"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "test", "tests",]
namespaces = false
