[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soda-core-spark"
version = "3.5.6"
dependencies = [
    "soda-core==3.5.6",
]

[project.optional-dependencies]
hive = [
    "PyHive[hive]",
]
odbc = [
    "pyodbc",
]
databricks = ["databricks-sql-connector"]

[tool.setuptools]
packages = ["soda", "soda.data_sources"]
include-package-data = false
