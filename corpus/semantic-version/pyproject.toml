[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "semantic_version"
version = "2.10.0"
description = "A library implementing the 'SemVer' scheme."
keywords = [ "semantic version", "versioning", "version",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Topic :: Software Development :: Libraries :: Python Modules", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">= 2.7"
dependencies = []

[[project.authors]]
name = "Raphaël Barrois"
email = "raphael.barrois+semver@polytechnique.org"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/rbarrois/python-semanticversion"

[project.optional-dependencies]
dev = [ "Django>=1.11", "nose2", "tox", "check_manifest", "coverage", "flake8", "wheel", "zest.releaser[recommended]", "readme_renderer<25.0; python_version == \"3.4\"", "colorama<=0.4.1; python_version == \"3.4\"",]
doc = [ "Sphinx", "sphinx_rtd_theme",]

[tool.setuptools]
zip-safe = false
packages = [ "semantic_version",]
license-files = [ "LICENSE",]
include-package-data = false
