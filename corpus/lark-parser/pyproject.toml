[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-parser"
version = "0.12.0"
description = "a modern parsing library"
license = {text = "MIT"}
authors = [
    {name = "Erez Shinan", email = "erezshin@gmail.com"},
]
keywords = ["Earley LALR parser parsing ast"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
]

[project.readme]
content-type = "text/markdown"
text = '''

Lark is a modern general-purpose parsing library for Python.

With Lark, you can parse any context-free grammar, efficiently, with very little code.

Main Features:
 - Builds a parse-tree (AST) automagically, based on the structure of the grammar
 - Earley parser
    - Can parse all context-free grammars
    - Full support for ambiguous grammars
 - LALR(1) parser
    - Fast and light, competitive with PLY
    - Can generate a stand-alone parser
 - CYK parser, for highly ambiguous grammars
 - EBNF grammar
 - Unicode fully supported
 - Python 2 & 3 compatible
 - Automatic line & column tracking
 - Standard library of terminals (strings, numbers, names, etc.)
 - Import grammars from Nearley.js
 - Extensive test suite
 - And much more!
'''

[project.urls]
Homepage = "https://github.com/lark-parser/lark"
Download = "https://github.com/lark-parser/lark/tarball/master"

[project.optional-dependencies]
regex = ["regex"]
nearley = ["js2py"]
atomic_cache = ["atomicwrites"]

[project.entry-points."pyinstaller40"]
hook-dirs = "lark.__pyinstaller:get_hook_dirs"

[tool.setuptools]
packages = ["lark", "lark.parsers", "lark.tools", "lark.grammars", "lark.__pyinstaller", "lark-stubs"]
include-package-data = false

# Original: package_data = {'': ['*.md', '*.lark'], 'lark-stubs': ['*.pyi']}
# Expressed via the "*" key (same resulting file set; "lark-stubs" is not a
# valid package-data key for older setuptools pyproject validation).
[tool.setuptools.package-data]
"*" = ["*.md", "*.lark", "*.pyi"]

[tool.distutils.bdist_wheel]
universal = true
