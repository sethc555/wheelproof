[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "cobble"
version = "0.1.4"
description = "Create data objects"
keywords = [ "data", "object", "case", "class",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Operating System :: OS Independent",]
requires-python = ">=3.5"

[[project.authors]]
name = "Michael Williamson"
email = "mike@zwobble.org"

[project.urls]
Homepage = "http://github.com/mwilliamson/python-cobble"

[tool.setuptools]
packages = [ "cobble",]
include-package-data = false
