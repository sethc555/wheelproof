[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "telepath"
version = "0.3.1"
description = "A library for exchanging data between Python and JavaScript"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Framework :: Django",]
requires-python = ">=3.8"

[[project.authors]]
name = "Matthew Westcott"
email = "matthew.westcott@torchbox.com"

[project.license]
text = "BSD"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/wagtail/telepath"

[project.optional-dependencies]
docs = [ "mkdocs>=1.1,<1.2", "mkdocs-material>=6.2,<6.3",]

[tool.setuptools]
packages = [ "telepath",]
include-package-data = true
