[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-appconf"
version = "1.2.0"
description = "A helper class for handling configuration defaults of packaged apps gracefully."
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Framework :: Django", "Framework :: Django :: 4.2", "Framework :: Django :: 5.1", "Framework :: Django :: 5.2", "Framework :: Django :: 6.0", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3 :: Only", "Topic :: Utilities",]
requires-python = ">=3.9"
dependencies = [ "django",]

[[project.authors]]
name = "Jannis Leidel"
email = "jannis@leidel.info"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://django-appconf.readthedocs.io/"
Source = "https://github.com/django-compressor/django-appconf"

[tool.setuptools]
packages = [ "appconf",]
include-package-data = false
