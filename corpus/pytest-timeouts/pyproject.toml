[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-timeouts"
description = "Linux-only Pytest plugin to control durations of various test case execution phases"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Environment :: Plugins", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: Unix", "Operating System :: POSIX", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing", "Topic :: Utilities",]
version = "1.2.1"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"
dependencies = [ "pytest>=3.1",]

[[project.authors]]
name = "Pawel Lampe"
email = "pawel.lampe@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Scony/pytest-timeouts"
Source = "https://github.com/Scony/pytest-timeouts"
Documentation = "https://pytest-timeouts.readthedocs.io"
Tracker = "https://github.com/Scony/pytest-timeouts/issues"

[project.license]
text = "MIT license"

[tool.setuptools]
py-modules = [ "pytest_timeouts",]
platforms = [ "unix", "linux",]
license-files = [ "LICENSE",]
include-package-data = false

[project.entry-points.pytest11]
timeouts = "pytest_timeouts"
