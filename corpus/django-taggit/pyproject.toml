[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-taggit"
description = "django-taggit is a reusable Django application for simple tagging."
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Framework :: Django", "Framework :: Django :: 4.1", "Framework :: Django :: 4.2", "Framework :: Django :: 5.0", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
requires-python = ">=3.8"
dependencies = [ "Django>=4.1",]
dynamic = [ "version",]

[[project.authors]]
name = "Alex Gaynor"
email = "alex.gaynor@gmail.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/jazzband/django-taggit"
Documentation = "https://django-taggit.readthedocs.io"
Source = "https://github.com/jazzband/django-taggit"
Tracker = "https://github.com/jazzband/django-taggit/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "taggit.__version__"
