[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ghp-import"
version = "2.1.0"
description = "Copy your docs directly to the gh-pages branch."
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: OSI Approved :: Apache Software License", "Intended Audience :: Developers", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3",]
dependencies = [ "python-dateutil>=2.8.1",]

[[project.authors]]
name = "Paul Joseph Davis"
email = "paul.joseph.davis@gmail.com"

[project.license]
text = "Apache Software License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/c-w/ghp-import"

[project.optional-dependencies]
dev = [ "twine", "markdown", "flake8", "wheel",]

[project.scripts]
ghp-import = "ghp_import:main"

[tool.setuptools]
py-modules = [ "ghp_import",]
zip-safe = false
include-package-data = false
