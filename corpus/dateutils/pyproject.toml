[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "dateutils"
version = "0.6.12"
description = "Various utilities for working with date and datetime objects"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Natural Language :: English", "Operating System :: POSIX :: Linux", "Programming Language :: Python",]
dependencies = [ "argparse; python_version < \"2.7\"", "python-dateutil", "pytz",]

[[project.authors]]
name = "Jeremy Cantrell"
email = "jmcantrell@gmail.com"

[project.readme]
file = "README.mkd"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/jmcantrell/python-dateutils"

[project.scripts]
dateadd = "dateutils.dateadd:main"
datediff = "dateutils.datediff:main"

[tool.setuptools]
packages = [ "dateutils",]
zip-safe = false
include-package-data = true
