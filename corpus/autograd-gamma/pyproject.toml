[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "autograd-gamma"
version = "0.5.0"
description = "Autograd compatible approximations to the gamma family of functions"
keywords = [ "autograd", "gamma", "incomplete gamma function",]
classifiers = [ "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3",]
dependencies = [ "autograd>=1.2.0", "scipy>=1.2.0",]

[[project.authors]]
name = "Cameron Davidson-Pilon"
email = "cam.davidson.pilon@gmail.com"

[project.license]
text = "MIT License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/CamDavidsonPilon/autograd-gamma"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
