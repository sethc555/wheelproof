[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "openpyxl"
version = "3.1.5"
description = "A Python library to read/write Excel 2010 xlsx/xlsm files"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Operating System :: MacOS :: MacOS X", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX", "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",]
requires-python = ">=3.8"
dependencies = [ "et_xmlfile",]

[[project.authors]]
name = "See AUTHORS"
email = "charlie.clark@clark-consulting.eu"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://openpyxl.readthedocs.io"
Documentation = "https://openpyxl.readthedocs.io/en/stable/"
Source = "https://foss.heptapod.net/openpyxl/openpyxl"
Tracker = "https://foss.heptapod.net/openpyxl/openpyxl/-/issues"

[tool.setuptools]
license-files = [ "LICENCE.rst",]
include-package-data = false

[tool.setuptools.package-dir]

[tool.setuptools.packages.find]
exclude = [ "*.tests",]
namespaces = false
