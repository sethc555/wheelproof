[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "mistletoe"
version = "1.5.1"
description = "A fast, extensible Markdown parser in pure Python."
keywords = [ "markdown", "lexer", "parser", "development",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Markup :: Markdown",]
requires-python = "~=3.5"

[[project.authors]]
name = "Mi Yu"
email = "hello@afteryu.me"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/miyuchina/mistletoe"

[project.scripts]
mistletoe = "mistletoe.__main__:main"

[tool.setuptools]
packages = [ "mistletoe", "mistletoe.contrib",]
zip-safe = false
include-package-data = false

[tool.setuptools.package-data]
mistletoe = [ "py.typed",]
