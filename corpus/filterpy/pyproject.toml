[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "filterpy"
version = "1.4.5"
description = "Kalman filtering and optimal estimation library"
keywords = [ "Kalman", "filters", "filtering", "optimal", "estimation", "tracking",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering", "Topic :: Scientific/Engineering :: Mathematics", "Topic :: Scientific/Engineering :: Physics", "Topic :: Utilities", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX", "Operating System :: Unix", "Operating System :: MacOS",]
dependencies = [ "numpy", "scipy", "matplotlib",]
[[project.authors]]
name = "Roger Labbe"
email = "rlabbejr@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/rlabbe/filterpy"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
filterpy = [ "README.rst", "filterpy/changelog.txt", "LICENSE", "filterpy/kalman/tests/*.py",]

[tool.setuptools.packages.find]
exclude = [ "contrib",]
namespaces = false
