[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ulid-py"
version = "1.1.0"
description = "Universally Unique Lexicographically Sortable Identifier"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Natural Language :: English", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Topic :: Software Development :: Libraries :: Python Modules",]
[[project.authors]]
name = "Andrew Hawker"
email = "andrew.r.hawker@gmail.com"

[project.license]
text = "Apache 2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/ahawker/ulid"

[tool.setuptools]
zip-safe = false
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
ulid = [ "py.typed",]

[tool.setuptools.packages.find]
namespaces = false
