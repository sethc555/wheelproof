[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oscrypto"
version = "1.3.0"
description = "TLS (SSL) sockets, key generation, encryption, decryption, signing, verification and KDFs using the OS crypto libraries. Does not require a compiler, and relies on the OS for patching. Works on Windows, OS X and Linux/BSD."
readme = {file = "readme.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [
    {name = "wbond", email = "will@wbond.net"},
]
keywords = ["crypto pki tls ssl x509 certificate encrypt decrypt sign verify rsa dsa ec dh"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "asn1crypto>=1.5.1",
]

[project.urls]
"Homepage" = "https://github.com/wbond/oscrypto"

[tool.setuptools]
packages = [
    "oscrypto",
    "oscrypto._linux_bsd",
    "oscrypto._mac",
    "oscrypto._openssl",
    "oscrypto._win",
]
include-package-data = false
