[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-contentsafety"
version = "1.0.0"
description = "Microsoft Azure AI Content Safety Client Library for Python"
keywords = [ "azure", "azure", "sdk",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Programming Language :: Python", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "License :: OSI Approved :: MIT License",]
requires-python = ">=3.7"
dependencies = [ "isodate<1.0.0,>=0.6.1", "azure-core<2.0.0,>=1.28.0", "typing-extensions>=4.3.0; python_version<'3.8.0'",]

[[project.authors]]
name = "Microsoft Corporation"
email = "azpysdkhelp@microsoft.com"

[project.license]
text = "MIT License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Azure/azure-sdk-for-python/tree/main/sdk"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
"azure.ai.contentsafety" = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "tests", "azure", "azure.ai",]
namespaces = false
