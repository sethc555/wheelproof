[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "assemblyai"
version = "0.64.9"
description = "AssemblyAI Python SDK"
classifiers = [ "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Topic :: Scientific/Engineering :: Artificial Intelligence", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: Libraries :: Python Modules", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",]
requires-python = ">=3.8"
dependencies = [ "httpx>=0.19.0", "pydantic>=2.0; python_version>='3.14'", "pydantic>=1.10.17; python_version<'3.14'", "pydantic-settings>=2.0; python_version>='3.14'", "typing-extensions>=3.7", "websockets>=11.0",]

[[project.authors]]
name = "AssemblyAI"
email = "engineering.sdk@assemblyai.com"

[project.license]
text = "MIT License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/AssemblyAI/assemblyai-python-sdk"
Code = "https://github.com/AssemblyAI/assemblyai-python-sdk"
Issues = "https://github.com/AssemblyAI/assemblyai-python-sdk/issues"
Documentation = "https://github.com/AssemblyAI/assemblyai-python-sdk/blob/master/README.md"
"API Documentation" = "https://www.assemblyai.com/docs/"
Website = "https://assemblyai.com/"

[project.optional-dependencies]
extras = [ "pyaudio>=0.2.13",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
