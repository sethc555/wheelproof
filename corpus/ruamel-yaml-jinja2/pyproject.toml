[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruamel.yaml.jinja2"
version = "0.2.7"
description = "jinja2 pre and post-processor to update with YAML"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "MIT"}
authors = [
    {name = "Anthon van der Neut", email = "a.van.der.neut@ruamel.eu"},
]
requires-python = ">=3.6"
keywords = ["yaml 1.2 parser round-trip jinja2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "ruamel.yaml>=0.16.1",
]

[project.urls]
Homepage = "https://sourceforge.net/p/ruamel-yaml-jinja2/code/ci/default/tree"

[tool.setuptools]
include-package-data = false
packages = ["ruamel.yaml.jinja2"]

[tool.setuptools.package-dir]
"ruamel.yaml.jinja2" = "."
