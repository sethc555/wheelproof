[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pyinotify"
version = "0.9.6"
description = "Linux filesystem events monitoring"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Operating System :: POSIX :: Linux", "Programming Language :: Python", "Programming Language :: Python :: 2.4", "Programming Language :: Python :: 2.5", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.0", "Programming Language :: Python :: 3.1", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Filesystems", "Topic :: System :: Monitoring",]

[[project.authors]]
name = "Sebastien Martini"
email = "seb@dbzteam.org"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "http://github.com/seb-m/pyinotify"
Download = "http://pypi.python.org/pypi/pyinotify"

[tool.setuptools]
py-modules = [ "pyinotify",]
platforms = [ "Linux",]
include-package-data = false

[tool.setuptools.package-dir]
"" = "python3"
