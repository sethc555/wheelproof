[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trino"
version = "0.337.0"
description = "Client for the Trino distributed SQL Engine"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache 2.0"}
authors = [
    {name = "Trino Team"},
    {email = "python-client@trino.io"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "lz4",
    "orjson >= 3.11.0 ; platform_python_implementation != 'PyPy'",
    "python-dateutil",
    "pytz",
    "requests>=2.32.4",
    "tzlocal",
    "zstandard",
]

[project.optional-dependencies]
all = [
    "requests_kerberos",
    "sqlalchemy >= 1.3",
]
kerberos = [
    "requests_kerberos",
]
gssapi = [
    "requests_gssapi",
    "krb5 == 0.5.1",
]
sqlalchemy = [
    "sqlalchemy >= 1.3",
]
tests = [
    "requests_kerberos",
    "sqlalchemy >= 1.3",
    "requests_gssapi",
    "krb5 == 0.5.1",
    "httpretty < 1.1",
    "pytest",
    "pytest-runner",
    "pre-commit",
    "black",
    "isort",
    "keyring",
    "testcontainers",
    "boto3",
]
external-authentication-token-cache = [
    "keyring",
]

[project.urls]
Homepage = "https://github.com/trinodb/trino-python-client"

[project.entry-points."sqlalchemy.dialects"]
trino = "trino.sqlalchemy.dialect:TrinoDialect"

[tool.setuptools]
packages = ["trino", "trino.sqlalchemy"]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["LICENSE", "README.md"]
