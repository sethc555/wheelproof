[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SPARQLWrapper"
version = "2.0.0"
description = "SPARQL Endpoint interface to Python"
readme = {text = "This is a wrapper around a SPARQL service. It helps in creating the query URI and, possibly, convert the result into a more manageable format.", content-type = "text/plain"}
license = {text = "W3C SOFTWARE NOTICE AND LICENSE"}
authors = [
    {name = "Ivan Herman, Sergio Fernández, Carlos Tejo Alonso, Alexey Zakhlestin", email = "rdflib-dev@googlegroups.com"},
]
keywords = [
    "python",
    "sparql",
    "rdf",
    "rdflib",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: W3C License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.7"
dependencies = [
    "rdflib>=6.1.1",
]

[project.urls]
Homepage = "http://rdflib.github.io/sparqlwrapper"
Download = "https://github.com/RDFLib/sparqlwrapper/releases"
Home = "https://rdflib.github.io/sparqlwrapper"
Documentation = "https://sparqlwrapper.readthedocs.io"
Source = "https://github.com/RDFLib/sparqlwrapper"
Tracker = "https://github.com/RDFLib/sparqlwrapper/issues"

[project.optional-dependencies]
dev = [
    "setuptools>=3.7.1",
    "mypy>=0.931",
    "pandas>=1.3.5",
    "pandas-stubs>=1.2.0.48",
]
pandas = [
    "pandas>=1.3.5",
]
keepalive = [
    "keepalive>=0.5",
]
docs = [
    "sphinx < 5",
    "sphinx-rtd-theme",
]

[project.scripts]
rqw = "SPARQLWrapper.main:main"

[tool.setuptools]
packages = [
    "SPARQLWrapper",
]
platforms = [
    "any",
]
include-package-data = false

[tool.setuptools.package-data]
SPARQLWrapper = [
    "py.typed",
]
