[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pdfplumber"
version = "0.11.9"
description = "Plumb a PDF for detailed information about each char, rectangle, and line."
classifiers = [ "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
requires-python = ">=3.8"
dependencies = [ "pdfminer.six==20251230", "Pillow>=9.1", "pypdfium2>=4.18.0",]

[[project.authors]]
name = "Jeremy Singer-Vine"
email = "jsvine@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/jsvine/pdfplumber"

[project.scripts]
pdfplumber = "pdfplumber.cli:main"

[project.optional-dependencies]
testing = [ "pdfminer.six==20251230", "Pillow>=9.1", "pypdfium2>=4.18.0", "black==24.8.0", "flake8==7.1.1", "isort==5.13.2", "jupyterlab>=4.4.8", "mypy==1.11.1", "nbexec==0.2.0", "pandas-stubs>=2.2.2.240805", "pandas>=2.2.2", "py==1.11.0", "pytest-cov==5.0.0", "pytest-xdist==3.8.0", "pytest==8.3.2", "setuptools>=78.1.1", "types-Pillow==10.2.0.20240520",]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
pdfplumber = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "test",]
namespaces = false
