[build-system]
requires = [ "setuptools>=61.2", "pbr",]
build-backend = "setuptools.build_meta"

[project]
name = "retry"
version = "0.9.2"
description = "Easy to use retry decorator."
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development",]
readme = "README.rst"
requires-python = ">=2.6"
[[project.authors]]
name = "invl"
email = "invlpg@gmail.com"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://github.com/invl/retry"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
