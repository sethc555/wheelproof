[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "glob2"
version = "0.7"
description = "Version of the glob module that can capture patterns and supports recursive wildcards"
classifiers = [ "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries",]

[[project.authors]]
name = "Michael Elsdoerfer"
email = "michael@elsdoerfer.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "http://github.com/miracle2k/python-glob2/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
