[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "blessings"
version = "1.7"
description = "A thin, practical wrapper around terminal coloring, styling, and positioning"
keywords = [ "terminal", "tty", "curses", "ncurses", "formatting", "style", "color", "console",]
readme = "README.rst"
classifiers = [ "Intended Audience :: Developers", "Natural Language :: English", "Development Status :: 5 - Production/Stable", "Environment :: Console", "Environment :: Console :: Curses", "License :: OSI Approved :: MIT License", "Operating System :: POSIX", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries", "Topic :: Software Development :: User Interfaces", "Topic :: Terminals",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"
dependencies = [ "six",]
[[project.authors]]
name = "Erik Rose"
email = "erikrose@grinchcentral.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/erikrose/blessings"

[project.optional-dependencies]
testing = [ "nose",]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "ez_setup",]
namespaces = false
