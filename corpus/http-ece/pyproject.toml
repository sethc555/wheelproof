[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "http_ece"
version = "1.2.1"
description = "Encrypted Content Encoding for HTTP"
keywords = [ "crypto", "http",]
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
dependencies = [ "cryptography>=2.5",]
[[project.authors]]
name = "Martin Thomson"
email = "martin.thomson@gmail.com"

[project.license]
text = "MIT"

[project.readme]
text = "Encipher HTTP Messages"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/martinthomson/encrypted-content-encoding"

[project.optional-dependencies]
testing = [ "pytest", "pytest-cov",]

[tool.setuptools]
packages = [ "http_ece",]
script-files = []
include-package-data = false
