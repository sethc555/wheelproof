[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ansiwrap"
version = "0.8.4"
description = "textwrap, but savvy to ANSI colors and styles"
keywords = [ "text", "textwrap", "ANSI", "colors",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: OS Independent", "License :: OSI Approved :: Apache Software License", "Intended Audience :: Developers", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing", "Topic :: Text Processing :: Filters",]
dependencies = [ "textwrap3>=0.9.2",]
[[project.authors]]
name = "Jonathan Eunice"
email = "jonathan.eunice@gmail.com"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://github.com/jonathaneunice/ansiwrap"

[project.optional-dependencies]
testing = [ "tox", "pytest", "ansicolors>=1.1.8", "coverage", "pytest-cov",]

[tool.setuptools]
packages = [ "ansiwrap",]
zip-safe = false
include-package-data = false
