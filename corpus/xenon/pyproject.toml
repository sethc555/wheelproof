[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "xenon"
version = "0.9.3"
description = "Monitor code metrics for Python on your CI server"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.1", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Software Development :: Quality Assurance", "Topic :: Utilities", "Topic :: Internet :: WWW/HTTP",]
dependencies = [ "radon>=4,<7", "requests>=2.0,<3.0", "PyYAML>=5.0,<7.0",]

[[project.authors]]
name = "Michele Lacchia"
email = "michelelacchia@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://xenon.readthedocs.org/"
Download = "https://pypi.python.org/xenon/"

[project.scripts]
xenon = "xenon:main"

[project.optional-dependencies]
testing = [ "tox", "httpretty",]

[tool.setuptools]
packages = [ "xenon",]
platforms = [ "any",]
include-package-data = false
