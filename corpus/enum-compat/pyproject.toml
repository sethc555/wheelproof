[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "enum-compat"
version = "0.0.3"
description = "enum/enum34 compatibility package"
keywords = [ "enum", "compatibility", "enum34",]
classifiers = [ "Intended Audience :: Developers", "Topic :: Software Development :: Libraries", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5",]
dependencies = [ "enum34; python_version < \"3.4\"",]
[[project.authors]]
name = "Jakub Stasiak"
email = "jakub@stasiak.at"

[project.license]
text = "MIT"

[project.readme]
text = "enum-compat\n===========\n\nThis is a virtual package, its whole purpose is to install enum34 on\nPython older than 3.4. On Python 3.4+ it's a no-op."
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/jstasiak/enum-compat"

[tool.setuptools]
zip-safe = false
include-package-data = false
