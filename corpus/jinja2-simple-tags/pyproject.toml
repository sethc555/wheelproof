[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "jinja2-simple-tags"
description = "Base classes for quick-and-easy template tag development"
classifiers = [ "Intended Audience :: Developers", "Development Status :: 4 - Beta", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">= 3.6"
dependencies = [ "Jinja2 >= 2.10",]
dynamic = [ "version",]

[[project.authors]]
name = "Mihail Mishakin"
email = "x896321475@gmail.com"

[[project.maintainers]]
name = "Mihail Mishakin"
email = "x896321475@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "BSD license"

[project.urls]
Homepage = "https://github.com/dldevinc/jinja2-simple-tags"

[tool.setuptools]
zip-safe = false
include-package-data = true
py-modules = [ "jinja2_simple_tags",]
platforms = [ "OS Independent",]

[tool.setuptools.dynamic.version]
attr = "jinja2_simple_tags.__version__"
