[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "xlrd"
version = "2.0.2"
description = "Library for developers to extract data from Microsoft Excel (tm) .xls spreadsheet files"
keywords = [ "xls", "excel", "spreadsheet", "workbook",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Operating System :: OS Independent", "Topic :: Database", "Topic :: Office/Business", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*"

[[project.authors]]
name = "Chris Withers"
email = "chris@withers.org"

[project.license]
text = "BSD"

[project.urls]
Homepage = "http://www.python-excel.org/"

[project.optional-dependencies]
test = [ "pytest", "pytest-cov",]
docs = [ "sphinx",]
build = [ "wheel", "twine",]

[tool.setuptools]
packages = [ "xlrd",]
script-files = [ "scripts/runxlrd.py",]
license-files = [ "LICENSE",]
include-package-data = false
