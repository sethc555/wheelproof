[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "python_http_client"
version = "3.3.7"
description = "HTTP REST client, simplified for Python"
keywords = [ "REST", "HTTP", "API",]
classifiers = [ "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"

[[project.authors]]
name = "Elmer Thomas"
email = "help@twilio.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/sendgrid/python-http-client"
Download = "https://github.com/sendgrid/python-http-client/tarball/3.3.7"

[tool.setuptools]
packages = [ "python_http_client",]
include-package-data = true
