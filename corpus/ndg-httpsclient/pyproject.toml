[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ndg_httpsclient"
version = "0.5.1"
description = "Provides enhanced HTTPS support for httplib and urllib2 using PyOpenSSL"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Environment :: Web Environment", "Intended Audience :: End Users/Desktop", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "Intended Audience :: Science/Research", "License :: OSI Approved :: BSD License", "Natural Language :: English", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Security", "Topic :: Internet", "Topic :: Scientific/Engineering", "Topic :: System :: Distributed Computing", "Topic :: System :: Systems Administration :: Authentication/Directory", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"
dependencies = [ "PyOpenSSL", "pyasn1>=0.1.1",]

[[project.authors]]
name = "Richard Wilkinson and Philip Kershaw"
email = "Philip.Kershaw@stfc.ac.uk"

[project.license]
text = "BSD - See ndg/httpsclient/LICENCE file for details"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/cedadev/ndg_httpsclient/"

[project.scripts]
ndg_httpclient = "ndg.httpsclient.utils:main"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.package-data]
"ndg.httpsclient" = [ "LICENSE", "test/README", "test/scripts/*.sh", "test/pki/localhost.*", "test/pki/ca/*.0",]

[tool.setuptools.packages.find]
namespaces = false
