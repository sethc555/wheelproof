[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-python"
version = "1.4.post1"
description = "The hassle-free way to integrate analytics into any python application."
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8",]
dependencies = [ "requests>=2.7,<3.0", "six>=1.5", "monotonic>=1.5", "backoff==1.10.0", "python-dateutil>2.1",]
[[project.authors]]
name = "Segment"
email = "friends@segment.com"

[[project.maintainers]]
name = "Segment"
email = "friends@segment.com"

[project.license]
text = "MIT License"

[project.readme]
text = "This library was renamed due to a naming conflict with an official python library.\nPlease use the new listing at https://pypi.org/project/segment-analytics-python/\n\nSegment is the simplest way to integrate analytics into your application.\nOne API allows you to turn on any other analytics service. No more learning\nnew APIs, repeated code, and wasted development time.\n\nThis is the official python client that wraps the Segment REST API (https://segment.com).\n\nDocumentation and more details at https://github.com/segmentio/analytics-python"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/segmentio/analytics-python"

[project.optional-dependencies]
test = [ "mock==2.0.0", "pylint==1.9.3", "flake8==3.7.9",]

[tool.setuptools]
packages = [ "analytics", "analytics.test",]
include-package-data = false
