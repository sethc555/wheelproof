[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memoization"
version = "0.4.0"
description = "A powerful caching library for Python, with TTL support and multiple algorithm options. (https://github.com/lonelyenvoy/python-memoization)"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [{name = "lonelyenvoy"}, {email = "petrinchor@gmail.com"}]
keywords = ["memoization memorization remember decorator cache caching function callable functional ttl limited capacity fast high-performance optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, <4"

[project.urls]
"Homepage" = "https://github.com/lonelyenvoy/python-memoization"

[tool.setuptools]
packages = [
    "memoization",
    "memoization.backport",
    "memoization.caching",
    "memoization.caching.general",
    "memoization.config",
    "memoization.constant",
    "memoization.type",
    "memoization.type.caching",
    "memoization.type.caching.general",
    "memoization.util",
]
include-package-data = false

[tool.setuptools.package-data]
"memoization" = ["py.typed", "*.pyi", "memoization.pyi", "model.pyi"]
"memoization.caching" = ["fifo_cache.pyi", "lfu_cache.pyi", "lru_cache.pyi", "plain_cache.pyi", "statistic_cache.pyi"]
"memoization.caching.general" = ["keys_order_dependent.pyi", "keys_order_independent.pyi", "values_with_ttl.pyi", "values_without_ttl.pyi"]
"memoization.config" = ["algorithm_mapping.pyi"]
"memoization.constant" = ["flag.pyi"]
"memoization.type" = ["model.pyi"]
"memoization.type.caching" = ["cache.pyi"]
"memoization.type.caching.general" = ["keys.pyi"]

[tool.setuptools.exclude-package-data]
"*" = ["examples.py", "test.py"]
