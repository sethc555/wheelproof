[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-mgmt-iothubprovisioningservices"
version = "1.1.0"
description = "Microsoft Azure IoT Hub Provisioning Services Client Library for Python"
readme = {text = "# Microsoft Azure SDK for Python\n\nThis is the Microsoft Azure IoT Hub Provisioning Services Client Library.\nThis package has been tested with Python 2.7, 3.6+.\nFor a more complete view of Azure libraries, see the [azure sdk python release](https://aka.ms/azsdk/python/all).\n\n\n## _Disclaimer_\n\n_Azure SDK Python packages support for Python 2.7 has ended 01 January 2022. For more information and questions, please refer to https://github.com/Azure/azure-sdk-for-python/issues/20691_\n\n# Usage\n\n\nTo learn how to use this package, see the [quickstart guide](https://aka.ms/azsdk/python/mgmt)\n\n\n \nFor docs and references, see [Python SDK References](https://docs.microsoft.com/python/api/overview/azure/iot)\nCode samples for this package can be found at [IoT Hub Provisioning Services](https://docs.microsoft.com/samples/browse/?languages=python&term=Getting%20started%20-%20Managing&terms=Getting%20started%20-%20Managing) on docs.microsoft.com.\nAdditional code samples for different Azure services are available at [Samples Repo](https://aka.ms/azsdk/python/mgmt/samples)\n\n\n# Provide Feedback\n\nIf you encounter any bugs or have suggestions, please file an issue in the\n[Issues](https://github.com/Azure/azure-sdk-for-python/issues)\nsection of the project. \n\n\n![Impressions](https://azure-sdk-impressions.azurewebsites.net/api/impressions/azure-sdk-for-python%2Fazure-mgmt-iothubprovisioningservices%2FREADME.png)\n\n\n# Release History\n\n## 1.1.0 (2022-02-07)\n\n**Features**\n\n  - Model CertificateResponse has a new parameter system_data\n  - Model IotDpsPropertiesDescription has a new parameter enable_data_residency\n  - Model PrivateEndpointConnection has a new parameter system_data\n  - Model ProvisioningServiceDescription has a new parameter system_data\n\n## 1.0.0 (2021-08-18)\n\n**Features**\n\n  - Model CertificateBodyDescription has a new parameter is_verified\n\n## 1.0.0b1 (2021-05-14)\n\nThis is beta preview version.\n\nThis version uses a next-generation code generator that introduces important breaking changes, but also important new features (like unified authentication and async programming).\n\n**General breaking changes**\n\n- Credential system has been completly revamped:\n\n  - `azure.common.credentials` or `msrestazure.azure_active_directory` instances are no longer supported, use the `azure-identity` classes instead: https://pypi.org/project/azure-identity/\n  - `credentials` parameter has been renamed `credential`\n\n- The `config` attribute no longer exists on a client, configuration should be passed as kwarg. Example: `MyClient(credential, subscription_id, enable_logging=True)`. For a complete set of\n  supported options, see the [parameters accept in init documentation of azure-core](https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/core/azure-core/CLIENT_LIBRARY_DEVELOPER.md#available-policies)\n- You can't import a `version` module anymore, use `__version__` instead\n- Operations that used to return a `msrest.polling.LROPoller` now returns a `azure.core.polling.LROPoller` and are prefixed with `begin_`.\n- Exceptions tree have been simplified and most exceptions are now `azure.core.exceptions.HttpResponseError` (`CloudError` has been removed).\n- Most of the operation kwarg have changed. Some of the most noticeable:\n\n  - `raw` has been removed. Equivalent feature can be found using `cls`, a callback that will give access to internal HTTP response for advanced user\n  - For a complete set of\n  supported options, see the [parameters accept in Request documentation of azure-core](https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/core/azure-core/CLIENT_LIBRARY_DEVELOPER.md#available-policies)\n\n**General new features**\n\n- Type annotations support using `typing`. SDKs are mypy ready.\n- This client has now stable and official support for async. Check the `aio` namespace of your package to find the async client.\n- This client now support natively tracing library like OpenCensus or OpenTelemetry. See this [tracing quickstart](https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/core/azure-core-tracing-opentelemetry) for an overview.\n\n\n## 0.2.0 (2018-04-17)\n\n**General Breaking changes**\n\nThis version uses a next-generation code generator that *might*\nintroduce breaking changes.\n\n  - Model signatures now use only keyword-argument syntax. All\n    positional arguments must be re-written as keyword-arguments. To\n    keep auto-completion in most cases, models are now generated for\n    Python 2 and Python 3. Python 3 uses the \"*\" syntax for\n    keyword-only arguments.\n  - Enum types now use the \"str\" mixin (class AzureEnum(str, Enum)) to\n    improve the behavior when unrecognized enum values are encountered.\n    While this is not a breaking change, the distinctions are important,\n    and are documented here:\n    <https://docs.python.org/3/library/enum.html#others> At a glance:\n      - \"is\" should not be used at all.\n      - \"format\" will return the string value, where \"%s\" string\n        formatting will return `NameOfEnum.stringvalue`. Format syntax\n        should be prefered.\n  - New Long Running Operation:\n      - Return type changes from\n        `msrestazure.azure_operation.AzureOperationPoller` to\n        `msrest.polling.LROPoller`. External API is the same.\n      - Return type is now **always** a `msrest.polling.LROPoller`,\n        regardless of the optional parameters used.\n      - The behavior has changed when using `raw=True`. Instead of\n        returning the initial call result as `ClientRawResponse`,\n        without polling, now this returns an LROPoller. After polling,\n        the final resource will be returned as a `ClientRawResponse`.\n      - New `polling` parameter. The default behavior is\n        `Polling=True` which will poll using ARM algorithm. When\n        `Polling=False`, the response of the initial call will be\n        returned without polling.\n      - `polling` parameter accepts instances of subclasses of\n        `msrest.polling.PollingMethod`.\n      - `add_done_callback` will no longer raise if called after\n        polling is finished, but will instead execute the callback right\n        away.\n\n**Bugfixes**\n\n  - Compatibility of the sdist with wheel 0.31.0\n\n**Features**\n\n  - New ApiVersion 2018-01-22\n\n## 0.1.0 (2018-01-04)\n\n  - Initial Release\n", content-type = "text/markdown"}
license = {text = "MIT License"}
authors = [
    {name = "Microsoft Corporation"},
    {email = "azpysdkhelp@microsoft.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.6"
dependencies = [
    "msrest>=0.6.21",
    "azure-common~=1.1",
    "azure-mgmt-core>=1.3.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/Azure/azure-sdk-for-python"

[tool.setuptools]
packages = [
    "azure.mgmt.iothubprovisioningservices",
    "azure.mgmt.iothubprovisioningservices.models",
    "azure.mgmt.iothubprovisioningservices.aio",
    "azure.mgmt.iothubprovisioningservices.operations",
    "azure.mgmt.iothubprovisioningservices.aio.operations",
]
include-package-data = false
