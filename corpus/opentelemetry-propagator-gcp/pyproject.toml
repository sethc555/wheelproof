[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-propagator-gcp"
description = "Google Cloud propagator for OpenTelemetry"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",]
version = "1.12.0"
requires-python = ">=3.9"
dependencies = [ "opentelemetry-api ~= 1.0",]

[[project.authors]]
name = "Google"
email = "opentelemetry-pypi@google.com"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/opentelemetry-operations-python/tree/main/opentelemetry-propagator-gcp"

[project.optional-dependencies]
test = []

[tool.setuptools]
platforms = [ "any",]
include-package-data = false

[project.entry-points.opentelemetry_propagator]
gcp_trace = "opentelemetry.propagators.cloud_trace_propagator:CloudTraceFormatPropagator"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
opentelemetry = [ "py.typed",]

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = true
