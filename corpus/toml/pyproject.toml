[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "toml"
version = "0.10.2"
description = "Python Library for Tom's Obvious, Minimal Language"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=2.6, !=3.0.*, !=3.1.*, !=3.2.*"

[[project.authors]]
name = "William Pearson"
email = "uiri@xqz.ca"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/uiri/toml"

[tool.setuptools]
packages = [ "toml",]
license-files = [ "LICENSE",]
include-package-data = false
