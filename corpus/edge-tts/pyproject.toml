[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "edge-tts"
description = "Microsoft Edge's TTS"
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)", "Operating System :: OS Independent",]
requires-python = ">=3.7"
dependencies = [ "aiohttp>=3.8.0,<4.0.0", "certifi>=2023.11.17", "tabulate>=0.4.4,<1.0.0", "typing-extensions>=4.1.0,<5.0.0",]
dynamic = [ "version",]

[[project.authors]]
name = "rany"
email = "ranygh@riseup.net"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/rany2/edge-tts"
"Bug Tracker" = "https://github.com/rany2/edge-tts/issues"

[project.optional-dependencies]
dev = [ "black", "isort", "mypy", "pylint", "types-tabulate",]

[project.scripts]
edge-tts = "edge_tts.__main__:main"
edge-playback = "edge_playback.__main__:_main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "edge_tts.version.__version__"
