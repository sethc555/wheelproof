[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pygsheets"
version = "2.0.6"
description = "Google Spreadsheets Python API v4"
keywords = [ "spreadsheets", "google-spreadsheets", "pygsheets",]
classifiers = [ "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Intended Audience :: End Users/Desktop", "Intended Audience :: Science/Research", "Topic :: Office/Business :: Financial :: Spreadsheet", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"
dependencies = [ "google-api-python-client>=2.50.0", "google-auth-oauthlib>=0.7.1", "enum34 >= 1.1.6;python_version<\"3.4\"",]
[[project.authors]]
name = "Nithin Murali"
email = "imnmfotmal@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/nithinmurali/pygsheets"
Download = "https://github.com/nithinmurali/pygsheets/tarball/2.0.6"

[project.optional-dependencies]
pandas = [ "pandas>=0.14.0",]

[tool.setuptools]
packages = [ "pygsheets",]
include-package-data = true

[tool.setuptools.package-data]
data = [ "data/drive_discovery.json", "data/sheets_discovery.json",]
