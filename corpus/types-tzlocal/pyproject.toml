[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-tzlocal"
version = "5.1.0.1"
description = "Typing stubs for tzlocal"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
requires-python = ">=3.7"
dependencies = [ "types-pytz",]

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for tzlocal\n\nThis is a [PEP 561](https://peps.python.org/pep-0561/)\ntype stub package for the [`tzlocal`](https://github.com/regebro/tzlocal) package.\nIt can be used by type-checking tools like\n[mypy](https://github.com/python/mypy/),\n[pyright](https://github.com/microsoft/pyright),\n[pytype](https://github.com/google/pytype/),\nPyCharm, etc. to check code that uses\n`tzlocal`.\n\nThis version of `types-tzlocal` aims to provide accurate annotations\nfor `tzlocal==5.1`.\nThe source for this package can be found at\nhttps://github.com/python/typeshed/tree/main/stubs/tzlocal. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `tzlocal` package includes type annotations or type stubs\nsince version 5.2. Please uninstall the `types-tzlocal`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/main/README.md for more details.\nThis package was generated from typeshed commit `40caa050ce66a8dd62a62c4b4631767c4092d998` and was tested\nwith mypy 1.6.1, pyright 1.1.332, and\npytype 2023.10.17."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/tzlocal.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "tzlocal-stubs",]
include-package-data = false

[tool.setuptools.package-data]
tzlocal-stubs = [ "__init__.pyi", "utils.pyi", "windows_tz.pyi", "METADATA.toml",]
