[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "atomicwrites"
version = "1.4.1"
description = "Atomic file writes."
readme = "README.rst"
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: Implementation :: CPython",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"

[[project.authors]]
name = "Markus Unterwaditzer"
email = "markus@unterwaditzer.net"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/untitaker/python-atomicwrites"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "tests.*",]
namespaces = false
