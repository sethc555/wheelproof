[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-urllib3"
version = "1.26.25.14"
description = "Typing stubs for urllib3"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Stubs Only",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for urllib3\n\nThis is a PEP 561 type stub package for the `urllib3` package. It\ncan be used by type-checking tools like\n[mypy](https://github.com/python/mypy/),\n[pyright](https://github.com/microsoft/pyright),\n[pytype](https://github.com/google/pytype/),\nPyCharm, etc. to check code that uses\n`urllib3`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/main/stubs/urllib3. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `urllib3` package includes type annotations or type stubs\nsince version 2.0.0. Please uninstall the `types-urllib3`\npackage if you use this or a newer version.\n\n\nThis stub package is marked as [partial](https://peps.python.org/pep-0561/#partial-stub-packages).\nIf you find that annotations are missing, feel free to contribute and help complete them.\n\n\nSee https://github.com/python/typeshed/blob/main/README.md for more details.\nThis package was generated from typeshed commit `afe18e95a9592434e93b648de5194cfe54443f84` and was tested\nwith mypy 1.4.1, pyright 1.1.318, and\npytype 2023.6.16."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"
GitHub = "https://github.com/python/typeshed"
Changes = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/urllib3.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
Chat = "https://gitter.im/python/typing"

[tool.setuptools]
packages = [ "urllib3-stubs",]
include-package-data = false

[tool.setuptools.package-data]
urllib3-stubs = [ "__init__.pyi", "_collections.pyi", "connection.pyi", "connectionpool.pyi", "contrib/__init__.pyi", "contrib/socks.pyi", "exceptions.pyi", "fields.pyi", "filepost.pyi", "packages/__init__.pyi", "poolmanager.pyi", "request.pyi", "response.pyi", "util/__init__.pyi", "util/connection.pyi", "util/queue.pyi", "util/request.pyi", "util/response.pyi", "util/retry.pyi", "util/ssl_.pyi", "util/ssl_match_hostname.pyi", "util/timeout.pyi", "util/url.pyi", "METADATA.toml", "py.typed",]
