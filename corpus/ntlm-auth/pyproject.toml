[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ntlm-auth"
version = "1.5.0"
description = "Creates NTLM authentication structures"
license = {text = "MIT"}
authors = [
    {name = "Jordan Borean", email = "jborean93@gmail.com"},
]
keywords = ["authentication auth microsoft ntlm lm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]
requires-python = ">=2.6,!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*"
dependencies = [
    "ordereddict; python_version<\"2.7\"",
]

[project.urls]
Homepage = "https://github.com/jborean93/ntlm-auth"

[project.optional-dependencies]
cryptography = [
    "cryptography<2.2; python_version<\"2.7\"",
    "cryptography; python_version>=\"2.7\"",
]

[tool.distutils.bdist_wheel]
universal = true

[tool.setuptools]
include-package-data = false
packages = ["ntlm_auth"]
