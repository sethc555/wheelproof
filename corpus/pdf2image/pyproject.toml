[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2image"
version = "1.17.0"
description = "A wrapper around the pdftoppm and pdftocairo command line tools to convert PDF to a PIL Image list."
keywords = [ "pdf", "image", "png", "jpeg", "jpg", "convert",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10",]
dependencies = [ "pillow",]
[[project.authors]]
name = "Edouard Belval"
email = "edouard@belval.org"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Belval/pdf2image"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pdf2image = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "contrib", "docs", "tests",]
namespaces = false
