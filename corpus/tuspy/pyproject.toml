[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "tuspy"
version = "1.1.0"
description = "A Python client for the tus resumable upload protocol ->  http://tus.io"
classifiers = [ "Programming Language :: Python", "Natural Language :: English", "Environment :: Web Environment", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Internet :: File Transfer Protocol (FTP)", "Topic :: Communications :: File Sharing",]
requires-python = ">=3.5.3"
dependencies = [ "requests>=2.18.4", "tinydb>=3.5.0", "aiohttp>=3.6.2",]

[[project.authors]]
name = "Ifedapo Olarewaju"
email = "ifedapoolarewaju@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "http://github.com/tus/tus-py-client/"

[project.optional-dependencies]
test = [ "responses>=0.5.1", "aioresponses>=0.6.2", "coverage>=4.2", "pytest>=3.0.3", "pytest-cov>=2.3.1,<2.6", "parametrize>=0.1.1",]
dev = [ "tox>=2.3.1", "sphinx-autobuild==2021.3.14", "Sphinx==1.7.1",]

[tool.setuptools]
packages = [ "tusclient", "tusclient.fingerprint", "tusclient.storage", "tusclient.uploader",]
include-package-data = true
platforms = [ "any",]
