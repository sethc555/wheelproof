[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "firebase_admin"
version = "7.4.0"
description = "Firebase Admin Python SDK"
keywords = [ "firebase", "cloud", "development",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Topic :: Software Development :: Build Tools", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "License :: OSI Approved :: Apache Software License",]
requires-python = ">=3.9"
dependencies = [ "cachecontrol>=0.14.3", "google-api-core[grpc] >= 2.25.1, < 3.0.0dev; platform.python_implementation != \"PyPy\"", "google-cloud-firestore>=2.21.0; platform.python_implementation != \"PyPy\"", "google-cloud-storage>=3.1.1", "pyjwt[crypto] >= 2.10.1", "httpx[http2] == 0.28.1",]
[[project.authors]]
name = "Firebase"

[project.license]
text = "Apache License 2.0"

[project.readme]
text = "The Firebase Admin Python SDK enables server-side (backend) Python developers to integrate Firebase into their services and applications."
content-type = "text/plain"

[project.urls]
Homepage = "https://firebase.google.com/docs/admin/setup/"
"Release Notes" = "https://firebase.google.com/support/release-notes/admin/python"
Source = "https://github.com/firebase/firebase-admin-python"

[tool.setuptools]
packages = [ "firebase_admin",]
include-package-data = false
