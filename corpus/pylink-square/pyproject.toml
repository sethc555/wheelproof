[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pylink-square"
version = "2.0.1"
description = "Python interface for SEGGER J-Link."
keywords = [ "SEGGER", "J-Link",]
readme = "README.md"
requires-python = ">=3.0"
dependencies = [ "psutil >= 5.2.2", "six",]
[[project.authors]]
name = "Square Embedded Software Team"
email = "esw-team@squareup.com"

[project.license]
text = "Apache 2.0"

[project.urls]
Homepage = "http://www.github.com/Square/pylink"

[project.optional-dependencies]
dev = [ "behave==1.2.5", "coverage==4.4.1", "psutil>=5.2.2", "pycodestyle>=2.3.1", "setuptools>=70.2.0", "six", "sphinx==1.4.8", "sphinx-argparse==0.1.15", "sphinx_rtd_theme==0.2.4", "sphinxcontrib-napoleon==0.5.3", "wheel",]
test = [ "mock==2.0.0",]
testing = [ "mock == 2.0.0",]

[project.scripts]
pylink = "pylink.__main__:main"

[tool.setuptools]
packages = [ "pylink", "pylink.protocols", "pylink.unlockers",]
script-files = [ "examples/pylink-rtt", "examples/pylink-swv",]
include-package-data = false

[tool.setuptools.package-data]
pylink = []
