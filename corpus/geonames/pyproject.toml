[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geonames"
version = "0.1.3"
description = "Geonames data parser into Shapefile/KML"
readme = "README.rst"
authors = [
  {name = "Denis Carriere", email = "carriere.denis@gmail.com"},
]
keywords = ["geonames parser shapefile kml data"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 2.6",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3.2",
  "Programming Language :: Python :: 3.3",
  "Topic :: Internet",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["unicodecsv>=0.9.4"]

[project.urls]
Homepage = "http://addxy.com"
Download = "https://github.com/DenisCarriere/geonames"

[project.scripts]
geonames = "geonames.cli:cli"

[tool.setuptools]
include-package-data = true
packages = ["geonames"]

[tool.setuptools.package-data]
"*" = ["LICENSE", "README.md"]

[tool.distutils.bdist_wheel]
universal = true
