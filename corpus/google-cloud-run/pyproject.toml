[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-run"
version = "0.16.0"
description = "Google Cloud Run API client library"
readme = {file = "README.rst", content-type = ""}
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
    "grpc-google-iam-v1 >= 0.14.0, <1.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-run"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud.run",
    "google.cloud.run_v2",
    "google.cloud.run_v2.services",
    "google.cloud.run_v2.services.builds",
    "google.cloud.run_v2.services.builds.transports",
    "google.cloud.run_v2.services.executions",
    "google.cloud.run_v2.services.executions.transports",
    "google.cloud.run_v2.services.instances",
    "google.cloud.run_v2.services.instances.transports",
    "google.cloud.run_v2.services.jobs",
    "google.cloud.run_v2.services.jobs.transports",
    "google.cloud.run_v2.services.revisions",
    "google.cloud.run_v2.services.revisions.transports",
    "google.cloud.run_v2.services.services",
    "google.cloud.run_v2.services.services.transports",
    "google.cloud.run_v2.services.tasks",
    "google.cloud.run_v2.services.tasks.transports",
    "google.cloud.run_v2.services.worker_pools",
    "google.cloud.run_v2.services.worker_pools.transports",
    "google.cloud.run_v2.types",
]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
