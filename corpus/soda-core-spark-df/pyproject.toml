[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soda-core-spark-df"
version = "3.5.6"
dependencies = [
    "soda-core-spark==3.5.6",
    "pyspark>=3.4.0,<4.0.0",
]

[tool.setuptools]
include-package-data = false
packages = [
    "soda",
    "soda.data_sources",
]
