[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ldap3"
version = "2.9.1"
description = "A strictly RFC 4510 conforming LDAP V3 pure Python client library"
keywords = [ "python3", "python2", "ldap",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "Operating System :: MacOS :: MacOS X", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",]
dependencies = [ "pyasn1>=0.4.6",]

[[project.authors]]
name = "Giovanni Cannata"
email = "cannatag@gmail.com"

[project.license]
text = "LGPL v3"

[project.urls]
Homepage = "https://github.com/cannatag/ldap3"

[tool.setuptools]
packages = [ "ldap3", "ldap3.abstract", "ldap3.core", "ldap3.operation", "ldap3.protocol", "ldap3.protocol.sasl", "ldap3.protocol.schemas", "ldap3.protocol.formatters", "ldap3.strategy", "ldap3.utils", "ldap3.extend", "ldap3.extend.novell", "ldap3.extend.microsoft", "ldap3.extend.standard",]
include-package-data = false

[tool.setuptools.package-dir]
"" = "."
