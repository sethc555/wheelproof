[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "textparser"
version = "0.24.0"
description = "Text parser."
keywords = [ "parser", "parsing",]
readme = "README.rst"
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3",]
[[project.authors]]
name = "Erik Moqvist"
email = "erik.moqvist@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/eerimoq/textparser"

[tool.setuptools]
py-modules = [ "textparser",]
include-package-data = false
