[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "liccheck"
version = "0.9.2"
description = "Check python packages from requirement.txt and report issues"
keywords = [ "license", "check", "build", "tool",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Topic :: Software Development :: Build Tools", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8",]
requires-python = ">=3.5"
dependencies = [ "semantic_version>=2.7.0", "toml",]

[[project.authors]]
name = "Dhatim"
email = "contact@dhatim.com"

[project.license]
text = "Apache Software License"

[project.urls]
Homepage = "https://github.com/dhatim/python-license-check"

[project.scripts]
liccheck = "liccheck.command_line:main"

[tool.setuptools]
packages = [ "liccheck",]
include-package-data = false
