[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "looker_sdk"
version = "26.10.0"
description = "Looker REST API"
keywords = [ "Looker", "Looker API", "looker_sdk", "Looker API 4.0",]
requires-python = ">=3.6"
dependencies = [ "requests >= 2.22", "typing-extensions >= 4.1.1", "attrs >= 20.1.0;python_version>='3.7'", "cattrs >= 1.3;python_version>='3.7'",]

[[project.authors]]
name = "Looker Data Sciences"

[[project.authors]]
name = "Inc."

[project.license]
text = "MIT"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://pypi.python.org/pypi/looker_sdk"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
looker_sdk = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
