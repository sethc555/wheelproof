[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-synapse-managedprivateendpoints"
version = "0.4.0"
description = "Microsoft Azure Synapse Managed Private Endpoints Client Library for Python"
readme = {text = "# Microsoft Azure SDK for Python\n\nThis is the Microsoft Azure Synapse Managed Private Endpoints Client Library.\nThis package has been tested with Python 2.7, 3.6, 3.7, 3.8 and 3.9.\nFor a more complete view of Azure libraries, see the [azure sdk python release](https://aka.ms/azsdk/python/all).\n\n\n# Usage\n\n\n\n\nFor code examples, see [Synapse Managed Private Endpoints](https://docs.microsoft.com/python/api/overview/azure/) on docs.microsoft.com.\n\n\n# Provide Feedback\n\nIf you encounter any bugs or have suggestions, please file an issue in the\n[Issues](https://github.com/Azure/azure-sdk-for-python/issues)\nsection of the project.\n\n\n![Impressions](https://azure-sdk-impressions.azurewebsites.net/api/impressions/azure-sdk-for-python%2Fazure-synapse-managedprivateendpoints%2FREADME.png)\n\n\n# Release History\n\n## 0.4.0 (2021-08-10)\n\n- Updated API version to \"2020-12-01\" which is the default API version\n- Added API version \"2021-06-01-preview\" support\n- `ManagedPrivateEndpointsClient` is renamed to `VnetClient`\n\n## 0.3.0 (2021-03-09)\n\n- Internal bugfixes (re-generated with latest generator)\n- Stop Python 3.5 support\n\n## 0.2.0 (2021-02-09)\n\n- Internal bugfixes (re-generated with latest generator)\n\n## 0.1.0 (2020-12-08)\n\n- Initial Release\n", content-type = "text/markdown"}
license = {text = "MIT License"}
authors = [
    {name = "Microsoft Corporation"},
    {email = "azpysdkhelp@microsoft.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "msrest>=0.5.0",
    "azure-common~=1.1",
    "azure-core>=1.6.0,<2.0.0",
    "azure-synapse-nspkg; python_version<'3.0'",
]

[project.urls]
Homepage = "https://github.com/Azure/azure-sdk-for-python"

[tool.setuptools]
include-package-data = true
packages = [
    "azure.synapse.managedprivateendpoints",
    "azure.synapse.managedprivateendpoints.aio",
    "azure.synapse.managedprivateendpoints.v2020_12_01",
    "azure.synapse.managedprivateendpoints.v2020_12_01.aio",
    "azure.synapse.managedprivateendpoints.v2020_12_01.aio.operations",
    "azure.synapse.managedprivateendpoints.v2020_12_01.models",
    "azure.synapse.managedprivateendpoints.v2020_12_01.operations",
    "azure.synapse.managedprivateendpoints.v2021_06_01_preview",
    "azure.synapse.managedprivateendpoints.v2021_06_01_preview.aio",
    "azure.synapse.managedprivateendpoints.v2021_06_01_preview.aio.operations",
    "azure.synapse.managedprivateendpoints.v2021_06_01_preview.models",
    "azure.synapse.managedprivateendpoints.v2021_06_01_preview.operations",
]

[tool.distutils.bdist_wheel]
universal = true
