[build-system]
requires = [ "setuptools>=61.2", "pytest-runner",]
build-backend = "setuptools.build_meta"

[project]
name = "rfc3986_validator"
version = "0.1.1"
description = "Pure python rfc3986 validator"
keywords = [ "rfc3986", "validator",]
classifiers = [ "Development Status :: 2 - Pre-Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
dependencies = []
[[project.authors]]
name = "Nicolas Aimetti"
email = "naimetti@yahoo.com.ar"

[project.license]
text = "MIT license"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/naimetti/rfc3986-validator"

[project.optional-dependencies]
testing = [ "pytest>=3",]

[tool.setuptools]
py-modules = [ "rfc3986_validator",]
zip-safe = false
include-package-data = true
