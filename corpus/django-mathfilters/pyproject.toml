[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-mathfilters"
version = "1.0.0"
description = "A set of simple math filters for Django"
keywords = [ "django", "template", "filters", "math",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Framework :: Django", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Internet :: WWW/HTTP", "Topic :: Software Development :: Libraries :: Python Modules",]

[[project.authors]]
name = "Danilo Bargen"
email = "mail@dbrgn.ch"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/dbrgn/django-mathfilters"

[tool.setuptools]
packages = [ "mathfilters", "mathfilters.templatetags",]
platforms = [ "any",]
include-package-data = false

[tool.setuptools.package-dir]
mathfilters = "mathfilters"
