[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes"
version = "36.0.2"
description = "Kubernetes python client"
keywords = [ "Swagger", "OpenAPI", "Kubernetes",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Topic :: Utilities", "Intended Audience :: Developers", "Intended Audience :: Information Technology", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",]
requires-python = ">=3.10"
dependencies = [ "certifi>=14.05.14", "six>=1.9.0", "python-dateutil>=2.5.3", "pyyaml>=6.0.3", "websocket-client>=0.32.0,!=0.40.0,!=0.41.*,!=0.42.*", "requests", "requests-oauthlib", "urllib3>=1.24.2,!=2.6.0", "durationpy>=0.7",]
[[project.authors]]
name = "Kubernetes"

[project.license]
text = "Apache License Version 2.0"

[project.readme]
text = "Python client for kubernetes http://kubernetes.io/"
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/kubernetes-client/python"

[project.optional-dependencies]
google-auth = [ "google-auth>=1.0.1",]
testing = [ "coverage>=4.0.3", "nose>=1.3.7", "pytest", "pytest-cov", "pluggy>=1.6.0", "randomize>=0.13", "sphinx>=8.1.3", "sphinx_markdown_tables", "pycodestyle", "autopep8", "isort",]

[tool.setuptools]
packages = [ "kubernetes", "kubernetes.client", "kubernetes.config", "kubernetes.watch", "kubernetes.client.api", "kubernetes.stream", "kubernetes.client.models", "kubernetes.utils", "kubernetes.client.apis", "kubernetes.dynamic", "kubernetes.leaderelection", "kubernetes.leaderelection.resourcelock", "kubernetes.informer",]
include-package-data = true
