[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "sshpubkeys"
version = "3.3.1"
description = "SSH public key parser"
keywords = [ "ssh", "pubkey", "public", "key", "openssh", "ssh-rsa", "ssh-dss", "ssh-ed25519",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "Topic :: Security", "License :: OSI Approved :: BSD License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=3"
dependencies = [ "cryptography>=2.1.4", "ecdsa>=0.13",]
[[project.authors]]
name = "Olli Jarva"
email = "olli@jarva.fi"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/ojarva/python-sshpubkeys"

[project.optional-dependencies]
dev = [ "twine", "wheel", "yapf",]

[tool.setuptools]
packages = [ "sshpubkeys",]
include-package-data = false
