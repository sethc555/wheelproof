[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pyxdg"
version = "0.28"
description = "PyXDG contains implementations of freedesktop.org standards in python."
classifiers = [ "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Topic :: Desktop Environment",]

[[project.maintainers]]
name = "Freedesktop.org"
email = "xdg@lists.freedesktop.org"

[project.urls]
Homepage = "http://freedesktop.org/wiki/Software/pyxdg"

[tool.setuptools]
packages = [ "xdg",]
include-package-data = false
