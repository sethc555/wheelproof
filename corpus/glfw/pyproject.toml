[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "glfw"
version = "2.10.0"
description = "A ctypes-based wrapper for GLFW3."
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: MacOS X", "Environment :: X11 Applications", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics", "Topic :: Scientific/Engineering :: Visualization",]

[[project.authors]]
name = "Florian Rhiem"
email = "florian.rhiem@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/FlorianRhiem/pyGLFW"

[project.optional-dependencies]
preview = [ "glfw_preview",]

[tool.setuptools]
packages = [ "glfw",]
include-package-data = false

[tool.setuptools.package-data]
glfw = [ "glfw3.dll", "libglfw.3.dylib", "wayland/libglfw.so", "x11/libglfw.so", "libglfw.so", "msvcr120.dll",]
