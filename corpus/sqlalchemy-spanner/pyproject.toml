[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-spanner"
version = "1.19.0"
description = "SQLAlchemy dialect integrated into Cloud Spanner database"
readme = "README.rst"
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=1.1.13",
    "google-cloud-spanner>=3.55.0",
    "alembic",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api >= 1.1.0",
    "opentelemetry-sdk >= 1.1.0",
    "opentelemetry-instrumentation >= 0.20b0",
]

[project.urls]
"Homepage" = "https://github.com/cloudspannerecosystem/python-spanner-sqlalchemy"

[project.entry-points."sqlalchemy.dialects"]
"spanner.spanner" = "google.cloud.sqlalchemy_spanner:SpannerDialect"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud.sqlalchemy_spanner",
]
include-package-data = true
