[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "nameparser"
version = "1.1.3"
description = "A simple Python module for parsing human names into their individual components."
keywords = [ "names", "parser",]
classifiers = [ "Intended Audience :: Developers", "Operating System :: OS Independent", "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Development Status :: 5 - Production/Stable", "Natural Language :: English", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Linguistic",]

[[project.authors]]
name = "Derek Gulbranson"
email = "derek73@gmail.com"

[project.license]
text = "LGPL"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/derek73/python-nameparser"

[tool.setuptools]
packages = [ "nameparser", "nameparser.config",]
include-package-data = false
