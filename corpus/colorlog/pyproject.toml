[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colorlog"
version = "6.10.1"
description = "Add colours to the output of Python's logging module."
requires-python = ">=3.6"
dependencies = ["colorama; sys_platform==\"win32\""]
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Terminals", "Topic :: Utilities"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[[project.authors]]
name = "Sam Clements"
email = "sam@borntyping.co.uk"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "https://github.com/borntyping/python-colorlog"

[project.optional-dependencies]
development = ["black", "flake8", "mypy", "pytest", "types-colorama"]

[tool.setuptools]
packages = ["colorlog"]
include-package-data = false

[tool.setuptools.package-data]
colorlog = ["py.typed"]
