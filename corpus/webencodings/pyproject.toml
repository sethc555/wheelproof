[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "webencodings"
version = "0.5.1"
description = "Character encoding aliases for legacy web content"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Internet :: WWW/HTTP",]

[[project.authors]]
name = "Simon Sapin"
email = "simon.sapin@exyr.org"

[[project.maintainers]]
name = "Geoffrey Sneddon"
email = "me@gsnedders.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/SimonSapin/python-webencodings"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false
