[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pywin32-ctypes"
description = "A (partial) reimplementation of pywin32 using ctypes/cffi"
classifiers = [ "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",]
dynamic = [ "readme", "version",]
requires-python = ">=3.6"

[[project.authors]]
name = "Enthought Inc."
email = "info@enthough.com"

[project.license]
text = "BSD-3-Clause"

[project.urls]
Homepage = "https://github.com/enthought/pywin32-ctypes"

[tool.setuptools]
zip-safe = false
license-files = [ "file: LICENSE.txt",]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "docs*",]
namespaces = false

[tool.setuptools.dynamic.readme]
file = [ "README.rst", "CHANGELOG.txt",]

[tool.setuptools.dynamic.version]
file = [ "VERSION",]
