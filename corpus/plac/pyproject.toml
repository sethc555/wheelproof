[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "plac"
version = "1.4.5"
description = "The smartest command line arguments parser in the world"
keywords = [ "command", "line", "arguments", "parser",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries", "Topic :: Utilities",]
dependencies = []

[[project.authors]]
name = "Michele Simionato"
email = "michele.simionato@gmail.com"

[project.license]
text = "BSD License"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/ialbert/plac"

[tool.setuptools]
py-modules = [ "plac_core", "plac_ext", "plac_tk", "plac",]
zip-safe = false
script-files = [ "plac_runner.py",]
platforms = [ "All",]
include-package-data = false
