[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pybind11-stubgen"
version = "2.5.5"
description = "PEP 561 type stubs generator for pybind11 modules"
requires-python = "~=3.7"

[[project.maintainers]]
name = "Sergei Izmailov"
email = "sergei.a.izmailov@gmail.com"

[project.license]
text = "BSD"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/sizmailov/pybind11-stubgen"

[project.scripts]
pybind11-stubgen = "pybind11_stubgen.__init__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pybind11_stubgen = [ "py.typed",]

[tool.setuptools.packages.find]
namespaces = false
