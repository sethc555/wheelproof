[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-inline-paginator"
version = "0.0"
description = "The \"Django Admin Inline Paginator\" is simple way to paginate your inline in django admin"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Framework :: Django", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Topic :: Internet :: WWW/HTTP", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=3.3"
dependencies = [ "django",]
[[project.authors]]
name = "Shinneider Libanio da Silva"
email = "shinneider-libanio@hotmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/shinneider/django-admin-inline-paginator"

[project.optional-dependencies]
dev = [ "django", "django_mock_queries", "pylint", "pytest-pylint", "pytest", "pytest-cov", "pytest-watch", "tox",]
code-quality = [ "isort", "bandit", "xenon",]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
