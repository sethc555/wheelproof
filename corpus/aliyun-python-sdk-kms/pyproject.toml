[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "aliyun-python-sdk-kms"
version = "2.16.5"
description = "The kms module of Aliyun Python sdk."
keywords = [ "aliyun", "sdk", "kms",]
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Software Development",]
dependencies = [ "aliyun-python-sdk-core>=2.11.5",]

[[project.authors]]
name = "Aliyun"
email = "aliyun-developers-efficiency@list.alibaba-inc.com"

[project.license]
text = "Apache"

[project.urls]
Homepage = "http://develop.aliyun.com/sdk/python"

[tool.setuptools]
include-package-data = true
platforms = [ "any",]
license-files = [ "LICENSE",]

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
