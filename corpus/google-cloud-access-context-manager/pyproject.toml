[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-access-context-manager"
version = "0.6.0"
description = "Google Cloud Access Context Manager Protobufs"
readme = "README.rst"
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.9"
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-access-context-manager"

[tool.setuptools]
platforms = ["Posix; MacOS X; Windows"]
packages = [
    "docs",
    "google",
    "google.identity",
    "google.identity.accesscontextmanager",
    "google.identity.accesscontextmanager.v1",
    "google.identity.accesscontextmanager.type",
]
include-package-data = true
