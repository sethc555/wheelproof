[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-workflows"
version = "1.22.0"
description = "Google Cloud Workflows API client library"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC", email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
"Homepage" = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-workflows"

[tool.setuptools]
packages = [
    "google",
    "google.cloud",
    "google.cloud.workflows_v1",
    "google.cloud.workflows_v1beta",
    "google.cloud.workflows",
    "google.cloud.workflows_v1.services",
    "google.cloud.workflows_v1.types",
    "google.cloud.workflows_v1.services.workflows",
    "google.cloud.workflows_v1.services.workflows.transports",
    "google.cloud.workflows_v1beta.services",
    "google.cloud.workflows_v1beta.types",
    "google.cloud.workflows_v1beta.services.workflows",
    "google.cloud.workflows_v1beta.services.workflows.transports",
    "google.cloud.workflows.executions",
    "google.cloud.workflows.executions_v1beta",
    "google.cloud.workflows.executions_v1",
    "google.cloud.workflows.executions_v1beta.services",
    "google.cloud.workflows.executions_v1beta.types",
    "google.cloud.workflows.executions_v1beta.services.executions",
    "google.cloud.workflows.executions_v1beta.services.executions.transports",
    "google.cloud.workflows.executions_v1.services",
    "google.cloud.workflows.executions_v1.types",
    "google.cloud.workflows.executions_v1.services.executions",
    "google.cloud.workflows.executions_v1.services.executions.transports",
]
platforms = [
    "Posix; MacOS X; Windows",
]
include-package-data = true
