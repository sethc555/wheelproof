[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "braintree"
version = "4.44.0"
description = "Braintree Python Library"
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
dependencies = [ "requests>=0.11.1,<3.0",]
[[project.authors]]
name = "Braintree"
email = "support@braintreepayments.com"

[project.license]
text = "MIT"

[project.readme]
text = "The Braintree Python SDK provides integration access to the Braintree Gateway.\n\n1. https://github.com/braintree/braintree_python - README and Samples\n2. https://developer.paypal.com/braintree/docs/reference/overview - API Reference"
content-type = "text/plain"

[project.urls]
Homepage = "https://developer.paypal.com/braintree/docs/reference/overview"

[tool.setuptools]
packages = [ "braintree", "braintree.dispute_details", "braintree.exceptions", "braintree.graphql", "braintree.graphql.enums", "braintree.graphql.inputs", "braintree.graphql.types", "braintree.graphql.unions", "braintree.exceptions.http", "braintree.merchant_account", "braintree.util", "braintree.test",]
zip-safe = false
include-package-data = false

[tool.setuptools.package-data]
braintree = [ "ssl/*",]
