[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pyupgrade"
version = "3.21.2"
description = "A tool to automatically upgrade syntax for newer versions."
classifiers = [ "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=3.10"
dependencies = [ "tokenize-rt>=6.1.0",]

[[project.authors]]
name = "Anthony Sottile"
email = "asottile@umich.edu"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/asottile/pyupgrade"

[project.scripts]
pyupgrade = "pyupgrade._main:main"

[tool.setuptools]
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests*", "testing*",]
namespaces = false
