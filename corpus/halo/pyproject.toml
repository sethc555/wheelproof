[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.0.31"
description = "Beautiful terminal spinners in Python"
keywords = [ "console", "loading", "indicator", "progress", "cli", "spinner", "spinners", "terminal", "term", "busy", "wait", "idle",]
classifiers = [ "Programming Language :: Python", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3 :: Only",]
requires-python = ">=3.4"
dependencies = [ "backports.shutil_get_terminal_size>=1.0.0;python_version < '3.3'", "log_symbols>=0.0.14", "spinners>=0.0.24", "termcolor>=1.1.0", "colorama>=0.3.9", "six>=1.12.0",]
[[project.authors]]
name = "Manraj Singh"
email = "manrajsinghgrover@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/manrajgrover/halo"

[project.optional-dependencies]
ipython = [ "IPython==5.7.0", "ipywidgets==7.1.0",]
testing = [ "coverage>=4.4.1", "nose>=1.3.7", "pylint>=1.7.2", "tox>=2.8.2", "twine>=1.12.1",]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "tests", "examples",]
namespaces = false
