[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "github-action-utils"
version = "1.1.0"
description = "Collection of python functions that can be used to run GitHub Action Workflow Commands"
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: Implementation :: CPython",]
requires-python = ">=3.6.0"

[[project.authors]]
name = "Maksudul Haque"
email = "saad.mk112@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/saadmk11/github-action-utils"

[tool.setuptools]
py-modules = [ "github_action_utils",]
license-files = [ "LICENSE",]
include-package-data = false
