[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-transport"
version = "9.4.1"
description = "Transport classes and utilities shared among Python Elastic client libraries"
readme = "README.md"
authors = [
    {name = "Elastic Client Library Maintainers", email = "client-libs@elastic.co"},
]
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2, <3",
    "certifi",
    "sniffio",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
develop = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-httpbin",
    "pytest-httpserver",
    "trustme",
    "requests",
    "aiohttp",
    "httpx",
    "respx",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "orjson",
    "anyio",
    "trio",
    "sphinx>2",
    "furo",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/elastic/elastic-transport-python"
"Source Code" = "https://github.com/elastic/elastic-transport-python"
"Issue Tracker" = "https://github.com/elastic/elastic-transport-python/issues"
Documentation = "https://elastic-transport-python.readthedocs.io"

[tool.setuptools]
packages = ["elastic_transport", "elastic_transport._node"]
include-package-data = false

[tool.setuptools.package-data]
elastic_transport = ["py.typed"]
