[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-sftpserver"
version = "1.3.0"
description = "py.test plugin to locally test sftp server connections."
keywords = [ "py.test", "pytest", "plugin", "server", "local", "sftp", "localhost",]
readme = "README.rst"
classifiers = [ "Operating System :: OS Independent", "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Topic :: Software Development :: Testing",]
dependencies = [ "paramiko", "six",]

[[project.authors]]
name = "Ulrich Petri"
email = "mail@ulo.pe"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "http://github.com/ulope/pytest-sftpserver/"

[project.optional-dependencies]
testing = [ "tox",]

[tool.setuptools]
zip-safe = false
include-package-data = false

[project.entry-points.pytest11]
sftpserver = "pytest_sftpserver.plugin"

[tool.setuptools.package-data]
pytest_sftpserver = [ "keys/*.pub", "keys/*.priv",]

[tool.setuptools.packages.find]
namespaces = false
