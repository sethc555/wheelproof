[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pexpect"
version = "4.9.0"
description = "Pexpect allows easy control of interactive console applications."
readme = {text = "\nPexpect is a pure Python module for spawning child applications; controlling\nthem; and responding to expected patterns in their output. Pexpect works like\nDon Libes' Expect. Pexpect allows your script to spawn a child application and\ncontrol it as if a human were typing commands.\n\nPexpect can be used for automating interactive applications such as ssh, ftp,\npasswd, telnet, etc. It can be used to automate setup scripts for duplicating\nsoftware package installations on different servers. It can be used for\nautomated software testing. Pexpect is in the spirit of Don Libes' Expect, but\nPexpect is pure Python.\n\nThe main features of Pexpect require the pty module in the Python standard\nlibrary, which is only available on Unix-like systems. Some features—waiting\nfor patterns from file descriptors or subprocesses—are also available on\nWindows.\n", content-type = "text/plain"}
license = {text = "ISC license"}
authors = [
    {name = "Noah Spurrier; Thomas Kluyver; Jeff Quast"},
    {email = "noah@noah.org"},
    {email = "thomas@kluyver.me.uk"},
    {email = "contact@jeffquast.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Shells",
    "Topic :: System :: Software Distribution",
    "Topic :: Terminals",
]
dependencies = ["ptyprocess>=0.5"]

[project.urls]
Homepage = "https://pexpect.readthedocs.io/"
"Bug Tracker" = "https://github.com/pexpect/pexpect/issues"
Documentation = "https://pexpect.readthedocs.io/"
"Source Code" = "https://github.com/pexpect/pexpect"
History = "https://pexpect.readthedocs.io/en/stable/history.html"

[tool.setuptools]
platforms = ["UNIX"]
packages = ["pexpect"]
include-package-data = false

[tool.setuptools.package-data]
pexpect = ["bashrc.sh"]

[tool.distutils.bdist_wheel]
universal = true
