[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "inflection"
version = "0.5.1"
description = "A port of Ruby on Rails inflector to Python"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Natural Language :: English", "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy",]
requires-python = ">=3.5"

[[project.authors]]
name = "Janne Vanhala"
email = "janne.vanhala@gmail.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/jpvanhal/inflection"

[tool.setuptools]
packages = [ "inflection",]
zip-safe = false
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
inflection = [ "py.typed",]
