[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "iterators"
version = "0.2.0"
description = "Iterator utility classes and functions"
keywords = [ "ITERATOR", "TIMEOUT", "SYNC",]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules",]
requires-python = ">=3.6"
[[project.authors]]
name = "leangaurav"
email = "leangaurav.me@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/leangaurav/pypi_iterator"
Download = "https://github.com/leangaurav/pypi_iterator/archive/v_0.2.0.tar.gz"

[tool.setuptools]
packages = [ "iterators",]
include-package-data = false
