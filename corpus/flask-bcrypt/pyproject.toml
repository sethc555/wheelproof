[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Flask-Bcrypt"
version = "1.0.1"
description = "Brcrypt hashing for Flask."
classifiers = [ "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Topic :: Internet :: WWW/HTTP :: Dynamic Content", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = [ "Flask", "bcrypt>=3.1.1",]
[[project.authors]]
name = "Max Countryman"
email = "maxc@me.com"

[project.license]
text = "BSD"

[project.readme]
file = "README.markdown"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/maxcountryman/flask-bcrypt"

[tool.setuptools]
py-modules = [ "flask_bcrypt",]
zip-safe = false
platforms = [ "any",]
include-package-data = false
