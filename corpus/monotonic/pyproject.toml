[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "monotonic"
version = "1.6"
description = "An implementation of time.monotonic() for Python 2 & < 3.3"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 2", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries :: Python Modules",]
[[project.authors]]
name = "Ori Livneh"
email = "ori@wikimedia.org"

[project.license]
text = "Apache"

[project.readme]
text = "monotonic\n~~~~~~~~~\n\nThis module provides a ``monotonic()`` function which returns the\nvalue (in fractional seconds) of a clock which never goes backwards.\n\nOn Python 3.3 or newer, ``monotonic`` will be an alias of\n``time.monotonic`` from the standard library. On older versions,\nit will fall back to an equivalent implementation:\n\n+------------------+----------------------------------------+\n| Linux, BSD, AIX  | ``clock_gettime(3)``                   |\n+------------------+----------------------------------------+\n| Windows          | ``GetTickCount`` or ``GetTickCount64`` |\n+------------------+----------------------------------------+\n| OS X             | ``mach_absolute_time``                 |\n+------------------+----------------------------------------+\n\nIf no suitable implementation exists for the current platform,\nattempting to import this module (or to import from it) will\ncause a ``RuntimeError`` exception to be raised."
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/atdt/monotonic"

[tool.setuptools]
py-modules = [ "monotonic",]
include-package-data = false
