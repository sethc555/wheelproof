[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-trace"
version = "1.19.0"
description = "Google Cloud Trace API client library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache 2.0"}
authors = [
    {name = "Google LLC"},
    {email = "googleapis-packages@google.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
requires-python = ">=3.9"
dependencies = [
    "google-api-core[grpc] >= 2.11.0, <3.0.0",
    "google-auth >= 2.14.1, <3.0.0,!=2.24.0,!=2.25.0",
    "grpcio >= 1.33.2, < 2.0.0",
    "grpcio >= 1.75.1, < 2.0.0; python_version >= '3.14'",
    "proto-plus >= 1.22.3, <2.0.0",
    "proto-plus >= 1.25.0, <2.0.0; python_version >= '3.13'",
    "protobuf >= 4.25.8, < 8.0.0",
]

[project.urls]
Homepage = "https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-trace"

[tool.setuptools]
include-package-data = true
platforms = ["Posix; MacOS X; Windows"]
packages = [
    "google",
    "google.cloud",
    "google.cloud.trace",
    "google.cloud.trace_v1",
    "google.cloud.trace_v1.services",
    "google.cloud.trace_v1.services.trace_service",
    "google.cloud.trace_v1.services.trace_service.transports",
    "google.cloud.trace_v1.types",
    "google.cloud.trace_v2",
    "google.cloud.trace_v2.services",
    "google.cloud.trace_v2.services.trace_service",
    "google.cloud.trace_v2.services.trace_service.transports",
    "google.cloud.trace_v2.types",
]
