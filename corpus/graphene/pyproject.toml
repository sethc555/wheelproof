[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "graphene"
version = "3.4.3"
description = "GraphQL Framework for Python"
keywords = [ "api", "graphql", "protocol", "rest", "relay", "graphene",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Topic :: Software Development :: Libraries", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",]
dependencies = [ "graphql-core>=3.1,<3.3", "graphql-relay>=3.1,<3.3", "python-dateutil>=2.7.0,<3", "typing-extensions>=4.7.1,<5",]

[[project.authors]]
name = "Syrus Akbary"
email = "me@syrusakbary.com"

[project.license]
text = "MIT"

[project.readme]
text = "# ![Graphene Logo](http://graphene-python.org/favicon.png) [Graphene](http://graphene-python.org)  [![PyPI version](https://badge.fury.io/py/graphene.svg)](https://badge.fury.io/py/graphene) [![Coverage Status](https://coveralls.io/repos/graphql-python/graphene/badge.svg?branch=master&service=github)](https://coveralls.io/github/graphql-python/graphene?branch=master) [![](https://dcbadge.vercel.app/api/server/T6Gp6NFYHe?style=flat)](https://discord.gg/T6Gp6NFYHe)\n\n[���� Join the community on Discord](https://discord.gg/T6Gp6NFYHe)\n\n**We are looking for contributors**! Please check the current issues to see how you can help ������\n\n\n[Graphene](http://graphene-python.org) is an opinionated Python library for building GraphQL schemas/types fast and easily.\n\n- **Easy to use:** Graphene helps you use GraphQL in Python without effort.\n- **Relay:** Graphene has builtin support for Relay.\n- **Data agnostic:** Graphene supports any kind of data source: SQL (Django, SQLAlchemy), Mongo, custom Python objects, etc.\nWe believe that by providing a complete API you could plug Graphene anywhere your data lives and make your data available\nthrough GraphQL.\n\n\nGraphene has multiple integrations with different frameworks:\n\n| integration       | Package                                                                                 |\n| ----------------- | --------------------------------------------------------------------------------------- |\n| SQLAlchemy        | [graphene-sqlalchemy](https://github.com/graphql-python/graphene-sqlalchemy/)           |\n| Mongo             | [graphene-mongo](https://github.com/graphql-python/graphene-mongo/)                     |\n| Apollo Federation | [graphene-federation](https://github.com/graphql-python/graphene-federation/)           |\n| Django            | [graphene-django](https://github.com/graphql-python/graphene-django/)                   |\n\nAlso, Graphene is fully compatible with the GraphQL spec, working seamlessly with all GraphQL clients, such as [Relay](https://github.com/facebook/relay), [Apollo](https://github.com/apollographql/apollo-client) and [gql](https://github.com/graphql-python/gql).\n\n\nTo install `graphene`, just run this command in your shell\n\n```bash\npip install \"graphene>=3.1\"\n```\n\n\nHere is one example for you to get started:\n\n```python\nimport graphene\n\nclass Query(graphene.ObjectType):\nhello = graphene.String(description='A typical hello world')\n\ndef resolve_hello(self, info):\nreturn 'World'\n\nschema = graphene.Schema(query=Query)\n```\n\nThen Querying `graphene.Schema` is as simple as:\n\n```python\nquery = '''\nquery SayHello {\nhello\n}\n'''\nresult = schema.execute(query)\n```\n\nIf you want to learn even more, you can also check the following [examples](examples/):\n\n- **Basic Schema**: [Starwars example](examples/starwars)\n- **Relay Schema**: [Starwars Relay example](examples/starwars_relay)\n\n\nDocumentation and links to additional resources are available at\nhttps://docs.graphene-python.org/en/latest/\n\n\nAfter cloning this repo, create a [virtualenv](https://virtualenv.pypa.io/en/stable/) and ensure dependencies are installed by running:\n\n```sh\nvirtualenv venv\nsource venv/bin/activate\npip install -e \".[test]\"\n```\n\nWell-written tests and maintaining good test coverage is important to this project. While developing, run new and existing tests with:\n\n```sh\npytest graphene/relay/tests/test_node.py # Single file\npytest graphene/relay # All tests in directory\n```\n\nAdd the `-s` flag if you have introduced breakpoints into the code for debugging.\nAdd the `-v` (\"verbose\") flag to get more detailed test output. For even more detailed output, use `-vv`.\nCheck out the [pytest documentation](https://docs.pytest.org/en/latest/) for more options and test running controls.\n\nRegularly ensure your `pre-commit` hooks are up to date and enabled:\n\n```sh\npre-commit install\n```\n\nYou can also run the benchmarks with:\n\n```sh\npytest graphene --benchmark-only\n```\n\nGraphene supports several versions of Python. To make sure that changes do not break compatibility with any of those versions, we use `tox` to create virtualenvs for each Python version and run tests with that version. To run against all Python versions defined in the `tox.ini` config file, just run:\n\n```sh\ntox\n```\n\nIf you wish to run against a specific version defined in the `tox.ini` file:\n\n```sh\ntox -e py39\n```\n\nTox can only use whatever versions of Python are installed on your system. When you create a pull request, GitHub Actions pipelines will also be running the same tests and report the results, so there is no need for potential contributors to try to install every single version of Python on their own system ahead of time. We appreciate opening issues and pull requests to make graphene even more stable & useful!\n\n\nThe documentation is generated using the excellent [Sphinx](http://www.sphinx-doc.org/) and a custom theme.\n\nAn HTML version of the documentation is produced by running:\n\n```sh\nmake docs\n```"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/graphql-python/graphene"

[project.optional-dependencies]
test = [ "pytest>=8,<9", "pytest-benchmark>=4,<5", "pytest-cov>=5,<6", "pytest-mock>=3,<4", "pytest-asyncio>=0.16,<2", "coveralls>=3.3,<5",]
dev = [ "ruff==0.5.0", "types-python-dateutil>=2.8.1,<3", "mypy>=1.10,<2", "pytest>=8,<9", "pytest-benchmark>=4,<5", "pytest-cov>=5,<6", "pytest-mock>=3,<4", "pytest-asyncio>=0.16,<2", "coveralls>=3.3,<5",]
testing = [ "pytest>=8,<9", "pytest-benchmark>=4,<5", "pytest-cov>=5,<6", "pytest-mock>=3,<4", "pytest-asyncio>=0.16,<2", "coveralls>=3.3,<5",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "examples*",]
namespaces = false
