[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "workalendar"
version = "17.0.0"
description = "Worldwide holidays and working days helper and toolkit."
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",]
requires-python = ">=3.7"
dependencies = [ "python-dateutil", "lunardate", "backports.zoneinfo;python_version<\"3.9\"", "tzdata;platform_system==\"Windows\"", "convertdate", "pyluach", "importlib-metadata;python_version < \"3.8\"",]

[[project.authors]]
name = "Bruno Bord"
email = "bruno@jehaisleprintemps.net"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "https://github.com/workalendar/workalendar"

[project.optional-dependencies]
astronomy = [ "skyfield", "skyfield-data",]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
