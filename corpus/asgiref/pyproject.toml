[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "asgiref"
description = "ASGI specs, helper code, and adapters"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Internet :: WWW/HTTP",]
requires-python = ">=3.9"
dependencies = [ "typing_extensions>=4; python_version < \"3.11\"",]
dynamic = [ "version",]

[[project.authors]]
name = "Django Software Foundation"
email = "foundation@djangoproject.com"

[project.license]
text = "BSD-3-Clause"

[project.urls]
Homepage = "https://github.com/django/asgiref/"
Documentation = "https://asgi.readthedocs.io/"
"Further Documentation" = "https://docs.djangoproject.com/en/stable/topics/async/#async-adapter-functions"
Changelog = "https://github.com/django/asgiref/blob/master/CHANGELOG.txt"

[project.optional-dependencies]
tests = [ "pytest", "pytest-asyncio", "mypy>=1.14.0",]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.dynamic.version]
attr = "asgiref.__version__"
