[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "translationstring"
version = "1.4"
description = "Utility library for i18n relied on by various Repoze and Pyramid packages"
keywords = [ "i18n", "l10n", "internationalization", "localization", "gettext", "chameleon",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Software Development :: Internationalization", "Topic :: Software Development :: Localization", "License :: Repoze Public License",]
[[project.authors]]
name = "Chris McDonough"
email = "pylons-discuss@googlegroups.com"

[[project.authors]]
name = "Agendaless Consulting"

[project.license]
text = "BSD-like (http://repoze.org/license.html)"

[project.urls]
Homepage = "https://github.com/Pylons/translationstring"

[project.optional-dependencies]
docs = [ "Sphinx >= 1.3.1", "docutils", "pylons-sphinx-themes",]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
