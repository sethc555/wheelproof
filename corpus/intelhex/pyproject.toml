[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "intelhex"
version = "2.3.0"
description = "Python library for Intel HEX files manipulations"
keywords = [ "Intel", "HEX", "hex2bin", "HEX8",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9",]

[[project.authors]]
name = "Alexander Belchenko"
email = "alexander.belchenko@gmail.com"

[[project.maintainers]]
name = "Bert van Hall"
email = "bert.vanhall@gmx.de"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/python-intelhex/intelhex"

[tool.setuptools]
packages = [ "intelhex",]
script-files = [ "scripts/bin2hex.py", "scripts/hex2dump.py", "scripts/hexmerge.py", "scripts/hexinfo.py", "scripts/hexdiff.py", "scripts/hex2bin.py",]
include-package-data = false
