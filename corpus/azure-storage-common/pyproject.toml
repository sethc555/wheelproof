[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-storage-common"
version = "2.1.0"
description = "Microsoft Azure Storage Common Client Library for Python"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "MIT License"}
authors = [
    {name = "Microsoft Corporation", email = "ascl@microsoft.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "azure-common>=1.1.5",
    "cryptography",
    "python-dateutil",
    "requests",
    "azure-storage-nspkg; python_version<'3.0'",
]

[project.urls]
Homepage = "https://github.com/Azure/azure-storage-python"

[tool.setuptools]
include-package-data = false
packages = [
    "azure.storage.common",
    "azure.storage.common._http",
]

[tool.distutils.bdist_wheel]
universal = true
