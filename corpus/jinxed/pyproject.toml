[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "jinxed"
version = "2.0.4"
description = "Jinxed Terminal Library"
keywords = [ "terminal", "console", "blessed", "curses",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)", "Operating System :: POSIX", "Operating System :: Microsoft :: Windows", "Programming Language :: Python", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Terminals",]
dependencies = [ "ansicon; platform_system == \"Windows\"",]
[[project.authors]]
name = "Avram Lubkin"
email = "avylove@rockhopper.net"

[[project.maintainers]]
name = "Avram Lubkin"
email = "avylove@rockhopper.net"

[project.license]
text = "MPLv2.0"

[project.urls]
Homepage = "https://github.com/Rockhopper-Technologies/jinxed"

[project.optional-dependencies]
testing = [ "mock; python_version < \"3.3\"",]

[tool.setuptools]
zip-safe = false
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.packages.find]
exclude = [ "tests", "tests.*", "examples",]
namespaces = false
