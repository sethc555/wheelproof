[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cli-telemetry"
version = "1.1.0"
description = "Microsoft Azure CLI Telemetry Package"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "License :: OSI Approved :: MIT License",]
dependencies = [ "applicationinsights>=0.11.1,<0.12", "portalocker>=1.6,<3",]
[[project.authors]]
name = "Microsoft Corporation"
email = "azpycli@microsoft.com"

[project.license]
text = "MIT"

[project.readme]
text = "Microsoft Azure CLI Telemetry Package\n=====================================\n\nThis is the Microsoft Azure CLI Telemetry package. It is not intended to be installed directly by the end user.\n\nThis package includes:\n1. Support API for Azure CLI to gather telemetry.\n2. Telemetry upload process.\n\n\n\n.. :changelog:\n\nRelease History\n===============\n1.1.0\n+++++\n* Drop telemetry cache strategy. Records will be uploaded immediately\n\n1.0.8\n+++++\n* Keep storing telemetry to CLI AppInsights in local cache but send telemetry to other AppInsights immediately\n\n1.0.7\n+++++\n* Support specifying `telemetry.push_interval_in_hours` to force push telemetry cache file\n\n1.0.6\n+++++\n* Add `__version__` in `__init__.py`\n\n1.0.5\n+++++\n* Support PEP420 namespace package\n\n1.0.4\n+++++\n* MANIFEST file change to fix wheel install\n\n1.0.3\n+++++\n* Indicate Python 3.7 support\n\n1.0.2\n+++++\n* Minor fixes\n\n1.0.1\n+++++\n* Minor fixes\n\n1.0.0\n+++++\n* Initialize the azure-cli-telemetry package."
content-type = "text/plain"

[project.urls]
Homepage = "https://github.com/Azure/azure-cli"

[tool.setuptools]
packages = [ "azure.cli.telemetry", "azure.cli.telemetry.components",]
zip-safe = false
include-package-data = false
