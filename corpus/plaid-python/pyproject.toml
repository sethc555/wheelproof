[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "plaid-python"
version = "39.2.0"
description = "Python client library for the Plaid API and Link"
keywords = [ "api", "client", "plaid",]
classifiers = [ "Development Status :: 4 - Beta", "Programming Language :: Python", "Programming Language :: Python :: 3.7", "Topic :: Software Development :: Libraries :: Python Modules", "Environment :: Web Environment",]
requires-python = ">=3.6"
dependencies = [ "urllib3 >= 1.25.3", "python-dateutil", "nulltype",]

[[project.authors]]
name = "Plaid Inc."
email = "developers@plaid.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/plaid/plaid-python"
Download = "https://github.com/plaid/plaid-python/tarball/v39.2.0"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
readme = [ "README.md",]

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
