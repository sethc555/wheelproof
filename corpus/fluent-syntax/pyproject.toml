[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
version = "0.19.0"
name = "fluent.syntax"
description = "Localization library for expressive translations."
keywords = [ "fluent", "localization", "l10n",]
classifiers = [ "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3 :: Only",]
dependencies = [ "typing-extensions>=3.7,<5",]
[[project.authors]]
name = "Mozilla"
email = "l10n-drivers@mozilla.org"

[project.license]
text = "APL 2"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/projectfluent/python-fluent"

[tool.setuptools]
packages = [ "fluent.syntax",]
include-package-data = false

[tool.setuptools.package-data]
"fluent.syntax" = [ "py.typed",]
