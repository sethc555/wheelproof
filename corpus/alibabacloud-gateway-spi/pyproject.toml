[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "alibabacloud_gateway_spi"
version = "0.0.3"
description = "Alibaba Cloud Gateway SPI SDK Library for Python"
keywords = [ "alibabacloud", "gateway", "spi",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Topic :: Software Development",]
requires-python = ">=3.6"
dependencies = [ "alibabacloud_credentials>=0.3.4",]

[[project.authors]]
name = "Alibaba Cloud SDK"
email = "sdk-team@alibabacloud.com"

[project.license]
text = "Apache License 2.0"

[project.urls]
Homepage = "https://github.com/aliyun/alibabacloud-gateway"

[tool.setuptools]
include-package-data = true
platforms = [ "any",]

[tool.setuptools.packages.find]
exclude = [ "tests*",]
namespaces = false
