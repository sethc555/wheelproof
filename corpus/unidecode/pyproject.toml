[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "Unidecode"
version = "1.4.0"
description = "ASCII transliterations of Unicode text"
readme = "README.rst"
classifiers = [ "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Text Processing", "Topic :: Text Processing :: Filters",]
requires-python = ">=3.7"
[[project.authors]]
name = "Tomaz Solc"
email = "tomaz.solc@tablix.org"

[project.license]
text = "GPL"

[project.scripts]
unidecode = "unidecode.util:main"

[tool.setuptools]
packages = [ "unidecode",]
license-files = [ "LICENSE",]
include-package-data = false

[tool.setuptools.package-data]
unidecode = [ "py.typed",]
