[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "xlwt"
version = "1.3.0"
description = "Library to create spreadsheet files compatible with MS Excel 97/2000/XP/2003 XLS files, on any platform, with Python 2.6, 2.7, 3.3+"
keywords = [ "xls", "excel", "spreadsheet", "workbook", "worksheet", "pyExcelerator",]
readme = "README.rst"
classifiers = [ "Operating System :: OS Independent", "Programming Language :: Python", "License :: OSI Approved :: BSD License", "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Office/Business :: Financial :: Spreadsheet", "Topic :: Database", "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6",]

[[project.maintainers]]
name = "John Machin"
email = "sjmachin@lexicon.net"

[project.license]
text = "BSD"

[project.urls]
Homepage = "http://www.python-excel.org/"
Download = "https://pypi.python.org/pypi/xlwt"

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = [ "Platform", "Independent",]

[tool.setuptools.packages.find]
namespaces = false
