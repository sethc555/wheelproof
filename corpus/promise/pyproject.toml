[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "promise"
version = "2.3"
description = "Promises/A+ implementation for Python"
keywords = [ "concurrent", "future", "deferred", "promise",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Topic :: Software Development :: Libraries", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: Implementation :: PyPy", "License :: OSI Approved :: MIT License",]
dependencies = [ "typing>=3.6.4; python_version < '3.5'", "six",]

[[project.authors]]
name = "Syrus Akbary"
email = "me@syrusakbary.com"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/syrusakbary/promise"
Download = "https://github.com/syrusakbary/promise/releases"

[project.optional-dependencies]
test = [ "pytest>=2.7.3", "pytest-cov", "coveralls", "futures", "pytest-benchmark", "mock", "pytest-asyncio",]
testing = [ "pytest>=2.7.3", "pytest-cov", "coveralls", "futures", "pytest-benchmark", "mock", "pytest-asyncio",]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
promise = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "tests",]
namespaces = false
