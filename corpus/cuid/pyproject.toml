[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "cuid"
version = "0.4"
description = "Fast, scalable unique ID generation"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Operating System :: POSIX", "Programming Language :: Python", "Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = []

[[project.authors]]
name = "Rami Chowdhury"
email = "rami.chowdhury@gmail.com"

[[project.maintainers]]
name = "Rami Chowdhury"
email = "rami.chowdhury@gmail.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "http://github.com/necaris/cuid.py"
Download = "http://github.com/necaris/cuid.py/tarball/v0.4"

[tool.setuptools]
py-modules = [ "cuid",]
include-package-data = false
