[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "deprecation"
version = "2.1.0"
description = "A library to handle automated deprecations"
keywords = [ "deprecation",]
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python", "Programming Language :: Python :: 2", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy", "Topic :: Software Development :: Libraries :: Python Modules",]
dependencies = [ "packaging",]

[[project.authors]]
name = "Brian Curtin"
email = "brian@python.org"

[[project.maintainers]]
name = "Brian Curtin"
email = "brian@python.org"

[project.license]
text = "Apache 2"

[project.urls]
Homepage = "http://deprecation.readthedocs.io/"
Documentation = "http://deprecation.readthedocs.io/en/latest/"
Source = "https://github.com/briancurtin/deprecation"
"Bug Tracker" = "https://github.com/briancurtin/deprecation/issues"

[tool.setuptools]
py-modules = [ "deprecation",]
include-package-data = false
