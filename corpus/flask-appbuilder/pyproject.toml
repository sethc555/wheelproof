[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flask_appbuilder"
version = "5.2.1"
description = "Simple and rapid application development framework, built on top of Flask. includes detailed security, auto CRUD generation for your models, google charts and much more."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "BSD"}
authors = [
    {name = "Daniel Vaz Gaspar", email = "danielvazgaspar@gmail.com"},
]
requires-python = "~=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "apispec[yaml]>=6.0.0, <7",
    "colorama>=0.3.9, <1",
    "click>=8, <9",
    "email_validator>=1.0.5",
    "Flask>=2, <4",
    "Flask-Babel>=3, <5",
    "Flask-Limiter>3,<4",
    "Flask-Login>=0.3, <0.7",
    "Flask-SQLAlchemy>=2.4.0, <4",
    "Flask-WTF>=0.14.2, <2",
    "Flask-JWT-Extended>=4.0.0, <5.0.0",
    "jsonschema>=3, <5",
    "marshmallow>=3.18.0, <5",
    "marshmallow-sqlalchemy>=0.22.0, <3.0.0",
    "python-dateutil>=2.3, <3",
    "prison>=0.2.1, <1.0.0",
    "PyJWT>=2.0.0, <3.0.0",
    "SQLAlchemy>=1.4.0, <3",
    "sqlalchemy-utils>=0.32.21, <1",
    "WTForms<4",
    "werkzeug<4",
]

[project.urls]
Homepage = "https://github.com/dpgaspar/flask-appbuilder/"

[project.optional-dependencies]
jmespath = ["jmespath>=0.9.5"]
oauth = ["Authlib>=0.14, <2.0.0"]
saml = ["python3-saml>=1.15.0"]
talisman = ["flask-talisman>=1.0.0, <2.0"]

[project.entry-points."flask.commands"]
fab = "flask_appbuilder.cli:fab"

[tool.setuptools]
include-package-data = true
packages = [
    "flask_appbuilder",
    "flask_appbuilder.api",
    "flask_appbuilder.babel",
    "flask_appbuilder.charts",
    "flask_appbuilder.models",
    "flask_appbuilder.models.generic",
    "flask_appbuilder.models.sqla",
    "flask_appbuilder.security",
    "flask_appbuilder.security.saml",
    "flask_appbuilder.security.sqla",
    "flask_appbuilder.security.sqla.apis",
    "flask_appbuilder.security.sqla.apis.api_key",
    "flask_appbuilder.security.sqla.apis.group",
    "flask_appbuilder.security.sqla.apis.permission",
    "flask_appbuilder.security.sqla.apis.permission_view_menu",
    "flask_appbuilder.security.sqla.apis.role",
    "flask_appbuilder.security.sqla.apis.user",
    "flask_appbuilder.security.sqla.apis.view_menu",
    "flask_appbuilder.translations",
    "flask_appbuilder.utils",
]

[tool.setuptools.package-data]
"*" = ["LICENSE"]
