[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "mercantile"
version = "1.2.1"
description = "Web mercator XYZ tile utilities"
keywords = [ "mapping", "web", "mercator", "tiles",]
readme = "README.rst"
classifiers = [ "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: GIS",]
dependencies = [ "click>=3.0",]

[[project.authors]]
name = "Sean Gillies"
email = "sean@mapbox.com"

[project.license]
text = "BSD"

[project.urls]
Homepage = "https://github.com/mapbox/mercantile"

[project.optional-dependencies]
dev = [ "check-manifest",]
test = [ "hypothesis", "pytest",]

[project.scripts]
mercantile = "mercantile.scripts:cli"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "ez_setup", "examples", "tests",]
namespaces = false
