[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "lifelines"
version = "0.30.3"
description = "Survival analysis in Python, including Kaplan Meier, Nelson Aalen and regression"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Topic :: Scientific/Engineering",]
requires-python = ">=3.11"
dependencies = [ "numpy>=1.14.0", "scipy>=1.7.0", "pandas>=2.1,<3.0", "matplotlib>=3.0", "autograd>=1.5", "autograd-gamma>=0.3", "formulaic>=0.2.2",]

[[project.authors]]
name = "Cameron Davidson-Pilon"
email = "cam.davidson.pilon@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/CamDavidsonPilon/lifelines"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
lifelines = [ "datasets/*",]

[tool.setuptools.packages.find]
exclude = [ "*.tests",]
namespaces = false
