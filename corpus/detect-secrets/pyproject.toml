[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "detect_secrets"
version = "1.5.0"
description = "Tool for detecting secrets in the codebase"
keywords = [ "secret-management", "pre-commit", "security", "entropy-checks",]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Intended Audience :: Developers", "Topic :: Software Development", "Topic :: Utilities", "Environment :: Console", "Operating System :: OS Independent", "Development Status :: 5 - Production/Stable", "Typing :: Typed",]
dependencies = [ "pyyaml", "requests",]
[[project.authors]]
name = "Yelp"
email = "opensource@yelp.com"

[[project.authors]]
name = "Inc."

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Yelp/detect-secrets"
Download = "https://github.com/Yelp/detect-secrets/archive/1.5.0.tar.gz"

[project.optional-dependencies]
word_list = [ "pyahocorasick",]
gibberish = [ "gibberish-detector",]

[project.scripts]
detect-secrets = "detect_secrets.main:main"
detect-secrets-hook = "detect_secrets.pre_commit_hook:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
detect_secrets = [ "py.typed",]

[tool.setuptools.packages.find]
exclude = [ "test*", "tmp*",]
namespaces = false
