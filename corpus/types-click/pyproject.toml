[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "types-click"
version = "7.1.8"
description = "Typing stubs for click"
classifiers = [ "License :: OSI Approved :: Apache Software License", "Typing :: Typed",]
dependencies = []

[project.license]
text = "Apache-2.0 license"

[project.readme]
text = "## Typing stubs for click\n\nThis is a PEP 561 type stub package for the `click` package.\nIt can be used by type-checking tools like mypy, PyCharm, pytype etc. to check code\nthat uses `click`. The source for this package can be found at\nhttps://github.com/python/typeshed/tree/master/stubs/click. All fixes for\ntypes and metadata should be contributed there.\n\n*Note:* The `click` package includes type annotations or type stubs\nsince version 8.0. Please uninstall the `types-click`\npackage if you use this or a newer version.\n\n\nSee https://github.com/python/typeshed/blob/master/README.md for more details.\nThis package was generated from typeshed commit `2445eddb4b67fdaa58ec7c2113ff1542021a6206`."
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/python/typeshed"

[tool.setuptools]
packages = [ "click-stubs",]
include-package-data = false

[tool.setuptools.package-data]
click-stubs = [ "__init__.pyi", "_termui_impl.pyi", "core.pyi", "decorators.pyi", "exceptions.pyi", "formatting.pyi", "globals.pyi", "parser.pyi", "termui.pyi", "testing.pyi", "types.pyi", "utils.pyi", "METADATA.toml",]
