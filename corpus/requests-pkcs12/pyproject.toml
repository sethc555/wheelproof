[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "requests_pkcs12"
version = "1.27"
description = "Add PKCS"
readme = "README.rst"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: ISC License (ISCL)", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries",]
requires-python = ">=3.7"
dependencies = [ "cryptography (>=42.0.0)", "requests (>=2.32.5)",]

[[project.authors]]
name = "Volker Diels-Grabsch"
email = "volker.diels-grabsch@m-click.aero"

[project.license]
text = "ISC"

[project.urls]
Homepage = "https://github.com/m-click/requests_pkcs12"

[project.optional-dependencies]
dev = [ "build (>=1.3.0)", "twine (>=3.4.2)", "wheel (>=0.37.0)",]

[tool.setuptools]
py-modules = [ "requests_pkcs12",]
include-package-data = false
