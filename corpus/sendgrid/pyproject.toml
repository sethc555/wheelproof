[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "sendgrid"
version = "6.12.5"
description = "Twilio SendGrid library for Python"
readme = "README.rst"
classifiers = [ "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
dependencies = [ "python_http_client>=3.2.1", "cryptography>=45.0.6", "werkzeug>=0.11.15,<1.0.0 ; python_version < '3.0'", "werkzeug>=0.15.0,<2.0.0 ; python_version >= '3.0' and python_version < '3.7'", "werkzeug>=0.15.0,<2.3.0 ; python_version >= '3.0' and python_version < '3.8'", "werkzeug>=0.16.0,<3.1.0 ; python_version >= '3.0' and python_version < '3.9'", "werkzeug>=1.0.0 ; python_version >= '3.9'", "werkzeug>=2.2.0 ; python_version >= '3.11'", "werkzeug>=2.3.5 ; python_version >= '3.12'",]

[[project.authors]]
name = "Elmer Thomas"
email = "help@twilio.com"

[[project.authors]]
name = "Yamil Asusta"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/sendgrid/sendgrid-python/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [ "temp*.py",]
namespaces = false
