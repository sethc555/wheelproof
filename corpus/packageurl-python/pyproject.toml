[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "packageurl-python"
version = "0.17.6"
description = "A purl aka. Package URL parser and builder"
readme = "README.rst"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Libraries", "Topic :: Utilities", "Typing :: Typed",]
keywords = [ "package", "url", "package manager", "package url",]
requires-python = ">=3.8"
dependencies = []

[[project.authors]]
name = "the purl authors"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/package-url/packageurl-python"

[project.optional-dependencies]
lint = [ "isort", "black", "mypy",]
test = [ "pytest",]
build = [ "setuptools", "wheel",]
sqlalchemy = [ "sqlalchemy >= 2.0.0",]

[tool.setuptools]
include-package-data = true
zip-safe = false
license-files = [ "- mit.LICENSE", "- AUTHORS.rst", "- README.rst", "- CONTRIBUTING.rst", "- CHANGELOG.rst",]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
packageurl-python = [ "py.typed",]

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false
