[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "chevron"
version = "0.14.0"
description = "Mustache templating language renderer"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 2.6", "Programming Language :: Python :: 2.7", "Programming Language :: Python :: 3.2", "Programming Language :: Python :: 3.3", "Programming Language :: Python :: 3.4", "Programming Language :: Python :: 3.5", "Programming Language :: Python :: 3.6", "Topic :: Text Processing :: Markup",]

[[project.authors]]
name = "noah morrison"
email = "noah@morrison.ph"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/noahmorrison/chevron"

[project.scripts]
chevron = "chevron:cli_main"

[tool.setuptools]
packages = [ "chevron",]
include-package-data = false
