[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "pkce"
version = "1.0.3"
description = "PKCE Pyhton generator."
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Typing :: Typed",]
requires-python = ">=3"

[[project.authors]]
name = "Roméo Després"
email = "despres.romeo@gmail.com"

[project.license]
text = "MIT"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/RomeoDespres/pkce"

[tool.setuptools]
packages = [ "pkce",]
zip-safe = false
include-package-data = false

[tool.setuptools.package-data]
pkce = [ "py.typed",]
