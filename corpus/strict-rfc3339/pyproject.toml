[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-rfc3339"
version = "0.7"
description = "Strict, simple, lightweight RFC3339 functions"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "GNU General Public License Version 3"}
authors = [
    {name = "Daniel Richman, Adam Greig"},
    {email = "main@danielrichman.co.uk"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "http://www.danielrichman.co.uk/libraries/strict-rfc3339.html"

[tool.setuptools]
py-modules = ["strict_rfc3339"]
include-package-data = false
