[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-cli"
version = "3.86.0"
description = "Oracle Cloud Infrastructure CLI"
readme = "README.rst"
license = {text = "Universal Permissive License 1.0 or Apache License 2.0"}
authors = [
    {name = "Oracle"},
    {email = "rajditya.shahdeo@oracle.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: Universal Permissive License (UPL)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.6"
dependencies = [
    "oci==2.178.0",
    "arrow>=1.0.0,<2.0.0",
    "certifi>=2025.1.31,<2026.0.0",
    "click<=8.1.2",
    "cryptography>=3.2.1,<47.0.0",
    "jmespath>=0.10.0,<=1.0.1",
    "python-dateutil>=2.5.3,<3.0.0",
    "pytz>=2016.10,<=2026.2",
    "six>=1.15.0,<2.0.0",
    "terminaltables==3.1.10",
    "pyOpenSSL>=17.5.0,<27.0.0",
    "PyYAML>=5.4,<=6.0.2",
    "prompt-toolkit>=3.0.38,<=3.0.43; python_version > \"3.6\"",
    "prompt-toolkit==3.0.29; python_version == \"3.6\"",
    "setuptools>=78.1.1,<81; python_version >= \"3.12\"",
]

[project.optional-dependencies]
db = [
    "cx_Oracle==8.3",
]

[project.urls]
"Homepage" = "https://docs.cloud.oracle.com/iaas/Content/API/Concepts/cliconcepts.htm"

[project.scripts]
"oci" = "oci_cli.cli:cli"
"create_backup_from_onprem" = "oci_cli.scripts.database.dbaas:create_backup_from_onprem"

