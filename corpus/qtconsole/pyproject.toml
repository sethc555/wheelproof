[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "qtconsole"
version = "5.7.2"
description = "Jupyter Qt console"
keywords = [ "Interactive", "Interpreter", "Shell",]
classifiers = [ "Intended Audience :: Developers", "Intended Audience :: System Administrators", "Intended Audience :: Science/Research", "License :: OSI Approved :: BSD License", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",]
requires-python = ">= 3.9"
dependencies = [ "traitlets!=5.2.1,!=5.2.2", "jupyter_core", "jupyter_client>=4.1", "pygments", "ipykernel>=4.1", "ipython_pygments_lexers", "qtpy>=2.4.0", "packaging",]

[[project.authors]]
name = "Jupyter Development Team"
email = "spyder.python@gmail.com"

[[project.maintainers]]
name = "Spyder Development Team"

[project.license]
text = "BSD"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "http://jupyter.org"

[project.optional-dependencies]
test = [ "flaky", "pytest", "pytest-qt", "pytest-asyncio",]
doc = [ "Sphinx>=1.3",]

[project.gui-scripts]
jupyter-qtconsole = "qtconsole.qtconsoleapp:main"

[tool.setuptools]
packages = [ "qtconsole", "qtconsole.tests",]
platforms = [ "Linux", "Mac", "OS", "X", "Windows",]
include-package-data = false

[tool.setuptools.package-data]
qtconsole = [ "resources/icon/*.svg",]
